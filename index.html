<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엠나인 음악용어 위키</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 왼쪽에 분류 목차, 오른쪽에 항목 본문을 두는 사전형 2단 구성. 머리말 아래 오선 줄무늬가 유일한 장식. */
:root{
  --paper:#f3f5f8;
  --surface:#ffffff;
  --ink:#17202c;
  --ink-soft:#56627a;
  --line:#d5dbe5;
  --accent:#3346b3;
  --accent-soft:#e6e9f8;
  --c-th:#3346b3; --c-ar:#0f7a6c; --c-fi:#b0412f; --c-ga:#7a3fb0; --c-pr:#a36a00; --c-mx:#28708f; --c-ge:#b03a7a; --c-ko:#4d7c0f; --c-ki:#0e7490; --c-in:#475569;
  --f-display:"Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11151c; --surface:#1a202a; --ink:#e8ecf3; --ink-soft:#9aa6bb; --line:#2e3746;
    --accent:#9aa8ff; --accent-soft:#252c4a;
    --c-th:#9aa8ff; --c-ar:#5fd0bf; --c-fi:#f08f7d; --c-ga:#c79bf2; --c-pr:#e5b455; --c-mx:#7cc4e2; --c-ge:#f29ac4; --c-ko:#a8d672; --c-ki:#67d3e6; --c-in:#b3bfd1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11151c; --surface:#1a202a; --ink:#e8ecf3; --ink-soft:#9aa6bb; --line:#2e3746;
  --accent:#9aa8ff; --accent-soft:#252c4a;
  --c-th:#9aa8ff; --c-ar:#5fd0bf; --c-fi:#f08f7d; --c-ga:#c79bf2; --c-pr:#e5b455; --c-mx:#7cc4e2; --c-ge:#f29ac4; --c-ko:#a8d672; --c-ki:#67d3e6; --c-in:#b3bfd1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}

.only{background:var(--ink);color:var(--paper);text-align:center;font-weight:600;font-size:.98rem;letter-spacing:.02em;padding:9px 16px;line-height:1.5}
.only span{display:inline-block;border:1px solid currentColor;border-radius:4px;padding:0 8px;margin-right:8px;font-size:.8rem;vertical-align:1px}
.notice{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border:2px solid var(--ink);border-radius:8px;background:var(--surface);padding:10px 14px;margin:0 0 20px;font-weight:600}
.notice small{font-weight:400;color:var(--ink-soft);font-size:.88rem}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:18px 20px 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.brand{display:flex;flex-direction:column;gap:0;margin-right:auto}
.brand a{color:var(--ink);font-family:var(--f-display);font-size:1.45rem;font-weight:700;line-height:1.3}
.brand a:hover{text-decoration:none;color:var(--accent)}
.brand span{font-size:.82rem;color:var(--ink-soft)}
.search{flex:1 1 280px;max-width:420px;position:relative}
.search input{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.search input::placeholder{color:var(--ink-soft)}
.staff{height:17px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 4px);background-size:100% 17px;max-width:1180px;margin:0 auto;opacity:.9}

.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 64px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px}
nav.side{align-self:start;position:sticky;top:16px;display:flex;flex-direction:column;gap:18px;font-size:.93rem}
.side h2{font-size:.76rem;font-weight:600;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.04em}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink)}
.side a:hover{background:var(--accent-soft);text-decoration:none}
.side a[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.side .n{margin-left:auto;color:var(--ink-soft);font-size:.8rem;font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--accent)}
.rand{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;text-align:left}
.rand:hover{border-color:var(--accent)}

main{min-width:0}
h1{font-family:var(--f-display);font-size:2rem;line-height:1.3;margin:0;text-wrap:balance}
h2.sec{font-family:var(--f-display);font-size:1.2rem;margin:36px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lede{max-width:66ch;margin:12px 0 0}
.cnt{font-family:var(--f-body);font-size:.8rem;font-weight:400;color:var(--ink-soft);margin-left:4px}
.crumb{font-size:.86rem;color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.en{color:var(--ink-soft);font-size:1.02rem;margin:4px 0 0}
.aka{font-size:.92rem;color:var(--ink-soft);margin:8px 0 0}
.aka b{font-weight:600;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--surface);color:var(--ink)}
.body{max-width:66ch;margin-top:20px}
.body p{margin:0 0 14px}
.tip{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;margin:20px 0 0;max-width:66ch}
.tip b{display:block;font-size:.82rem;color:var(--ink-soft);font-weight:600;margin-bottom:2px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.links a{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:.93rem}
.links a:hover{border-color:var(--accent);text-decoration:none}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:.93rem}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:1.05rem}
.card p{margin:0;font-size:.9rem;color:var(--ink-soft);line-height:1.6}
.card .more{font-size:.88rem;margin-top:auto}
.path{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:10px}
.path h3{margin:0 0 4px;font-size:1rem}
.path p{margin:0 0 10px;font-size:.92rem;color:var(--ink-soft)}
.path ol{margin:0;padding-left:1.3em;display:flex;flex-wrap:wrap;gap:2px 26px}
.path li{font-size:.95rem}

.list{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line);padding:10px 2px;display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:4px 18px}
.list .t a{font-weight:600}
.list .t small{display:block;color:var(--ink-soft);font-size:.8rem;line-height:1.4}
.list .d{font-size:.92rem;color:var(--ink-soft);line-height:1.6}
.idx h3{font-family:var(--f-display);font-size:1.1rem;margin:22px 0 6px;color:var(--accent)}
.empty{color:var(--ink-soft);margin-top:16px}
footer{max-width:1180px;margin:0 auto;padding:0 20px 40px;color:var(--ink-soft);font-size:.84rem}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:16px}
  nav.side{position:static;gap:10px}
  .side ul{flex-direction:row;flex-wrap:wrap;gap:6px}
  .side a{border:1px solid var(--line);background:var(--surface);padding:3px 10px}
  .side .n{margin-left:2px}
  h1{font-size:1.6rem}
  .list li{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="only" role="note"><span>수강생 전용</span>엠나인아카데미 수강생 전용 학습자료</div>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <a href="#home">엠나인 음악용어 위키</a>
      <span>게임음악·영상음악을 공부하는 수강생을 위한 용어 사전</span>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="용어 검색 (한글·영문) 예: 루프, 컴프, 자진모리" autocomplete="off" aria-label="용어 검색">
    </div>
  </div>
  <div class="staff" aria-hidden="true"></div>
</header>
<div class="wrap">
  <nav class="side" aria-label="목차">
    <div>
      <h2>분류</h2>
      <ul id="catnav"></ul>
    </div>
    <div>
      <h2>찾아보기</h2>
      <ul>
        <li><a href="#home" data-nav="home">대문</a></li>
        <li><a href="#all" data-nav="all">가나다순 전체 목록</a></li>
      </ul>
    </div>
    <button class="rand" id="rand" type="button">아무 항목이나 하나 읽기</button>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<footer><strong>엠나인아카데미 수강생 전용 학습자료</strong>입니다. 라우드니스 기준처럼 프로젝트와 플랫폼에 따라 달라지는 수치는 실제 작업 전에 납품 규격서를 다시 확인하세요.</footer>

<script>
var CATS={
  th:{name:"음악 이론",desc:"음정, 음계, 화성, 리듬처럼 작곡의 바탕이 되는 개념입니다. 레퍼런스 곡을 분석할 때 쓰는 말이 대부분 여기에 있습니다."},
  ar:{name:"편곡·오케스트레이션",desc:"악기를 고르고 배치하는 일과 관련된 용어입니다. 연주법 표기도 여기서 찾으세요."},
  fi:{name:"영상음악",desc:"영화·드라마·광고 음악 작업 현장에서 쓰는 말입니다. 감독, 편집자와 대화할 때 필요합니다."},
  ga:{name:"게임음악",desc:"플레이 상황에 따라 바뀌는 음악을 설계하고 게임에 넣는 과정에서 쓰는 용어입니다."},
  pr:{name:"작곡 도구·MIDI",desc:"DAW, 가상악기, 신시사이저를 다룰 때 나오는 용어입니다."},
  mx:{name:"믹싱·마스터링",desc:"음원을 다듬어 납품 규격에 맞추는 단계의 용어입니다."},
  ge:{name:"장르·스타일",desc:"의뢰서와 레퍼런스에 자주 나오는 장르 이름입니다. 장르마다 템포, 리듬, 악기 구성에서 무엇이 특징인지 적었습니다."},
  ko:{name:"국악 용어",desc:"장단, 시김새, 음계, 갈래와 악곡, 합주 편성처럼 국악을 이해하는 데 필요한 말입니다. 한국풍, 사극풍 음악을 쓸 때 먼저 읽으세요."},
  ki:{name:"국악기",desc:"국악기 하나하나의 구조, 음색, 합주에서 맡는 역할입니다. 현악기, 관악기, 타악기로 나눠 실었습니다."},
  in:{name:"악기",desc:"악기 하나하나의 음역, 소리 내는 원리, 자주 맡는 역할입니다. 지역과 시대별로 묶어 실었습니다. 국악기는 국악기 분류에 따로 있습니다."}
};
var TERMS=[];
function T(id,ko,en,cat,def,tip,rel){TERMS.push({id:id,ko:ko,en:en,cat:cat,def:def,tip:tip,rel:rel?rel.split(" "):[]});}

/* ───── 음악 이론 ───── */
T("interval","음정","Interval","th","두 음 사이의 높이 차이입니다. 도와 미처럼 3도, 도와 솔처럼 5도라고 세고, 여기에 장·단·완전·증·감이라는 성질을 붙여 구분합니다.","멜로디가 주는 인상은 음정에서 많이 결정됩니다. 좋아하는 테마곡의 첫 두 음이 몇 도인지부터 적어 보세요. 완전5도로 뛰어오르는 시작은 영웅 테마에 자주 나옵니다.","scale chord dissonance");
T("scale","음계","Scale","th","한 옥타브 안의 음을 높이 순서로 늘어놓은 것입니다. 어떤 음을 쓰고 음 사이 간격을 어떻게 두느냐에 따라 장음계, 단음계, 선법 등으로 나뉩니다.","곡의 분위기를 바꾸고 싶을 때 코드보다 음계를 먼저 바꿔 보세요. 같은 멜로디 윤곽이라도 음계가 달라지면 지역색과 감정이 달라집니다.","key mode pentatonic major-minor");
T("key","조성","Key / Tonality","th","곡이 어떤 음을 중심(으뜸음)으로 삼고 있는지를 말합니다. 다장조, 가단조처럼 으뜸음과 장·단을 함께 부릅니다.","게임에서는 이어서 재생될 곡끼리 조성을 맞춰 두면 전환이 자연스럽습니다. 필드 곡과 전투 곡의 조성 관계를 기획 단계에서 정해 두세요.","major-minor modulation transition");
T("major-minor","장조와 단조","Major / Minor","th","장음계로 된 조성이 장조, 단음계로 된 조성이 단조입니다. 으뜸음에서 3번째 음까지의 거리가 장3도면 장조, 단3도면 단조입니다.","장조는 밝고 단조는 어둡다는 설명은 출발점일 뿐입니다. 템포, 편성, 음역에 따라 장조로도 쓸쓸한 곡을 쓸 수 있으니 레퍼런스에서 반례를 찾아보세요.","key scale mode modal-interchange");
T("mode","선법(모드)","Mode","th","장음계의 음을 그대로 쓰되 시작음을 바꿔서 만든 일곱 가지 음계입니다. 아이오니안, 도리안, 프리지안, 리디안, 믹솔리디안, 에올리안, 로크리안이 있습니다.","게임·영상음악에서는 장조와 단조만으로 표현하기 어려운 색을 선법으로 만듭니다. 선법마다 특징이 되는 음 하나를 먼저 외우세요.","dorian phrygian lydian mixolydian scale");
T("dorian","도리안","Dorian","th","자연단음계에서 6번째 음을 반음 올린 선법입니다. 단조의 어두움은 남아 있지만 6음 덕분에 덜 무겁게 들립니다.","중세풍 마을, 켈틱 분위기의 필드 음악에서 자주 들립니다. i–IV 진행(예: Dm–G)을 반복해 보면 도리안의 색이 바로 드러납니다.","mode phrygian exploration-music");
T("phrygian","프리지안","Phrygian","th","자연단음계에서 2번째 음을 반음 내린 선법입니다. 으뜸음 바로 위에 반음이 있어서 긴장감이 강합니다.","사막, 고대 유적, 위협적인 적 진영 음악에 많이 씁니다. 3음까지 올린 프리지안 도미넌트는 중동풍 색채가 더 뚜렷합니다.","mode dorian battle-music");
T("lydian","리디안","Lydian","th","장음계에서 4번째 음을 반음 올린 선법입니다. 올린 4음이 위로 떠오르는 듯한 밝고 신비로운 인상을 줍니다.","영화음악에서 경이로움, 비행, 마법 장면에 자주 쓰입니다. I–II 진행(예: C–D)을 페달 포인트 위에 얹어 보세요.","mode mixolydian pedal-point");
T("mixolydian","믹솔리디안","Mixolydian","th","장음계에서 7번째 음을 반음 내린 선법입니다. 장조의 밝음에 약간의 거친 느낌이 더해집니다.","모험, 해적, 록 기반 게임음악에서 흔합니다. I–♭VII–IV 진행이 대표적입니다.","mode lydian modal-interchange");
T("pentatonic","펜타토닉","Pentatonic Scale","th","한 옥타브에 다섯 음만 쓰는 음계입니다. 장음계에서 4음과 7음을 뺀 메이저 펜타토닉이 가장 많이 쓰입니다.","반음 관계가 없어서 어떤 음을 겹쳐도 크게 부딪히지 않습니다. 동양풍 음악이나, 여러 레이어가 무작위로 겹치는 게임음악을 설계할 때 유용합니다.","scale generative");
T("chromatic","반음계","Chromatic Scale","th","한 옥타브의 12음을 모두 반음 간격으로 늘어놓은 음계입니다. 조성에 속하지 않는 음을 쓰는 것을 '반음계적'이라고 말하기도 합니다.","반음계로 내려가는 베이스나 내성은 불안, 추락, 슬픔을 표현할 때 효과가 큽니다.","scale dissonance chromatic-mediant");
T("whole-tone","온음음계","Whole-Tone Scale","th","모든 음 사이가 온음인 6음 음계입니다. 반음이 없어서 으뜸음이 어디인지 느끼기 어렵습니다.","꿈, 회상, 물속 장면처럼 현실감이 흐려지는 순간에 씁니다. 길게 쓰면 금방 단조로워지니 짧게 쓰세요.","octatonic scale");
T("octatonic","옥타토닉 음계","Octatonic (Diminished) Scale","th","온음과 반음이 번갈아 나오는 8음 음계입니다. 디미니시드 스케일이라고도 부릅니다.","서스펜스와 액션 스코어에서 긴장을 유지할 때 자주 등장합니다. 감7화음과 잘 어울립니다.","whole-tone dissonance tension");
T("chord","화음(코드)","Chord","th","높이가 다른 음을 세 개 이상 동시에 울린 것입니다. 보통 3도씩 쌓아서 만듭니다.","코드 이름을 외우는 것보다 구성음을 바로 떠올릴 수 있는지가 중요합니다. 건반에서 12개 조로 짚는 연습을 하세요.","triad seventh voicing progression");
T("triad","3화음","Triad","th","근음, 3음, 5음으로 이루어진 세 음짜리 화음입니다. 장3화음, 단3화음, 증3화음, 감3화음 네 종류가 있습니다.","오케스트라 스코어는 의외로 단순한 3화음을 많이 씁니다. 화음이 단순해도 보이싱과 편성으로 충분히 풍성해집니다.","chord seventh inversion");
T("seventh","7화음","Seventh Chord","th","3화음 위에 7음을 하나 더 쌓은 네 음짜리 화음입니다. 메이저7, 도미넌트7, 마이너7, 하프디미니시드, 디미니시드7 등이 있습니다.","메이저7과 마이너7은 부드럽고 도시적인 색을, 도미넌트7은 다음 화음으로 가려는 힘을 줍니다.","triad tension secondary-dominant");
T("inversion","자리바꿈","Inversion","th","화음의 근음이 아닌 음을 가장 아래에 둔 형태입니다. 3음이 아래면 제1자리바꿈, 5음이 아래면 제2자리바꿈입니다.","베이스 라인을 순차적으로 움직이게 만들 때 씁니다. C–G/B–Am처럼 베이스가 한 음씩 내려가면 진행이 매끄럽습니다.","voicing chord progression");
T("voicing","보이싱","Voicing","th","화음의 구성음을 어느 높이에, 어떤 간격으로 배치하느냐를 말합니다. 같은 C 코드라도 보이싱에 따라 소리의 두께와 밝기가 달라집니다.","저음역에서는 음 사이를 넓게, 고음역에서는 좁게 두는 것이 기본입니다. 저음에서 3도를 좁게 겹치면 소리가 탁해집니다.","inversion orchestration range");
T("diatonic","다이어토닉","Diatonic","th","한 조의 음계에 속한 음만으로 이루어졌다는 뜻입니다. 다장조라면 흰 건반 일곱 음과, 그 음만으로 만든 일곱 화음이 다이어토닉입니다.","분석할 때 다이어토닉에서 벗어난 음과 화음에 표시를 하세요. 그 지점이 작곡가가 색을 바꾼 곳입니다.","key modal-interchange secondary-dominant");
T("progression","코드 진행","Chord Progression","th","화음이 이어지는 순서입니다. 조성 안에서의 위치를 로마 숫자(I, IV, V, vi)로 적으면 조가 달라도 같은 진행인지 비교할 수 있습니다.","루프 음악은 진행이 끝에서 처음으로 돌아갈 때도 자연스러워야 합니다. 마지막 화음과 첫 화음의 연결을 반드시 들어 보세요.","cadence harmonic-rhythm loop");
T("cadence","종지","Cadence","th","악구가 끝나는 지점의 화음 진행입니다. V–I로 끝나는 정격종지, IV–I의 변격종지, V에서 멈추는 반종지, V–vi로 빗겨 가는 거짓종지가 있습니다.","계속 반복되는 게임 BGM에서는 정격종지를 강하게 쓰면 곡이 끝난 느낌이 듭니다. 루프 끝은 반종지처럼 열어 두는 경우가 많습니다.","progression loop ending-tag");
T("modulation","전조","Modulation","th","곡 도중에 조성을 바꾸는 것입니다. 두 조에 공통으로 속한 화음을 거쳐 가는 방법과, 준비 없이 바로 바꾸는 방법이 있습니다.","후반부에 반음이나 온음 위로 전조하면 고조감이 생깁니다. 다만 루프 곡이라면 처음 조로 돌아오는 길까지 설계해야 합니다.","key chromatic-mediant transition");
T("secondary-dominant","세컨더리 도미넌트","Secondary Dominant","th","으뜸화음이 아닌 다른 화음을 잠시 으뜸처럼 여기고, 그 앞에 놓는 도미넌트 화음입니다. 다장조에서 G로 가기 전의 D7이 그 예입니다.","다이어토닉 진행이 밋밋할 때 한두 군데에 넣으면 진행에 추진력이 생깁니다.","seventh diatonic progression");
T("modal-interchange","차용화음","Modal Interchange / Borrowed Chord","th","으뜸음이 같은 다른 선법이나 조에서 화음을 빌려 오는 기법입니다. 다장조 곡에서 Fm, A♭, B♭을 쓰는 경우가 대표적입니다.","♭VI–♭VII–I 진행은 게임과 영화의 승리·영웅 테마에서 매우 자주 들립니다. 레퍼런스에서 직접 찾아보세요.","diatonic mode mixolydian chromatic-mediant");
T("chromatic-mediant","크로매틱 미디언트","Chromatic Mediant","th","근음이 3도 떨어져 있고 성질이 같은 두 화음의 관계입니다. C와 E, C와 A♭처럼 공통음이 하나뿐이라 조성 밖으로 미끄러지는 느낌이 납니다.","판타지·SF 영화음악의 신비롭고 장엄한 색은 상당 부분 이 진행에서 나옵니다. 장3화음끼리, 단3화음끼리 3도로 옮겨 보세요.","modal-interchange modulation chromatic");
T("tension","텐션","Tension","th","7화음 위에 더 쌓는 9음, 11음, 13음을 말합니다. 화음의 기능은 바꾸지 않고 색채만 더합니다. 넓은 뜻으로는 음악적 긴장 자체를 가리키기도 합니다.","텐션은 편성이 작을수록 잘 들립니다. 풀 오케스트라에서는 텐션을 많이 쌓기보다 한두 음만 골라 특정 악기에 맡기세요.","seventh sus dissonance");
T("sus","서스펜디드 코드","Suspended Chord (sus2, sus4)","th","3음 대신 2음이나 4음을 쓴 화음입니다. 3음이 없어서 장조인지 단조인지 드러나지 않습니다.","감정을 정하지 않고 열어 둬야 하는 장면에 좋습니다. 대화 아래 깔리는 언더스코어나 메뉴 화면 음악에 자주 씁니다.","chord tension underscore");
T("cluster","톤 클러스터","Tone Cluster","th","2도 간격으로 인접한 음을 여러 개 한꺼번에 울린 음 덩어리입니다. 화음이라기보다 음색에 가깝게 들립니다.","공포·스릴러 스코어에서 현악 클러스터가 대표적입니다. 가상악기로 만들 때는 각 파트를 따로 입력해야 덩어리가 살아납니다.","dissonance divisi tremolo");
T("dissonance","협화와 불협화","Consonance / Dissonance","th","두 음이 안정적으로 어울려 들리면 협화, 부딪혀서 해결을 원하는 듯 들리면 불협화라고 합니다. 2도, 7도, 증4도가 대표적인 불협화 음정입니다.","불협화는 틀린 소리가 아닙니다. 긴장을 만들고 푸는 재료입니다. 어디서 부딪히고 어디서 풀리는지를 곡 전체에서 계획하세요.","interval tension cluster");
T("counterpoint","대위법","Counterpoint","th","독립적인 선율 두 개 이상을 동시에 진행시키는 작곡 기법입니다. 각 선율이 따로 들어도 자연스러우면서 함께 울릴 때도 어울려야 합니다.","두 캐릭터의 테마를 한 장면에서 겹칠 때 필요한 기술입니다. 한 선율이 움직일 때 다른 선율은 길게 머무르게 하면 둘 다 들립니다.","countermelody texture theme");
T("pedal-point","페달 포인트","Pedal Point","th","베이스 등 한 성부가 같은 음을 계속 유지하는 동안 위의 화음이 바뀌는 기법입니다.","긴장을 서서히 쌓을 때 가장 쉽게 쓸 수 있는 방법입니다. 저음 현이나 신스 베이스로 으뜸음을 깔고 위에서 화음을 바꿔 보세요.","ostinato lydian underscore");
T("ostinato","오스티나토","Ostinato","th","짧은 리듬이나 음형을 계속 반복하는 것입니다. 반복되는 패턴 위에서 화음과 선율이 변화합니다.","현악 스피카토 오스티나토는 액션 음악의 기본 엔진입니다. 패턴은 그대로 두고 악센트 위치만 바꿔도 지루함이 줄어듭니다.","pedal-point spiccato battle-music");
T("motif","모티프(동기)","Motif","th","곡을 이루는 가장 작은 선율·리듬 단위입니다. 음 두세 개만으로도 모티프가 될 수 있습니다.","기억에 남는 테마는 대개 뚜렷한 모티프 하나에서 출발합니다. 리듬만 쳐도 곡이 떠오르는지 시험해 보세요.","theme variation leitmotif");
T("theme","주제(테마)","Theme","th","곡이나 작품을 대표하는 선율입니다. 모티프가 발전해서 완결된 악구가 된 것으로 볼 수 있습니다.","게임에서는 메인 테마를 필드, 전투, 엔딩 곡에 변형해 넣어 작품 전체의 통일감을 만듭니다.","motif variation leitmotif main-title");
T("variation","변주","Variation","th","주제의 윤곽은 알아볼 수 있게 남기면서 리듬, 화성, 조성, 편성 등을 바꾸는 것입니다.","같은 테마를 장조에서 단조로, 빠른 템포에서 느린 템포로 바꾸는 연습을 하세요. 한 테마로 여러 상황의 곡을 만드는 능력은 포트폴리오에서도 잘 드러납니다.","theme motif leitmotif");
T("form","형식","Form","th","곡의 큰 구조입니다. A–B–A, 인트로–벌스–코러스처럼 구간이 어떤 순서로 배치되는지를 나타냅니다.","게임 BGM은 '인트로 + 반복 구간' 형식이 많고, 영상음악은 화면 편집이 형식을 정합니다. 매체에 따라 형식을 결정하는 주체가 다릅니다.","intro-loop cue loop");
T("meter","박자","Meter / Time Signature","th","강박과 약박이 되풀이되는 단위입니다. 4/4, 3/4, 6/8처럼 한 마디에 어떤 음표가 몇 개 들어가는지로 표기합니다.","6/8은 3/4과 길이가 같아도 두 박으로 느껴집니다. 박자표보다 실제로 어디에 강세가 오는지를 들으세요.","tempo odd-meter syncopation");
T("tempo","템포(BPM)","Tempo / Beats Per Minute","th","음악의 빠르기입니다. 1분에 박이 몇 번 오는지를 BPM으로 나타냅니다.","영상음악에서는 장면 길이와 히트 포인트에 맞춰 템포를 계산합니다. 게임에서는 전환될 곡끼리 템포 관계를 미리 정해 두면 구현이 쉬워집니다.","meter tempo-map click-track rubato");
T("syncopation","싱코페이션(당김음)","Syncopation","th","강세가 원래 강박이 아닌 곳에 오는 리듬입니다. 약박의 음을 다음 강박까지 이어서 끌거나, 강박을 쉬는 방식으로 만듭니다.","리듬이 밋밋하게 들리면 멜로디의 시작점을 반 박 앞으로 당겨 보세요.","meter polyrhythm");
T("polyrhythm","폴리리듬","Polyrhythm","th","서로 다른 분할의 리듬을 동시에 연주하는 것입니다. 같은 시간 안에 2개와 3개를 함께 치는 2대3이 가장 기본입니다.","타악기 레이어를 쌓을 때 3대4 같은 폴리리듬을 섞으면 반복 구간이 덜 기계적으로 들립니다.","syncopation odd-meter ostinato");
T("odd-meter","변박·홀수 박자","Odd / Changing Meter","th","5/4, 7/8처럼 균등하게 나뉘지 않는 박자를 홀수 박자라 하고, 곡 중간에 박자가 바뀌는 것을 변박이라고 합니다.","7/8을 2+2+3으로 묶을지 3+2+2로 묶을지에 따라 느낌이 달라집니다. 전투 음악에서 불안정한 추진력을 만들 때 씁니다.","meter polyrhythm battle-music");
T("harmonic-rhythm","화성 리듬","Harmonic Rhythm","th","화음이 바뀌는 속도입니다. 한 마디에 한 번 바뀌는지, 두 박마다 바뀌는지를 말합니다.","템포를 그대로 두고도 화성 리듬을 빠르게 하면 곡이 급해지고, 느리게 하면 넓어집니다. 클라이맥스 직전에 조절해 보세요.","progression tempo");
T("dynamics","셈여림","Dynamics","th","소리의 크고 작음과 그 변화입니다. pp, p, mp, mf, f, ff로 표기합니다.","가상악기에서 셈여림은 음량만이 아니라 음색의 변화입니다. 볼륨 페이더가 아니라 모듈레이션 휠(CC1)로 표현해야 실제 연주처럼 들립니다.","crescendo expression-cc dynamic-range");
T("articulation","아티큘레이션","Articulation","th","음 하나하나를 어떻게 시작하고 끝내고 잇는지에 관한 연주 방식입니다. 레가토, 스타카토, 악센트 등이 여기에 속합니다.","오케스트라 목업의 완성도는 아티큘레이션 선택에서 크게 갈립니다. 한 선율 안에서도 음마다 맞는 주법으로 바꿔 주세요.","legato staccato keyswitch");
T("rubato","루바토","Rubato","th","박의 길이를 일정하게 유지하지 않고 표현에 따라 조금씩 늘이고 줄이는 연주입니다.","솔로 피아노나 현악 독주 큐는 그리드에 맞추면 딱딱해집니다. 템포 맵을 그리거나 클릭 없이 직접 연주해서 녹음하세요.","tempo tempo-map humanize");

/* ───── 편곡·오케스트레이션 ───── */
T("arrangement","편곡","Arrangement","ar","이미 있는 선율과 화성을 바탕으로 편성, 리듬, 구성, 반주 형태를 정해 곡을 완성하는 작업입니다.","같은 멜로디를 피아노 솔로, 밴드, 오케스트라 버전으로 각각 편곡해 보세요. 게임 한 편 안에서도 이런 요청이 자주 나옵니다.","orchestration instrumentation variation");
T("orchestration","오케스트레이션(관현악법)","Orchestration","ar","음악을 오케스트라의 각 악기에 배분하는 기술입니다. 어떤 악기가 어느 음역에서 어떤 주법으로 연주할지를 정합니다.","스코어를 보면서 음원을 듣는 것이 가장 빠른 공부법입니다. 선율을 누가 맡고, 누가 겹치고, 누가 쉬는지 표시하세요.","arrangement doubling range sections orchestrator");
T("instrumentation","악기 편성","Instrumentation","ar","곡에 어떤 악기를 몇 대씩 쓰는지를 말합니다.","편성은 작품의 세계관을 정합니다. 작업 초기에 '이 게임에서 쓰는 악기와 쓰지 않는 악기' 목록을 만들어 두면 곡 사이의 통일감이 생깁니다.","orchestration hybrid-orchestra sections");
T("sections","오케스트라 섹션","Orchestral Sections","ar","오케스트라는 현악기, 목관악기, 금관악기, 타악기 네 무리로 나뉩니다. 현악은 제1·제2바이올린, 비올라, 첼로, 콘트라베이스로 구성됩니다.","섹션마다 역할을 정하고 시작하세요. 예를 들어 현악이 화성과 리듬을, 호른이 선율을, 목관이 장식을 맡는 식입니다.","orchestration tutti doubling");
T("range","음역","Range / Register","ar","악기나 목소리가 낼 수 있는 가장 낮은 음부터 가장 높은 음까지의 범위입니다. 그 안에서도 저·중·고 음역대마다 음색이 다릅니다.","가상악기는 실제 악기가 못 내는 음도 소리가 납니다. 악기별 음역표를 옆에 두고 입력하세요. 음역을 벗어난 목업은 실무자에게 바로 보입니다.","voicing transposing orchestration");
T("transposing","이조 악기","Transposing Instrument","ar","악보에 적힌 음과 실제로 울리는 음이 다른 악기입니다. B♭ 클라리넷은 적힌 음보다 장2도 낮게, F 호른은 완전5도 낮게 소리 납니다.","DAW에서는 실제 울리는 음으로 입력하면 됩니다. 연주자에게 줄 파트보를 만들 때만 이조해서 적습니다.","range part score");
T("doubling","더블링","Doubling","ar","같은 선율을 두 가지 이상의 악기가 함께 연주하는 것입니다. 같은 높이로 겹칠 수도 있고 옥타브 간격으로 겹칠 수도 있습니다.","플루트와 바이올린, 호른과 첼로처럼 조합에 따라 새로운 음색이 생깁니다. 선율이 묻힐 때는 음량을 키우기 전에 옥타브 더블링을 먼저 시도하세요.","unison orchestration sections");
T("unison","유니즌","Unison","ar","여러 악기나 성부가 같은 음을 함께 연주하는 것입니다.","금관 전체가 유니즌으로 테마를 연주하면 화음 없이도 강한 힘이 나옵니다. 중요한 순간을 위해 아껴 두세요.","doubling tutti");
T("divisi","디비지","Divisi","ar","한 파트의 연주자들이 둘 이상으로 나뉘어 서로 다른 음을 연주하라는 지시입니다. 악보에는 div.로 적습니다.","가상악기에서 한 패치로 화음을 누르면 연주자 수가 음마다 통째로 늘어난 것처럼 들립니다. 디비지 전용 패치를 쓰거나 음량을 줄여 보정하세요.","sections cluster tutti");
T("tutti","투티","Tutti","ar","모든 악기가 함께 연주하는 구간입니다. 독주 뒤에 전체가 다시 들어올 때도 이 말을 씁니다.","투티는 길게 지속하면 효과가 떨어집니다. 곡 전체에서 투티가 차지하는 길이를 재 보세요. 생각보다 짧아야 클라이맥스가 살아납니다.","unison sections crescendo");
T("texture","텍스처(짜임새)","Texture","ar","여러 성부가 어떻게 겹쳐 있는지를 말합니다. 선율 하나에 반주가 붙으면 호모포니, 독립된 선율이 여럿이면 폴리포니, 선율 하나뿐이면 모노포니입니다.","대사가 있는 장면에서는 텍스처를 얇게 해야 대사가 들립니다. 음을 줄이는 것도 편곡입니다.","counterpoint countermelody underscore");
T("countermelody","대선율","Countermelody","ar","주선율과 함께 진행하면서 그것을 보완하는 두 번째 선율입니다.","주선율이 긴 음에 머무는 순간에 대선율이 움직이도록 쓰세요. 반복 구간에서 두 번째에만 대선율을 넣으면 변화가 생깁니다.","counterpoint texture");
T("legato","레가토","Legato","ar","음과 음 사이를 끊지 않고 부드럽게 이어 연주하는 주법입니다.","가상악기의 레가토 패치는 앞 음과 뒤 음이 조금 겹치게 입력해야 연결음이 재생됩니다. 음 사이가 떨어져 있으면 레가토로 들리지 않습니다.","articulation staccato virtual-instrument");
T("staccato","스타카토","Staccato","ar","음을 짧게 끊어서 연주하는 주법입니다.","짧은 음일수록 벨로시티 차이가 크게 들립니다. 모든 음을 같은 세기로 두면 기계처럼 들리니 강박과 약박에 차이를 주세요.","spiccato articulation velocity");
T("spiccato","스피카토","Spiccato","ar","현악기에서 활을 현 위에 튕기듯 떨어뜨려 짧고 가볍게 연주하는 주법입니다.","액션 음악의 빠른 현악 리듬은 대부분 스피카토 패치로 만듭니다. 라운드 로빈이 충분한 라이브러리를 쓰세요.","staccato ostinato round-robin");
T("pizzicato","피치카토","Pizzicato","ar","현악기의 줄을 활로 긋지 않고 손가락으로 뜯어서 내는 주법입니다. 악보에는 pizz.로 적고, 다시 활로 연주할 때는 arco라고 씁니다.","가볍고 익살스러운 장면, 잠입 장면에 잘 맞습니다.","articulation mickey-mousing");
T("tremolo","트레몰로","Tremolo","ar","같은 음을 아주 빠르게 반복해서 연주하는 주법입니다. 현악기에서는 활을 빠르게 왕복합니다.","작게 연주하면 불안과 긴장, 크게 연주하면 격렬함을 표현합니다. 서스펜스 큐의 기본 재료입니다.","cluster articulation crescendo");
T("con-sordino","콘 소르디노(약음기)","Con Sordino","ar","약음기를 끼우고 연주하라는 지시입니다. 현악기는 소리가 얇고 부드러워지고, 금관악기는 약음기 종류에 따라 음색이 크게 바뀝니다. 빼라는 지시는 senza sordino입니다.","회상이나 조용한 감정 장면의 현악에 써 보세요. 음량을 줄이는 것과는 다른 음색이 납니다.","articulation dynamics");
T("glissando","글리산도","Glissando","ar","한 음에서 다른 음으로 미끄러지듯 이동하는 주법입니다. 하프나 피아노에서는 사이의 음을 빠르게 훑습니다.","하프 글리산도는 장면 전환과 마법 효과에 자주 쓰입니다. 조성에 맞는 음계로 훑어야 어색하지 않습니다.","riser articulation");
T("crescendo","크레셴도·디미누엔도","Crescendo / Diminuendo","ar","점점 세게 연주하는 것이 크레셴도, 점점 여리게 연주하는 것이 디미누엔도입니다.","긴 음 하나에도 세기 변화를 그려 넣으세요. CC1 곡선이 평평한 현악은 살아 있는 연주로 들리지 않습니다.","dynamics expression-cc riser");
T("score","총보(스코어)","Full Score","ar","모든 악기의 악보를 세로로 정렬해 한눈에 볼 수 있게 만든 악보입니다. 위에서부터 목관, 금관, 타악기, 현악 순으로 배치합니다. 영상음악에서 '스코어'는 작품을 위해 작곡한 음악 전체를 뜻하기도 합니다.","공개된 스코어와 음원을 함께 보는 분석을 꾸준히 하세요. 한 주에 한 쪽이라도 좋습니다.","part orchestration underscore");
T("part","파트보","Part","ar","총보에서 한 악기의 악보만 뽑아낸 것입니다. 연주자는 파트보를 보고 연주합니다.","녹음 세션에서는 파트보의 오류 하나가 스튜디오 시간을 낭비하게 만듭니다. 쉼표 마디 수, 넘김 위치, 이조를 꼭 점검하세요.","score transposing scoring-session");
T("mockup","목업","Mockup","ar","가상악기로 실제 연주처럼 들리게 만든 시연용 음원입니다. 녹음 전에 감독이나 디렉터의 승인을 받는 데 씁니다.","예산이 작은 프로젝트에서는 목업이 그대로 최종 음원이 됩니다. 그래서 목업 완성도가 곧 작곡가의 기본기입니다.","virtual-instrument sample-library expression-cc");
T("hybrid-orchestra","하이브리드 오케스트라","Hybrid Orchestra","ar","전통적인 오케스트라 악기에 신시사이저, 전자 드럼, 가공된 소리를 섞은 편성입니다.","현대 게임·트레일러 음악의 표준에 가깝습니다. 저음역을 신스와 오케스트라가 동시에 차지하면 탁해지니 역할을 나누세요.","instrumentation synthesizer trailer-music");

/* ───── 영상음악 ───── */
T("underscore","언더스코어","Underscore","fi","대사와 화면 아래에서 분위기와 감정을 받쳐 주는 배경 음악입니다. 등장인물에게는 들리지 않는 음악입니다.","언더스코어는 주목받지 않으면서 장면을 돕는 것이 목표입니다. 대사의 음역대(대략 중음역)를 비워 두는 편곡을 연습하세요.","diegetic cue texture sus");
T("cue","큐","Cue","fi","영상의 특정 구간에 들어가는 음악 한 덩어리입니다. 작품의 음악은 여러 개의 큐로 이루어지고, 보통 1M1, 1M2처럼 번호를 붙여 관리합니다.","큐마다 시작·끝 타임코드, 길이, 장면 설명을 적은 목록을 만들어 관리하세요. 수정이 반복될수록 이 목록이 도움이 됩니다.","spotting timecode cue-sheet");
T("spotting","스파팅","Spotting Session","fi","감독과 작곡가가 영상을 함께 보면서 음악이 어디서 시작하고 끝날지, 어떤 역할을 할지 정하는 회의입니다.","감독이 쓰는 말은 음악 용어가 아닌 경우가 많습니다. '더 따뜻하게' 같은 표현을 들으면 구체적인 장면과 레퍼런스로 되물어 확인하세요.","cue temp-track music-editor");
T("temp-track","템프 트랙","Temp Track","fi","편집 단계에서 임시로 붙여 둔 기존 음악입니다. 편집 리듬을 잡고 원하는 음악 방향을 전달하는 데 씁니다.","감독이 템프 트랙에 익숙해져서 비슷한 곡을 원하는 일이 흔합니다. 템프의 선율을 따라 하지 말고 템포, 편성, 에너지 변화 같은 기능을 분석해서 가져오세요.","spotting reference-track music-editor");
T("diegetic","다이제틱·논다이제틱 음악","Diegetic / Non-Diegetic Music","fi","이야기 속 세계에서 실제로 울려 등장인물도 듣는 음악이 다이제틱, 관객만 듣는 음악이 논다이제틱입니다. 다이제틱 음악은 소스 음악이라고도 부릅니다.","게임에서도 술집의 악사 연주나 차량 라디오는 다이제틱 음악입니다. 이 경우 음원의 위치와 공간 잔향을 게임 안에서 처리해야 합니다.","underscore implementation");
T("leitmotif","라이트모티프","Leitmotif","fi","특정 인물, 장소, 사물, 개념과 연결되어 반복해서 등장하는 주제나 모티프입니다. 바그너의 악극에서 체계적으로 쓰이면서 널리 알려졌습니다.","라이트모티프는 변주할 때 효과가 큽니다. 인물의 상황이 달라질 때 조성, 편성, 템포를 바꿔서 같은 선율을 들려주세요.","motif theme variation");
T("mickey-mousing","미키마우징","Mickey Mousing","fi","화면 속 동작 하나하나에 음악을 정확히 맞추는 기법입니다. 초기 디즈니 애니메이션에서 많이 쓰여 이런 이름이 붙었습니다.","코미디와 애니메이션에는 잘 맞지만 진지한 장면에 쓰면 과장되어 보입니다. 어느 정도까지 맞출지를 감독과 먼저 정하세요.","hit-point pizzicato");
T("hit-point","히트 포인트","Hit Point / Sync Point","fi","음악의 강세나 변화가 화면의 특정 순간과 정확히 맞아야 하는 지점입니다. 컷 전환, 폭발, 인물의 등장 등이 해당합니다.","히트 포인트가 강박에 오도록 템포와 박자를 조정합니다. 모든 지점을 맞추려 하지 말고 중요한 두세 곳만 고르세요.","tempo-map timecode mickey-mousing");
T("main-title","메인 타이틀","Main Title","fi","작품의 제목이 나오는 오프닝 구간에 쓰이는 음악입니다. 작품 전체의 색과 주제 선율을 제시하는 역할을 합니다.","게임에서는 타이틀 화면 음악이 같은 역할을 합니다. 플레이어가 가장 먼저, 가장 여러 번 듣는 곡이라는 점을 기억하세요.","theme end-credits");
T("end-credits","엔드 크레딧","End Credits","fi","작품이 끝난 뒤 제작진 명단이 올라갈 때 흐르는 음악입니다. 주요 테마를 모아 다시 들려주는 경우가 많습니다.","화면 제약이 거의 없어서 음악적으로 가장 자유로운 구간입니다. 포트폴리오에서는 테마를 온전한 곡 형태로 보여 줄 수 있는 자리입니다.","main-title theme");
T("timecode","타임코드","SMPTE Timecode","fi","영상의 각 프레임에 붙인 주소입니다. 시:분:초:프레임 형식으로 표기합니다.","수정 요청은 항상 타임코드로 주고받으세요. '중간쯤 그 부분'이라고 말하면 서로 다른 곳을 고치게 됩니다.","frame-rate cue hit-point");
T("frame-rate","프레임 레이트","Frame Rate","fi","영상이 1초에 몇 장의 화면으로 이루어지는지를 나타냅니다. 23.976, 24, 25, 29.97, 30fps 등이 쓰입니다.","DAW 프로젝트의 프레임 레이트가 영상과 다르면 싱크가 점점 어긋납니다. 영상을 받으면 프레임 레이트부터 확인하고 설정하세요.","timecode picture-lock");
T("click-track","클릭 트랙","Click Track","fi","연주자가 템포를 맞추도록 헤드폰으로 들려주는 메트로놈 소리입니다.","템포가 바뀌는 큐는 클릭도 템포 맵에 따라 변합니다. 녹음 전에 시작 전 예비박을 몇 마디 줄지 정해 두세요.","tempo-map scoring-session streamers");
T("streamers","스트리머와 펀치","Streamers and Punches","fi","녹음할 때 지휘자가 보는 화면에 표시하는 시각 신호입니다. 화면을 가로지르는 세로줄이 스트리머이고, 정확한 지점에서 번쩍이는 표시가 펀치입니다.","클릭 없이 자유로운 템포로 녹음하면서도 히트 포인트를 맞추기 위한 방법입니다. 개념을 알아 두면 녹음 현장 자료를 이해하기 쉽습니다.","click-track hit-point scoring-session");
T("tempo-map","템포 맵","Tempo Map","fi","곡 전체의 템포와 박자 변화를 시간에 따라 기록한 것입니다. DAW의 템포 트랙이 템포 맵입니다.","영상 작업은 템포 맵을 먼저 만들고 작곡을 시작하는 편이 효율적입니다. 히트 포인트에 마커를 찍고 마디 선이 그 위에 오도록 템포를 조정하세요.","hit-point tempo click-track");
T("picture-lock","픽처 락","Picture Lock","fi","영상 편집이 확정되어 더는 컷 길이가 바뀌지 않는 상태입니다.","실제로는 락 이후에도 편집이 바뀌곤 합니다. 큐를 구간 단위로 자르고 늘일 수 있게 작곡해 두면 대응하기 쉽습니다.","frame-rate music-editor cue");
T("scoring-session","스코어링 세션","Scoring Session","fi","영상음악을 연주자와 함께 스튜디오에서 녹음하는 작업입니다.","녹음 시간은 분 단위로 비용이 듭니다. 악보, 클릭, 프리레코드 트랙이 모두 준비된 상태로 들어가야 합니다.","click-track part orchestrator streamers");
T("orchestrator","오케스트레이터","Orchestrator","fi","작곡가의 스케치나 MIDI 목업을 실제 연주용 악보로 옮기는 사람입니다.","오케스트레이터에게 넘기는 MIDI는 트랙 이름, 주법, 셈여림이 정리되어 있어야 합니다. 정리된 프로젝트를 만드는 습관은 신입에게 요구되는 실무 능력입니다.","orchestration score scoring-session");
T("music-editor","뮤직 에디터","Music Editor","fi","음악을 영상에 맞게 자르고 붙이고 싱크를 관리하는 사람입니다. 템프 트랙 편집, 큐 목록 관리, 녹음과 믹싱 단계의 싱크 확인을 맡습니다.","작곡가 지망생도 음악 편집 능력이 필요합니다. 완성된 곡을 30초, 15초 길이로 자연스럽게 줄이는 연습을 해 보세요.","temp-track picture-lock cue");
T("music-supervisor","뮤직 슈퍼바이저","Music Supervisor","fi","작품에 쓸 기존 곡을 고르고, 사용 허가와 예산을 관리하는 사람입니다.","우리나라에서 '음악감독'이라는 직함은 작곡가를 뜻하기도 하고 이 역할을 뜻하기도 합니다. 제작사마다 쓰임이 다르니 어떤 역할인지 확인하세요.","sync-license library-music cue-sheet");
T("sync-license","싱크 라이선스","Synchronization License","fi","기존 곡을 영상에 맞춰 사용할 수 있도록 받는 허가입니다. 곡 자체(작곡·작사)에 대한 싱크 라이선스와, 특정 녹음 음원에 대한 마스터 사용 허가를 따로 받아야 합니다.","계약 조건은 나라와 계약서마다 다릅니다. 실제 계약을 할 때는 반드시 전문가의 검토를 받으세요.","music-supervisor cue-sheet library-music");
T("cue-sheet","큐 시트","Cue Sheet","fi","작품에 사용된 모든 음악의 제목, 작곡자, 사용 길이, 사용 방식을 정리한 문서입니다. 저작권 사용료를 분배하는 근거가 됩니다.","큐 시트가 잘못되면 작곡가가 받을 사용료가 누락될 수 있습니다. 납품할 때 큐 정보를 정확히 넘기세요.","cue sync-license music-supervisor");
T("library-music","라이브러리 음악","Library / Production Music","fi","특정 작품을 위해 만든 것이 아니라, 여러 영상에 사용 허가를 주기 위해 미리 만들어 둔 음악입니다. 스톡 음악이라고도 합니다.","분위기와 용도가 분명해야 선택됩니다. 편집하기 쉽도록 구간이 뚜렷하고 끝맺음이 분명한 곡이 유리합니다.","sync-license trailer-music stem");
T("trailer-music","트레일러 음악","Trailer Music","fi","예고편을 위한 음악입니다. 짧은 시간 안에 단계적으로 고조되는 구성을 가지며, 편집자가 자르기 쉽게 구간이 명확합니다.","보통 도입, 빌드업, 클라이맥스의 3단 구성을 따릅니다. 게임 트레일러도 같은 문법을 쓰니 최근 예고편 몇 편의 구조를 초 단위로 받아 적어 보세요.","riser braam hybrid-orchestra");
T("riser","라이저","Riser","fi","음높이나 음량, 밀도가 점점 올라가면서 다음 순간에 대한 기대를 만드는 소리입니다.","라이저가 끝나는 지점 직후에 짧은 무음을 두면 다음 타격이 더 크게 느껴집니다.","trailer-music crescendo braam glissando");
T("braam","브람","Braam","fi","금관과 신시사이저를 겹쳐 만든 낮고 거대한 지속음입니다. 2010년대 블록버스터 예고편에서 널리 쓰이면서 이런 이름으로 불리게 되었습니다.","이미 익숙해진 소리라서 그대로 쓰면 진부하게 들릴 수 있습니다. 다른 음원을 겹쳐 자기만의 음색을 만드세요.","trailer-music riser hybrid-orchestra");
T("stem","스템","Stem","fi","완성된 곡을 현악, 금관, 타악기, 신스처럼 그룹별로 나눠서 뽑은 오디오 파일입니다. 모든 스템을 동시에 재생하면 전체 믹스와 같아야 합니다.","영상 믹싱 단계에서 대사와 부딪히는 그룹만 줄일 수 있게 스템을 요구합니다. 게임에서는 스템이 그대로 수직 레이어의 재료가 됩니다.","bus bounce vertical mixing");

/* ───── 게임음악 ───── */
T("bgm","BGM","Background Music","ga","게임 플레이 중 배경에 흐르는 음악입니다. 장면이나 지역, 상황마다 다른 곡이 배정됩니다.","게임 BGM은 한 번 듣고 끝나지 않습니다. 플레이어가 같은 지역에 한 시간 머물 수도 있다는 전제로 작곡하세요.","loop exploration-music listening-fatigue");
T("interactive-music","인터랙티브 음악","Interactive Music","ga","플레이어의 입력이나 게임 상태에 반응해서 변화하는 음악을 통틀어 부르는 말입니다.","어댑티브 음악과 거의 같은 뜻으로 섞어 쓰는 경우가 많습니다. 회사나 문서마다 구분이 다르니 용어보다 실제로 무엇이 바뀌는지를 확인하세요.","adaptive-music vertical horizontal");
T("adaptive-music","어댑티브 음악","Adaptive Music","ga","게임 상황의 변화에 맞춰 편성, 구간, 강도가 실시간으로 바뀌도록 설계한 음악입니다. 1991년 루카스아츠의 iMUSE 시스템이 초기의 대표 사례로 꼽힙니다.","곡을 쓰기 전에 '어떤 게임 정보가 음악의 무엇을 바꾸는가'를 표로 정리하세요. 이 설계 문서가 작곡보다 먼저입니다.","interactive-music vertical horizontal state rtpc");
T("vertical","수직적 리오케스트레이션","Vertical Re-orchestration / Layering","ga","같은 시간 축으로 흐르는 여러 레이어를 준비해 두고, 상황에 따라 레이어를 켜고 꺼서 음악의 밀도를 바꾸는 방식입니다.","어떤 레이어 조합에서도 음악이 성립해야 합니다. 레이어를 하나씩, 그리고 여러 조합으로 켜서 들어 보는 점검을 반드시 하세요.","horizontal stem rtpc adaptive-music");
T("horizontal","수평적 리시퀀싱","Horizontal Re-sequencing","ga","곡을 여러 구간으로 나눠 두고, 상황에 따라 다음에 재생할 구간을 바꾸는 방식입니다.","구간이 바뀌는 지점마다 화성과 리듬이 이어져야 합니다. 각 구간의 처음과 끝을 서로 붙여 보는 조합 테스트를 하세요.","vertical transition music-segment entry-exit-cue");
T("loop","루프","Loop","ga","끝에 도달하면 처음으로 돌아가 끊김 없이 반복 재생되는 음악, 또는 그 반복 구조입니다.","이음매에서 화성, 리듬, 잔향, 음량이 모두 자연스러운지 확인하세요. 이음매 부분만 따로 여러 번 돌려 듣는 것이 가장 확실합니다.","loop-point intro-loop reverb-tail cadence");
T("loop-point","루프 포인트","Loop Point","ga","루프가 시작되는 위치와 끝나는 위치입니다. 보통 샘플 단위로 지정합니다.","파형이 0을 지나는 지점에 맞추지 않으면 '틱' 하는 잡음이 납니다. 압축 포맷으로 변환한 뒤에도 이음매를 다시 확인하세요.","loop intro-loop codec");
T("intro-loop","인트로–루프 구조","Intro + Loop","ga","한 번만 재생되는 도입부 뒤에 반복 구간이 이어지는 구성입니다. 반복할 때는 도입부를 건너뛰고 반복 구간의 처음으로 돌아갑니다.","보스 등장 연출처럼 시작이 강해야 하는 곡에 씁니다. 도입부와 반복 구간을 파일 두 개로 납품할지, 한 파일에 루프 포인트를 넣을지는 개발팀에 확인하세요.","loop loop-point form battle-music");
T("reverb-tail","리버브 테일","Reverb Tail","ga","소리가 끝난 뒤에도 남아 있는 잔향입니다. 루프 음악에서는 끝부분의 잔향이 잘려 이음매가 드러나는 문제가 생깁니다.","흔한 해결법은 곡을 끝까지 렌더링한 뒤, 끝에 남은 잔향을 잘라 곡의 맨 앞에 겹쳐 넣는 것입니다. 미들웨어의 엑시트 큐 기능으로 처리할 수도 있습니다.","loop entry-exit-cue reverb");
T("transition","트랜지션","Transition","ga","한 음악에서 다른 음악으로 넘어가는 과정입니다. 즉시 전환, 크로스페이드, 다음 박이나 마디에서 전환, 연결용 구간을 거치는 전환 등이 있습니다.","전환 규칙은 음악의 일부입니다. 탐험에서 전투로 갈 때와 전투에서 탐험으로 돌아올 때의 규칙을 각각 다르게 설계하세요.","crossfade horizontal stinger key");
T("crossfade","크로스페이드","Crossfade","ga","앞의 소리를 점점 줄이면서 뒤의 소리를 점점 키워 겹쳐 넘기는 전환입니다.","구현이 가장 쉽지만 템포와 조성이 다른 두 곡을 겹치면 지저분해집니다. 겹치는 시간을 짧게 하거나 박에 맞춘 전환으로 바꾸세요.","transition vertical");
T("stinger","스팅어","Stinger","ga","특정 사건이 일어났을 때 재생되는 아주 짧은 음악입니다. 게임에서는 재생 중인 음악 위에 겹쳐서 내보냅니다. 영상음악에서는 놀람이나 강조를 위한 짧은 악센트를 뜻합니다.","배경 음악의 조성과 어긋나지 않게 만들어야 합니다. 조성이 여러 가지라면 타악기 중심으로 만들거나 조별로 준비하세요.","jingle transition hit-point");
T("jingle","징글","Jingle","ga","레벨 클리어, 아이템 획득, 게임 오버 같은 순간에 나오는 몇 초 길이의 완결된 음악입니다.","짧을수록 선율과 음색이 선명해야 합니다. 수백 번 들어도 거슬리지 않는지를 기준으로 다듬으세요.","stinger listening-fatigue");
T("state","스테이트","State","ga","탐험, 전투, 일시정지처럼 게임의 현재 상황을 나타내는 값입니다. 미들웨어는 이 값이 바뀌는 것을 신호로 음악을 전환하거나 믹스를 바꿉니다.","스테이트 이름과 전환 조건은 프로그래머, 기획자와 함께 정합니다. 음악 설계서에 스테이트 목록을 넣어 공유하세요.","rtpc transition wwise adaptive-music");
T("rtpc","RTPC(게임 파라미터)","Real-Time Parameter Control","ga","체력, 속도, 적과의 거리처럼 연속적으로 변하는 게임 수치를 소리의 음량, 필터, 레이어 등에 연결하는 기능입니다. RTPC는 Wwise의 용어이고 FMOD에서는 파라미터라고 부릅니다.","수치와 음악 변화의 관계를 곡선으로 그릴 수 있습니다. 변화가 너무 민감하면 음악이 출렁이니 값이 부드럽게 따라오도록 설정하세요.","state vertical wwise fmod");
T("middleware","오디오 미들웨어","Audio Middleware","ga","게임 엔진과 오디오 데이터 사이에서 재생 규칙을 담당하는 도구입니다. 작곡가나 사운드 디자이너가 프로그래머 없이도 음악의 동작을 설계하고 시험할 수 있게 해 줍니다.","Wwise와 FMOD가 대표적입니다. 둘 중 하나로 어댑티브 음악을 직접 구현해 본 영상이 포트폴리오에 있으면 설계 능력을 보여 줄 수 있습니다.","wwise fmod implementation");
T("wwise","Wwise","Wwise (Audiokinetic)","ga","오디오키네틱이 만든 오디오 미들웨어입니다. 인터랙티브 음악을 위한 뮤직 세그먼트, 플레이리스트 컨테이너, 스위치 컨테이너 등의 구조를 제공합니다.","엠나인아카데미 Wwise 과정에서 다루는 도구입니다. 작곡 수강생도 음악 계층 구조와 전환 규칙까지는 직접 만져 보길 권합니다.","middleware music-segment state rtpc fmod");
T("fmod","FMOD","FMOD Studio (Firelight Technologies)","ga","파이어라이트 테크놀로지스가 만든 오디오 미들웨어입니다. DAW와 비슷한 타임라인 화면에서 루프 구간, 전환 지점, 파라미터를 설정합니다.","화면 구성이 DAW와 닮아서 작곡가가 처음 접하기에 부담이 적습니다. 어느 도구를 쓸지는 입사할 회사가 정하므로 개념을 중심으로 익히세요.","middleware wwise rtpc");
T("implementation","임플리멘테이션(구현)","Implementation","ga","완성한 음악을 게임 안에서 의도대로 재생되도록 설정하고 연결하는 작업입니다.","음악은 게임 안에서 들어 봐야 완성 여부를 알 수 있습니다. DAW에서 좋게 들린 곡이 효과음, 대사와 함께 재생될 때 어떻게 들리는지 확인하세요.","middleware state ducking");
T("music-segment","뮤직 세그먼트","Music Segment","ga","Wwise에서 인터랙티브 음악을 이루는 기본 단위입니다. 하나 이상의 트랙과 템포, 박자, 엔트리 큐와 엑시트 큐 정보를 가집니다.","세그먼트 단위로 잘라 납품하려면 작곡 단계에서 구간 경계를 마디 단위로 깔끔하게 맞춰 두어야 합니다.","wwise entry-exit-cue horizontal");
T("entry-exit-cue","엔트리 큐·엑시트 큐","Entry Cue / Exit Cue","ga","Wwise 뮤직 세그먼트에서 음악적으로 시작하는 지점과 끝나는 지점을 표시하는 마커입니다. 엔트리 큐 앞의 구간(프리 엔트리)에는 못갖춘마디를, 엑시트 큐 뒤의 구간(포스트 엑시트)에는 잔향을 둘 수 있습니다.","이 구조를 쓰면 다음 구간이 시작된 뒤에도 앞 구간의 잔향이 자연스럽게 이어집니다. 파일을 뽑을 때 앞뒤 여유를 포함해 렌더링하세요.","music-segment reverb-tail transition");
T("exploration-music","탐험(필드) 음악","Exploration Music","ga","플레이어가 지역을 돌아다니는 동안 흐르는 음악입니다. 가장 오래 재생되는 종류의 곡입니다.","선율을 계속 내세우면 금방 피로해집니다. 선율이 쉬는 구간을 충분히 두고, 지역의 색은 편성과 선법으로 표현하세요.","bgm ambient-music listening-fatigue dorian");
T("battle-music","전투 음악","Battle / Combat Music","ga","전투 중에 재생되는 음악입니다. 빠른 템포와 강한 리듬으로 긴장을 유지합니다.","전투는 언제 끝날지 알 수 없습니다. 어느 지점에서든 끝낼 수 있게 엔딩 태그를 준비하고, 강도 단계를 레이어로 나누는 방법을 검토하세요.","ostinato ending-tag vertical intro-loop");
T("ending-tag","엔딩 태그","Ending Tag / Outro","ga","루프 음악을 자연스럽게 끝내기 위해 따로 만들어 두는 짧은 마무리 구간입니다.","루프 곡을 납품할 때 엔딩도 함께 요청받는 일이 많습니다. 루프의 어느 마디에서 넘어와도 어울리는지 확인하세요.","loop cadence battle-music transition");
T("ambient-music","앰비언트 음악","Ambient Music","ga","뚜렷한 선율과 박자 없이 음색과 공간감 위주로 구성한 음악입니다.","환경음과 역할이 겹치기 쉽습니다. 사운드 디자이너와 주파수 대역, 소리가 나오는 시점을 조율하세요.","exploration-music generative texture");
T("generative","생성 음악","Generative / Procedural Music","ga","미리 완성해 둔 곡을 재생하는 대신, 규칙과 확률에 따라 실시간으로 음을 조합해 만드는 음악입니다.","짧은 프레이즈 여러 개를 무작위 간격으로 재생하는 방식부터 시작해 보세요. 어떤 조합이 나와도 어울리도록 음계를 제한하는 것이 요령입니다.","ambient-music pentatonic adaptive-music");
T("chiptune","칩튠","Chiptune","ga","옛 게임기의 음원 칩 소리, 또는 그 소리를 흉내 낸 음악입니다. 패미컴(NES)은 펄스파 2개, 삼각파 1개, 노이즈 1개, 샘플 재생 채널 1개를 썼습니다.","동시에 낼 수 있는 음이 적었기 때문에 빠른 아르페지오로 화음을 표현했습니다. 제약을 그대로 지키며 한 곡을 써 보면 선율과 베이스의 중요성을 체감할 수 있습니다.","oscillator synthesizer");
T("streaming","스트리밍 재생","Streaming","ga","오디오 파일 전체를 메모리에 올리지 않고 저장 장치에서 조금씩 읽어 가며 재생하는 방식입니다. 길이가 긴 음악에 주로 씁니다.","동시에 스트리밍할 수 있는 수에는 한계가 있습니다. 레이어를 많이 쓰는 설계라면 초기에 프로그래머와 한도를 확인하세요.","codec implementation vertical");
T("codec","오디오 코덱","Audio Codec","ga","오디오 데이터를 압축하고 푸는 방식입니다. 게임에서는 Ogg Vorbis, Opus, ADPCM 등을 플랫폼과 용도에 따라 고릅니다.","압축률을 높이면 고음역과 잔향이 먼저 손상됩니다. 최종 압축 설정으로 변환한 소리를 직접 들어 보고 판단하세요.","streaming loop-point sample-rate");
T("ducking","덕킹","Ducking","ga","대사나 중요한 효과음이 나올 때 음악의 음량을 자동으로 낮추는 처리입니다.","음량을 내리는 대신 음악의 중음역만 줄이는 방법도 있습니다. 음악이 자주 눌린다면 편곡에서 대사 대역을 비우는 것이 근본적인 해결책입니다.","sidechain implementation underscore");
T("listening-fatigue","반복 피로","Repetition Fatigue","ga","같은 음악을 오래 반복해서 들을 때 생기는 피로감입니다. 게임음악에서 늘 고려해야 하는 문제입니다.","루프를 길게 만들기, 선율 없는 구간 넣기, 레이어를 무작위로 바꾸기, 일정 시간 뒤 음악을 쉬게 하기 같은 방법을 조합해서 줄입니다.","loop bgm vertical exploration-music");

/* ───── 작곡 도구·MIDI ───── */
T("daw","DAW","Digital Audio Workstation","pr","녹음, MIDI 입력, 편집, 믹싱을 한 프로그램 안에서 하는 음악 제작 소프트웨어입니다. 큐베이스, 로직 프로, 에이블톤 라이브, 프로툴스 등이 있습니다.","어떤 DAW를 쓰느냐보다 하나를 깊이 다루는 것이 중요합니다. 단축키와 템플릿을 정리해 두면 작업 속도가 크게 달라집니다.","midi template bounce");
T("midi","MIDI","Musical Instrument Digital Interface","pr","악기와 컴퓨터가 연주 정보를 주고받는 규격입니다. 소리 자체가 아니라 어떤 음을, 언제, 얼마나 세게 눌렀는지 같은 정보를 담습니다.","MIDI 데이터는 악보와 같습니다. 같은 데이터라도 어떤 가상악기로 재생하느냐에 따라 전혀 다른 소리가 납니다.","velocity cc piano-roll virtual-instrument");
T("velocity","벨로시티","Velocity","pr","건반을 누르는 세기를 나타내는 MIDI 값입니다. 범위는 1부터 127까지입니다.","피아노나 타악기처럼 치는 악기는 벨로시티가 음량과 음색을 함께 바꿉니다. 지속음을 내는 현·관악기 패치는 벨로시티보다 CC1에 반응하는 경우가 많으니 라이브러리 설명서를 확인하세요.","midi expression-cc humanize staccato");
T("cc","컨트롤 체인지(CC)","Control Change","pr","음을 누르는 것 외의 연주 조작을 전달하는 MIDI 메시지입니다. 번호마다 역할이 있고 값의 범위는 0부터 127까지입니다. CC1은 모듈레이션, CC7은 볼륨, CC11은 익스프레션, CC64는 서스테인 페달입니다.","자주 쓰는 CC는 페이더가 달린 컨트롤러로 실시간 녹음하세요. 마우스로 그린 곡선보다 자연스럽습니다.","expression-cc midi automation");
T("expression-cc","모듈레이션(CC1)·익스프레션(CC11)","Modulation / Expression","pr","오케스트라 가상악기에서 CC1은 보통 여린 소리 샘플과 센 소리 샘플 사이를 오가며 음색의 세기를 바꿉니다. CC11은 음색은 그대로 두고 음량만 조절합니다.","CC1로 연주의 세기를 표현하고, CC11로 음량을 미세하게 다듬는 순서로 작업하세요. 긴 음마다 곡선을 그려 넣는 것이 목업의 기본입니다.","cc dynamics crescendo mockup");
T("piano-roll","피아노 롤","Piano Roll","pr","세로축은 음높이, 가로축은 시간으로 MIDI 음표를 막대 모양으로 보여 주는 편집 화면입니다.","화면으로 음표를 정렬하다 보면 눈으로 작곡하게 됩니다. 수정한 뒤에는 화면을 보지 않고 들어서 판단하세요.","midi quantize daw");
T("quantize","퀀타이즈","Quantize","pr","입력한 음표의 타이밍을 그리드에 맞춰 정렬하는 기능입니다.","100% 퀀타이즈는 기계적으로 들립니다. 적용 강도를 낮추거나, 리듬 악기만 맞추고 선율은 연주한 그대로 두세요.","humanize piano-roll");
T("humanize","휴머나이즈","Humanize","pr","음표의 타이밍과 벨로시티를 조금씩 흩뜨려 사람이 연주한 것처럼 만드는 처리입니다.","무작위 기능에만 의존하면 그냥 부정확한 연주가 됩니다. 실제 연주자는 강박을 세게, 프레이즈 끝을 여리게 연주한다는 경향을 반영해서 직접 손보세요.","quantize velocity rubato");
T("virtual-instrument","가상악기","Virtual Instrument","pr","컴퓨터 안에서 소리를 내는 소프트웨어 악기입니다. 실제 악기를 녹음한 샘플 기반 악기와 소리를 합성하는 신시사이저로 나뉩니다. VST, AU, AAX 같은 플러그인 형식으로 DAW에 불러옵니다.","라이브러리마다 녹음된 공간과 마이크 위치가 다릅니다. 여러 회사의 악기를 섞을 때는 잔향을 맞춰 한 공간에 있는 것처럼 들리게 하세요.","sample-library synthesizer mockup");
T("sample-library","샘플 라이브러리","Sample Library","pr","실제 악기 연주를 음높이별, 세기별, 주법별로 녹음해 모아 둔 음원 묶음입니다.","새 라이브러리를 사는 것보다 가진 라이브러리의 주법과 마이크 설정을 끝까지 파악하는 것이 먼저입니다.","virtual-instrument keyswitch round-robin sampling");
T("keyswitch","키스위치","Keyswitch","pr","악기의 연주 음역 밖에 있는 건반을 눌러 주법을 바꾸는 기능입니다. 한 트랙 안에서 레가토, 스타카토, 피치카토 등을 오갈 수 있습니다.","키스위치 음표는 실제 음보다 조금 앞에 두세요. 구간 중간부터 재생하면 주법이 틀리게 나오는 일이 있으니 DAW의 아티큘레이션 관리 기능을 쓰는 것도 방법입니다.","articulation sample-library template");
T("round-robin","라운드 로빈","Round Robin","pr","같은 음을 반복해서 연주할 때 여러 개의 다른 샘플을 번갈아 재생하는 기능입니다.","이 기능이 없으면 빠른 반복음에서 똑같은 소리가 연달아 나와 기관총처럼 들립니다. 스피카토와 타악기 패치를 고를 때 확인하세요.","sample-library spiccato staccato");
T("synthesizer","신시사이저","Synthesizer","pr","전기 신호로 소리를 합성하는 악기입니다. 오실레이터가 만든 파형을 필터로 깎고 엔벨로프로 시간에 따른 변화를 줍니다.","프리셋을 고르기만 하지 말고 필터와 엔벨로프 값을 직접 바꿔 보세요. 기본 구조를 알면 원하는 소리를 훨씬 빨리 찾습니다.","oscillator filter adsr lfo hybrid-orchestra");
T("oscillator","오실레이터","Oscillator","pr","신시사이저에서 소리의 원재료가 되는 파형을 만들어 내는 부분입니다. 사인파, 삼각파, 톱니파, 사각파(펄스파)가 기본 파형입니다.","톱니파는 배음이 많아 밝고 두껍고, 사인파는 배음이 없어 순수합니다. 파형별 소리를 귀로 구분할 수 있게 익히세요.","synthesizer filter chiptune");
T("filter","필터","Filter","pr","특정 주파수 대역을 줄이거나 통과시키는 장치입니다. 로우패스 필터는 컷오프 주파수보다 높은 대역을 줄입니다.","컷오프를 서서히 여는 것만으로도 긴장이 고조됩니다. 게임에서는 물속이나 일시정지 화면에서 음악에 로우패스를 거는 연출이 흔합니다.","synthesizer eq rtpc lfo");
T("adsr","엔벨로프(ADSR)","Envelope (ADSR)","pr","소리가 시간에 따라 어떻게 변하는지를 정하는 값입니다. 어택(올라가는 시간), 디케이(내려오는 시간), 서스테인(유지되는 크기), 릴리스(건반을 뗀 뒤 사라지는 시간)로 이루어집니다.","어택을 길게 하면 패드처럼 부드럽게 시작하고, 짧게 하면 타악기처럼 또렷하게 시작합니다. 음량뿐 아니라 필터에도 엔벨로프를 걸 수 있습니다.","synthesizer filter lfo");
T("lfo","LFO","Low-Frequency Oscillator","pr","귀에 음으로 들리지 않을 만큼 느린 주기의 신호를 만들어, 음높이나 음량, 필터 값을 주기적으로 흔드는 장치입니다.","음높이에 걸면 비브라토, 음량에 걸면 트레몰로 효과가 납니다. 주기를 템포에 맞추면 리듬감 있는 움직임을 만들 수 있습니다.","synthesizer filter adsr");
T("sampling","샘플링","Sampling","pr","소리를 녹음해서 악기처럼 연주하거나 곡의 재료로 쓰는 것입니다. 아날로그 소리를 디지털 데이터로 바꾸는 과정을 가리키기도 합니다.","직접 녹음한 소리로 악기를 만들면 남들과 다른 음색을 가질 수 있습니다. 다른 사람의 음원을 샘플링할 때는 사용 허가 여부를 확인하세요.","sample-library sample-rate");
T("sample-rate","샘플레이트","Sample Rate","pr","소리를 1초에 몇 번 측정해 기록하는지를 나타내는 값입니다. 음악 CD는 44.1kHz, 영상과 게임 작업은 48kHz를 주로 씁니다.","영상·게임 프로젝트는 처음부터 48kHz로 작업하세요. 납품 직전에 변환하면 확인할 것이 늘어납니다.","bit-depth codec sampling");
T("bit-depth","비트 뎁스","Bit Depth","pr","소리의 크기를 얼마나 세밀한 단계로 기록하는지를 나타내는 값입니다. 16비트와 24비트가 주로 쓰입니다.","작업과 납품은 24비트가 일반적입니다. 16비트로 줄여서 내보낼 때는 디더링을 적용합니다.","sample-rate dither dynamic-range");
T("audio-interface","오디오 인터페이스","Audio Interface","pr","마이크와 악기의 소리를 컴퓨터로 넣고, 컴퓨터의 소리를 스피커와 헤드폰으로 내보내는 장비입니다.","작곡 위주라면 입력 채널 수보다 드라이버의 안정성과 낮은 레이턴시가 중요합니다.","latency daw");
T("latency","레이턴시","Latency","pr","건반을 누른 순간부터 소리가 날 때까지의 지연 시간입니다. 버퍼 크기가 클수록 지연이 길어집니다.","녹음할 때는 버퍼를 작게, 믹싱할 때는 크게 설정하세요. 지연이 큰 상태로 녹음하면 연주가 계속 밀립니다.","audio-interface daw");
T("template","템플릿","Template","pr","자주 쓰는 악기, 라우팅, 이펙트를 미리 불러 두고 정리해 놓은 DAW 프로젝트 파일입니다.","악기를 섹션별로 정렬하고 색상, 이름, 버스 연결을 통일해 두세요. 스템을 바로 뽑을 수 있는 구조로 만들어 두면 납품이 빨라집니다.","daw bus stem keyswitch");
T("bounce","바운스","Bounce / Export","pr","프로젝트의 소리를 하나의 오디오 파일로 뽑아내는 것입니다. 렌더링, 익스포트, 믹스다운이라고도 합니다.","내보낸 파일은 반드시 처음부터 끝까지 들어 보세요. 잔향이 끝에서 잘렸는지, 시작에 불필요한 무음이 있는지, 파일 이름 규칙이 맞는지 확인합니다.","stem daw reverb-tail");

/* ───── 믹싱·마스터링 ───── */
T("mixing","믹싱","Mixing","mx","여러 트랙의 음량, 좌우 위치, 음색, 공간감을 조절해 하나의 음악으로 정리하는 작업입니다.","믹싱으로 해결하려는 문제의 상당수는 편곡에서 생깁니다. 같은 음역에 악기가 몰려 있다면 편곡으로 돌아가서 고치세요.","mastering eq panning bus gain-staging");
T("mastering","마스터링","Mastering","mx","완성된 믹스의 최종 음량과 음색을 다듬고, 여러 곡 사이의 균형과 납품 규격을 맞추는 마지막 단계입니다.","게임과 영상에서는 음원을 따로 크게 마스터링하지 않고 규격에 맞춰 납품하는 경우가 많습니다. 얼마나 크게 만들지를 정하기 전에 규격서를 받으세요.","mixing limiter lufs true-peak");
T("eq","이퀄라이저(EQ)","Equalizer","mx","주파수 대역별로 음량을 키우거나 줄이는 장치입니다.","원하는 대역을 키우기 전에 방해되는 대역을 줄이는 방법을 먼저 시도하세요. 저음이 필요 없는 악기는 하이패스 필터로 아래를 정리합니다.","filter mixing ducking");
T("compressor","컴프레서","Compressor","mx","소리가 정해 둔 크기(스레숄드)를 넘으면 정해진 비율로 줄여 음량 차이를 좁히는 장치입니다.","오케스트라 음악은 셈여림의 폭이 표현 그 자체입니다. 습관적으로 걸지 말고 왜 필요한지를 먼저 생각하세요.","limiter dynamic-range sidechain");
T("limiter","리미터","Limiter","mx","소리가 정해 둔 한계를 넘지 못하게 막는 장치입니다. 압축 비율이 매우 높은 컴프레서로 볼 수 있습니다.","최종 단계에서 피크를 정리하고 음량을 확보하는 데 씁니다. 지나치게 누르면 타악기의 타격감이 사라집니다.","compressor true-peak mastering clipping");
T("reverb","리버브","Reverb","mx","소리가 공간의 벽에 반사되어 생기는 잔향, 또는 그것을 만들어 내는 이펙트입니다.","여러 악기를 같은 리버브로 보내면 한 공간에서 연주한 것처럼 묶입니다. 잔향이 길수록 빠른 음형은 뭉개지니 곡의 템포에 맞춰 길이를 정하세요.","reverb-tail delay bus");
T("delay","딜레이","Delay","mx","소리를 일정 시간 뒤에 다시 들려주는 이펙트입니다. 반복 횟수와 간격을 조절할 수 있습니다.","간격을 템포에 맞추면 리듬의 일부가 됩니다. 리버브보다 소리가 덜 뭉개져서 선율 악기의 공간감을 만들 때 유용합니다.","reverb mixing");
T("panning","패닝","Panning","mx","소리를 좌우 스피커 사이의 어느 위치에 둘지 정하는 것입니다.","오케스트라 샘플은 이미 연주석 위치대로 녹음된 경우가 많습니다. 그런 라이브러리는 팬을 건드리지 말고 그대로 쓰세요.","stereo-image mixing surround");
T("stereo-image","스테레오 이미지","Stereo Image","mx","두 스피커 사이에 소리가 펼쳐진 넓이와 각 소리의 위치감입니다.","넓히는 플러그인을 과하게 쓰면 모노로 재생했을 때 소리가 사라질 수 있습니다. 저음역은 가운데에 두는 것이 안전합니다.","panning mono-compat phase");
T("surround","서라운드(5.1·7.1)","Surround Sound","mx","청취자를 둘러싼 여러 개의 스피커로 재생하는 방식입니다. 5.1은 앞쪽 좌·중앙·우, 뒤쪽 좌·우, 그리고 저음 전용 채널(LFE)로 구성됩니다.","영화에서 중앙 채널은 주로 대사가 씁니다. 음악을 어느 채널에 어떻게 배치할지는 프로젝트의 규격을 따르세요.","atmos panning stem");
T("atmos","돌비 애트모스","Dolby Atmos","mx","소리를 채널이 아니라 3차원 공간 속 위치 정보를 가진 '오브젝트'로 다루는 입체 음향 방식입니다. 머리 위 방향의 소리까지 표현합니다.","직접 믹싱하지 않더라도 스템을 어떻게 나눠 납품해야 하는지에 영향을 줍니다. 요구 사항을 미리 확인하세요.","surround stem");
T("headroom","헤드룸","Headroom","mx","현재 신호의 최대 크기와 디지털 한계(0dBFS) 사이에 남은 여유입니다.","믹스 버스의 피크에 몇 dB 정도 여유를 두고 작업하면 이후 단계에서 다루기 쉽습니다. 처음부터 한계까지 채우지 마세요.","gain-staging clipping true-peak");
T("gain-staging","게인 스테이징","Gain Staging","mx","신호가 지나가는 각 단계마다 음량을 알맞은 수준으로 유지하는 것입니다.","트랙이 많은 오케스트라 템플릿은 다 합치면 쉽게 한계를 넘습니다. 악기 단계에서 음량을 낮춰 두고 시작하세요.","headroom clipping mixing");
T("clipping","클리핑","Clipping","mx","신호가 표현할 수 있는 최대 크기를 넘어 파형의 꼭대기가 잘리는 현상입니다. 거친 왜곡으로 들립니다.","내보낸 파일의 파형을 확대해서 꼭대기가 평평하게 잘린 곳이 없는지 확인하세요. 납품 파일의 클리핑은 기본적인 반려 사유입니다.","headroom limiter true-peak");
T("dynamic-range","다이내믹 레인지","Dynamic Range","mx","가장 작은 소리와 가장 큰 소리 사이의 폭입니다.","극장은 넓은 폭을 그대로 재생할 수 있지만 휴대폰 스피커는 그렇지 못합니다. 작품이 주로 재생될 환경에 맞춰 폭을 정하세요.","dynamics compressor lufs");
T("lufs","라우드니스(LUFS)","Loudness Units relative to Full Scale","mx","사람이 느끼는 음량에 가깝게 측정한 평균 음량 단위입니다. 방송에서는 LKFS라고도 표기하며 같은 값입니다. 스트리밍 서비스는 대체로 -14LUFS 안팎, 국내 방송은 -24LKFS, 유럽 방송(EBU R128)은 -23LUFS를 기준으로 삼습니다.","게임은 통일된 기준이 없습니다. 콘솔은 -24LUFS 안팎, 휴대기기는 -18LUFS 안팎을 권장하는 가이드(소니 ASWG)가 알려져 있지만, 프로젝트마다 다르니 오디오 디렉터에게 목표값을 확인하세요.","true-peak mastering dynamic-range");
T("true-peak","트루 피크","True Peak","mx","디지털 신호가 아날로그로 변환될 때 샘플과 샘플 사이에서 실제로 도달하는 최대 크기입니다. 단위는 dBTP입니다.","샘플 피크가 0dBFS 아래여도 트루 피크는 넘을 수 있습니다. 납품 규격에서 -1dBTP 같은 상한을 요구하는 경우가 많으니 트루 피크 미터로 확인하세요.","lufs limiter clipping codec");
T("sidechain","사이드체인","Sidechain","mx","이펙트가 자신이 걸린 트랙이 아닌 다른 트랙의 신호에 반응하도록 연결하는 방식입니다. 킥 드럼이 나올 때마다 베이스를 줄이는 사이드체인 컴프레션이 대표적입니다.","킥과 베이스처럼 같은 대역을 쓰는 두 소리를 정리할 때 씁니다. 게임의 덕킹도 같은 원리입니다.","compressor ducking");
T("bus","버스와 센드","Bus / Send","mx","여러 트랙의 신호를 하나로 모으는 통로가 버스입니다. 센드는 트랙의 신호 일부를 복사해 다른 버스로 보내는 기능으로, 리버브를 여러 트랙이 함께 쓸 때 사용합니다.","현악, 금관, 타악기를 각각 버스로 묶어 두면 그 버스가 그대로 스템이 됩니다. 리버브도 스템별로 따로 두어야 스템을 분리했을 때 잔향이 섞이지 않습니다.","stem template reverb mixing");
T("automation","오토메이션","Automation","mx","음량, 팬, 이펙트 값이 시간에 따라 자동으로 변하도록 기록하는 기능입니다.","MIDI CC는 악기의 연주를 바꾸고, 오토메이션은 믹서의 값을 바꿉니다. 둘의 역할을 구분해서 쓰면 수정할 때 헷갈리지 않습니다.","cc mixing");
T("phase","위상","Phase","mx","파형이 주기의 어느 지점에 있는지를 나타냅니다. 같은 소리 두 개의 위상이 어긋난 채 합쳐지면 일부 대역이 약해지거나 사라집니다.","같은 음원을 여러 레이어로 겹칠 때 저음이 갑자기 얇아진다면 위상 문제를 의심하세요. 한쪽의 위상을 뒤집거나 시작 위치를 조금 옮겨서 비교합니다.","mono-compat stereo-image");
T("mono-compat","모노 호환성","Mono Compatibility","mx","스테레오 믹스를 모노로 합쳐 재생했을 때도 소리가 온전히 유지되는 정도입니다.","휴대폰 스피커처럼 사실상 모노로 재생되는 환경이 많습니다. 모바일 게임 음악이라면 모노로 바꿔 들어 보는 점검을 꼭 하세요.","phase stereo-image");
T("reference-track","레퍼런스 트랙","Reference Track","mx","작업의 방향과 품질을 비교하기 위해 기준으로 삼는 기존 곡입니다.","내 곡과 음량을 맞춘 뒤에 비교하세요. 큰 소리는 더 좋게 들리기 때문에 음량이 다르면 판단이 틀어집니다.","temp-track mixing lufs");
T("dither","디더링","Dithering","mx","비트 뎁스를 낮출 때 생기는 왜곡을 줄이기 위해 아주 작은 잡음을 섞는 처리입니다.","24비트에서 16비트로 내보낼 때 마지막 단계에서 한 번만 적용합니다.","bit-depth bounce mastering");

/* ───── 추가: 음악 이론 ───── */
T("octave","옥타브","Octave","th","어떤 음과, 진동수가 그 두 배인 음 사이의 음정입니다. 두 음은 높이가 달라도 같은 음이름으로 불립니다.","선율을 한 옥타브 올리거나 내리기만 해도 장면의 무게가 달라집니다. 변주가 필요할 때 가장 먼저 시도할 수 있는 방법입니다.","interval range doubling");
T("overtone","배음","Harmonic Series / Overtones","th","악기가 한 음을 낼 때 기본음 위에 함께 울리는 더 높은 음들입니다. 기본음 진동수의 2배, 3배, 4배 순으로 쌓입니다. 배음의 구성이 악기의 음색을 결정합니다.","저음역에서 넓게, 고음역에서 좁게 화음을 쌓는 보이싱 원칙은 배음의 간격을 따른 것입니다.","timbre voicing oscillator harmonics");
T("timbre","음색","Timbre","th","음높이와 크기가 같아도 악기마다 다르게 들리게 하는 소리의 성질입니다.","같은 선율을 어떤 음색에 맡기느냐가 감정을 바꿉니다. 테마를 쓴 뒤 악기를 다섯 가지로 바꿔 들어 보세요.","overtone orchestration doubling");
T("key-signature","조표","Key Signature","th","악보의 음자리표 옆에 적는 올림표나 내림표입니다. 곡 전체에서 어떤 음을 올리거나 내릴지 미리 알려 줍니다.","올림표 개수와 내림표 개수로 조를 바로 읽을 수 있어야 스코어 분석이 빨라집니다.","key circle-of-fifths relative-key");
T("circle-of-fifths","5도권","Circle of Fifths","th","12개의 조를 완전5도 간격으로 원형에 배열한 그림입니다. 시계 방향으로 한 칸 갈 때마다 올림표가 하나씩 늘어납니다.","원에서 이웃한 조끼리는 공통음이 많아서 전조와 곡 전환이 자연스럽습니다. 게임에서 연결될 곡의 조를 정할 때 참고하세요.","key-signature modulation relative-key");
T("relative-key","나란한조·같은으뜸음조","Relative / Parallel Key","th","조표가 같은 장조와 단조를 나란한조라고 합니다(다장조와 가단조). 으뜸음이 같은 장조와 단조는 같은으뜸음조라고 합니다(다장조와 다단조).","같은 테마를 같은으뜸음조로 바꾸면 밝은 버전과 어두운 버전을 쉽게 만들 수 있습니다.","key major-minor modal-interchange circle-of-fifths");
T("minor-scales","화성단음계·가락단음계","Harmonic / Melodic Minor","th","자연단음계의 7번째 음을 반음 올린 것이 화성단음계입니다. 가락단음계는 올라갈 때 6번째와 7번째 음을 모두 올리고, 내려올 때는 자연단음계로 돌아옵니다.","화성단음계의 6음과 7음 사이 증2도는 이국적인 색을 냅니다. 단조에서 V 화음을 장3화음으로 쓰는 이유도 이 음계에 있습니다.","scale major-minor aeolian");
T("aeolian","에올리안·로크리안","Aeolian / Locrian","th","에올리안은 자연단음계와 같은 선법입니다. 로크리안은 자연단음계에서 2번째와 5번째 음을 반음 내린 선법으로, 으뜸화음이 감3화음이라 매우 불안정합니다.","에올리안의 i–♭VI–♭VII 진행은 서사적인 게임음악에 흔합니다. 로크리안은 곡 전체보다 짧은 긴장 구간에 씁니다.","mode minor-scales phrygian");
T("blues-scale","블루스 스케일","Blues Scale","th","마이너 펜타토닉에 내린 5음을 더한 6음 음계입니다.","누아르, 도시 배경, 재즈풍 술집 음악을 쓸 때 기본이 됩니다.","pentatonic scale swing");
T("tritone","트라이톤(증4도)","Tritone","th","온음 세 개만큼 떨어진 음정입니다. 증4도 또는 감5도이며 한 옥타브를 정확히 반으로 나눕니다.","매우 불안정하게 들려서 위협, 악역, 초자연적 존재를 표현할 때 씁니다. 도미넌트7 화음이 해결을 원하는 것도 그 안에 트라이톤이 있기 때문입니다.","interval dissonance seventh tritone-sub");
T("function","화성 기능","Harmonic Function","th","조성 안에서 화음이 맡는 역할입니다. 안정된 토닉(I), 긴장을 만들고 토닉으로 가려는 도미넌트(V), 그 사이를 이어 주는 서브도미넌트(IV)로 나눕니다.","코드 이름만 외우지 말고 기능으로 들으세요. 기능이 같은 화음끼리는 서로 바꿔 쓸 수 있어서 리하모니제이션의 출발점이 됩니다.","progression cadence reharmonization diatonic");
T("reharmonization","리하모니제이션","Reharmonization","th","선율은 그대로 두고 아래의 화음을 다른 것으로 바꾸는 것입니다.","테마를 여러 상황의 곡으로 변주할 때 효과가 큽니다. 승리 장면과 상실 장면에 같은 선율을 쓰되 화음을 바꿔 보세요.","function variation modal-interchange tritone-sub");
T("tritone-sub","트라이톤 대리","Tritone Substitution","th","도미넌트7 화음을, 근음이 트라이톤만큼 떨어진 다른 도미넌트7 화음으로 바꾸는 기법입니다. 다장조에서 G7 대신 D♭7을 씁니다.","베이스가 반음씩 내려가는 진행을 만들 수 있습니다. 재즈풍 편곡에서 자주 씁니다.","tritone secondary-dominant reharmonization");
T("neapolitan","나폴리 화음","Neapolitan Chord","th","음계의 2번째 음을 반음 내려 그 위에 쌓은 장3화음입니다. 주로 단조에서 제1자리바꿈 형태로 쓰여 나폴리 6화음이라고 부릅니다.","종지 직전에 넣으면 비극적이고 고전적인 색이 납니다.","cadence phrygian inversion");
T("dim-aug","감화음·증화음","Diminished / Augmented Chord","th","단3도만 쌓은 화음이 감화음, 장3도만 쌓은 화음이 증화음입니다. 둘 다 구성음 간격이 균등해서 어느 조에도 속하지 않는 것처럼 들립니다.","감7화음은 서스펜스와 무성영화풍 긴장에, 증화음은 몽환적이거나 불안한 전환에 씁니다.","triad octatonic whole-tone seventh");
T("power-chord","파워 코드","Power Chord","th","근음과 5음만으로 이루어진 화음입니다. 3음이 없어서 장·단의 성격이 없습니다.","왜곡이 강한 기타나 두꺼운 신스에서는 3음이 들어가면 탁해집니다. 록·메탈 기반 전투 음악의 기본 재료입니다.","sus chord saturation");
T("slash-chord","분수 코드(슬래시 코드)","Slash Chord","th","코드 기호 뒤에 빗금과 베이스 음을 적은 화음입니다. C/E는 C 코드를 E 베이스 위에서 연주하라는 뜻입니다.","화음에 없는 음을 베이스에 두면(예: F/G) 텐션 화음을 쉽게 만들 수 있습니다.","inversion voicing pedal-point");
T("arpeggio","아르페지오","Arpeggio","th","화음의 구성음을 동시에 치지 않고 차례로 연주하는 것입니다.","화음을 길게 깔기만 하면 곡이 멈춘 것처럼 들립니다. 하프, 피아노, 신스 아르페지오로 화음에 움직임을 주세요.","chord ostinato arpeggiator");
T("voice-leading","성부 진행","Voice Leading","th","화음이 바뀔 때 각 성부가 다음 음으로 어떻게 이동하는지를 다루는 것입니다. 공통음은 유지하고 나머지는 가까운 음으로 움직이는 것이 기본입니다.","현악 패드가 화음마다 덜컹거린다면 성부 진행을 점검하세요. 각 파트를 따로 불러 봤을 때 자연스러운 선율이 되어야 합니다.","voicing counterpoint inversion");
T("phrase","악구(프레이즈)","Phrase","th","음악에서 하나의 완결된 생각을 이루는 단위입니다. 말로 치면 문장 하나에 해당하며 보통 2~8마디 길이입니다.","관악기와 성악은 프레이즈 사이에 숨 쉴 곳이 필요합니다. 가상악기로 쓰더라도 숨 쉴 자리를 두어야 자연스럽습니다.","motif cadence anacrusis");
T("anacrusis","못갖춘마디(여린내기)","Anacrusis / Pickup","th","첫 강박보다 앞서 시작하는 음, 또는 그렇게 시작하는 마디입니다.","게임음악 구간을 자를 때 문제가 됩니다. 다음 구간의 여린내기는 앞 구간의 끝과 겹쳐야 하므로 프리 엔트리 영역에 넣어 납품합니다.","phrase entry-exit-cue meter");
T("sequence","동형진행","Sequence","th","같은 음형을 높이를 바꿔 가며 되풀이하는 것입니다.","두세 번까지는 기대를 쌓지만 그 이상은 예측 가능해집니다. 세 번째에서 변화를 주는 것이 일반적인 요령입니다.","motif variation modulation");
T("hemiola","헤미올라","Hemiola","th","3박자 두 마디를 2박 세 묶음으로 느끼게 하는 식으로, 박의 묶음을 일시적으로 바꾸는 리듬입니다.","6/8 박자의 전투 음악에서 3/4처럼 들리는 마디를 섞으면 리듬이 크게 흔들리는 효과가 납니다.","polyrhythm meter syncopation");
T("tuplet","잇단음표","Tuplet","th","한 박이나 여러 박을 원래 분할과 다른 수로 나눈 음표입니다. 한 박을 셋으로 나눈 셋잇단음표가 가장 흔합니다.","DAW 그리드를 셋잇단 단위로 바꾸는 방법을 익혀 두세요. 직선적인 리듬 위에 셋잇단 선율을 얹으면 여유가 생깁니다.","swing polyrhythm quantize");
T("swing","스윙","Swing","th","한 박을 둘로 나눌 때 앞을 길게, 뒤를 짧게 연주하는 리듬감입니다.","DAW의 스윙 값으로 정도를 조절할 수 있습니다. 재즈뿐 아니라 힙합, 로파이 풍 음악에도 쓰입니다.","tuplet groove blues-scale");
T("groove","그루브","Groove","th","리듬 악기들이 타이밍과 세기를 미세하게 조절해 만들어 내는 리듬의 느낌입니다.","드럼과 베이스의 타이밍 관계에서 대부분 결정됩니다. 좋아하는 곡의 드럼 타이밍을 DAW에서 확대해 보면 그리드에서 얼마나 벗어나는지 알 수 있습니다.","swing humanize rhythm-section");
T("riff","리프와 훅","Riff / Hook","th","리프는 곡을 끌고 가는 짧은 반복 음형이고, 훅은 듣는 사람의 기억에 남는 핵심 부분입니다.","타이틀곡이나 캐릭터 테마는 5초 안에 훅이 들려야 합니다.","ostinato motif theme");
T("coda","코다·브리지","Coda / Bridge","th","코다는 곡의 끝에 붙는 마무리 구간입니다. 브리지는 주요 구간 사이를 잇거나 대비를 주는 구간입니다.","게임음악에서 브리지라는 말은 두 곡 사이를 이어 주는 짧은 전환용 음악을 가리키기도 합니다. 문맥에 따라 뜻을 확인하세요.","form ending-tag transition-segment");
T("tempo-change","리타르단도·아첼레란도","Ritardando / Accelerando","th","점점 느려지는 것이 리타르단도, 점점 빨라지는 것이 아첼레란도입니다.","DAW에서는 템포 트랙에 곡선을 그려서 만듭니다. 루프 음악의 끝에서 느려지면 처음으로 돌아갈 때 템포가 튀니 주의하세요.","tempo rubato tempo-map fermata");
T("fermata","페르마타","Fermata","th","음이나 쉼표를 원래 길이보다 길게 늘이라는 기호입니다.","영상에서는 장면이 얼마나 길어질지 모를 때 긴 지속음으로 처리합니다. 게임에서는 대기 상태를 위한 반복 가능한 지속 구간으로 바꿔 생각하세요.","tempo-change rubato");
T("atonal","무조 음악·12음 기법","Atonality / Twelve-Tone Technique","th","으뜸음이 없는 음악을 무조 음악이라고 합니다. 12음 기법은 12개의 음을 한 번씩 써서 만든 음렬을 바탕으로 작곡하는 방법으로, 쇤베르크가 체계화했습니다.","공포, 광기, 낯선 존재를 표현하는 스코어에서 무조적인 어법을 빌려 씁니다.","dissonance cluster chromatic");
T("minimalism","미니멀리즘","Minimalism","th","짧은 음형을 반복하면서 조금씩 변화시키는 작곡 양식입니다. 스티브 라이히, 필립 글래스가 대표적인 작곡가입니다.","반복과 점진적 변화라는 원리는 게임음악의 레이어 구조와 잘 맞습니다. 퍼즐 게임과 다큐멘터리 음악에서 자주 들립니다.","ostinato vertical arpeggio");
T("transposition","조옮김","Transposition","th","곡이나 선율 전체를 다른 높이로 그대로 옮기는 것입니다.","가수나 악기의 음역에 맞추거나 다른 곡과 조를 맞출 때 합니다. 샘플 악기는 조를 옮기면 음색이 달라지니 옮긴 뒤 다시 들어 보세요.","key range transposing");

/* ───── 추가: 편곡·오케스트레이션 ───── */
T("harmonics","하모닉스","Harmonics","ar","현악기에서 줄을 누르지 않고 가볍게 짚어 배음만 울리게 하는 주법입니다. 맑고 가는 소리가 납니다.","높은 음역에 길게 깔면 차갑고 투명한 공간이 만들어집니다. 설원, 우주, 정적 장면에 써 보세요.","overtone articulation sul-pont");
T("sul-pont","술 폰티첼로·술 타스토","Sul Ponticello / Sul Tasto","ar","술 폰티첼로는 활을 브리지 가까이에서 그어 거칠고 금속성인 소리를 내는 주법입니다. 술 타스토는 지판 위에서 그어 부드럽고 흐릿한 소리를 냅니다.","술 폰티첼로 트레몰로는 공포 음악에서 자주 쓰는 조합입니다.","tremolo harmonics articulation");
T("col-legno","콜 레뇨·바르톡 피치카토","Col Legno / Bartók Pizzicato","ar","콜 레뇨는 활의 나무 부분으로 줄을 두드리는 주법입니다. 바르톡 피치카토는 줄을 세게 뜯어 지판에 부딪히게 하는 주법입니다.","둘 다 타악기에 가까운 소리가 납니다. 리듬 레이어에 섞으면 오케스트라만으로 날카로운 타격감을 만들 수 있습니다.","pizzicato articulation percussion");
T("vibrato","비브라토","Vibrato","ar","음높이를 미세하게 위아래로 떨어 소리에 표정을 주는 주법입니다.","비브라토 양을 조절할 수 있는 라이브러리라면 음의 시작은 적게, 뒤로 갈수록 많게 해 보세요. 비브라토가 없는 소리는 차갑고 고음악 같은 인상을 줍니다.","articulation lfo legato");
T("portamento","포르타멘토","Portamento","ar","한 음에서 다음 음으로 음높이를 끊김 없이 미끄러지게 이어 가는 것입니다.","현악 선율의 큰 도약에 가끔 넣으면 감정이 실립니다. 자주 쓰면 과장되어 들립니다.","glissando legato pitch-bend");
T("trill","트릴","Trill","ar","적힌 음과 그 바로 위의 음을 빠르게 번갈아 연주하는 꾸밈입니다.","목관이나 현악의 트릴은 고조되는 구간에 반짝이는 긴장을 더합니다.","tremolo articulation");
T("accent","악센트·마르카토·스포르찬도","Accent / Marcato / Sforzando","ar","악센트는 특정 음을 강조하는 표시이고 마르카토는 더 강하고 또렷한 강조입니다. 스포르찬도(sfz)는 그 음만 갑자기 세게 연주하라는 뜻입니다.","금관의 스포르찬도 뒤 크레셴도(sfz-p-cresc.)는 액션 음악에서 매우 자주 쓰는 표현입니다. 전용 패치가 있는지 확인하세요.","articulation dynamics crescendo");
T("detache","데타셰","Détaché","ar","현악기에서 음마다 활의 방향을 바꿔 하나씩 분리해서 연주하는 기본 주법입니다.","레가토로는 뭉개지고 스타카토로는 너무 짧은 중간 속도의 음형에 맞습니다.","legato staccato articulation");
T("flutter","플러터 텅잉","Flutter-Tonguing","ar","관악기 연주자가 혀를 굴리면서 불어 거칠게 떨리는 소리를 내는 주법입니다.","금관에 쓰면 으르렁거리는 위협적인 소리가 납니다. 괴수나 보스 등장에 잘 맞습니다.","articulation tremolo");
T("percussion","타악기 분류","Percussion","ar","타악기는 팀파니, 마림바처럼 음높이가 있는 것과 스네어, 심벌처럼 음높이가 정해지지 않은 것으로 나뉩니다.","팀파니는 음정이 있으므로 화음의 근음에 맞춰야 합니다. 대형 북 위주의 이른바 에픽 퍼커션은 저음역을 많이 차지하니 베이스와 겹치지 않게 정리하세요.","sections col-legno hybrid-orchestra");
T("harp","하프의 제약","Harp","ar","하프는 페달 일곱 개로 각 음이름의 올림과 내림을 정합니다. 그래서 반음계적인 빠른 진행은 연주하기 어렵습니다.","실제 녹음을 염두에 둔 곡이라면 페달 설정이 가능한지 확인해야 합니다. 목업만 만들더라도 연주 가능한 음형으로 쓰는 습관을 들이세요.","glissando arpeggio range");
T("choir","합창 편성","Choir (SATB)","ar","혼성 합창은 소프라노, 알토, 테너, 베이스 네 성부로 구성됩니다.","합창 샘플은 가사 없이 '아', '우' 모음으로 쓰는 경우가 많습니다. 가사가 필요하면 음절을 조합하는 전용 라이브러리나 실제 녹음을 검토하세요.","range sections voice-leading");
T("rhythm-section","리듬 섹션","Rhythm Section","ar","밴드에서 리듬과 화성의 바탕을 맡는 드럼, 베이스, 기타, 건반을 묶어 부르는 말입니다.","오케스트라와 밴드를 섞을 때는 리듬 섹션을 먼저 완성하고 그 위에 관현악을 올리는 편이 정리하기 쉽습니다.","groove hybrid-orchestra fill");
T("pad","패드","Pad","ar","화음을 길게 깔아 배경을 채우는 소리입니다. 신시사이저나 현악으로 주로 만듭니다.","패드가 중음역을 넓게 차지하면 선율과 대사가 묻힙니다. 필요한 음만 남기고 음역을 좁히세요.","texture synthesizer adsr underscore");
T("fill","필인","Fill","ar","프레이즈 사이의 빈자리를 채우는 짧은 연주입니다. 주로 드럼이 구간 전환을 알리는 데 씁니다.","구간이 바뀌기 직전 한두 박에 넣습니다. 수평 구조의 게임음악에서는 필인이 전환용 세그먼트 역할을 할 수 있습니다.","rhythm-section transition-segment");
T("lead-sheet","리드 시트","Lead Sheet","ar","선율과 코드 기호만 적은 간단한 악보입니다.","테마를 리드 시트로 정리해 두면 여러 편곡 버전을 만들 때 기준이 됩니다. 협업자에게 곡의 뼈대를 전달하기에도 좋습니다.","sketch score slash-chord");
T("sketch","스케치·축약보","Sketch / Short Score","ar","총보로 펼치기 전에 두세 단에서 네 단 정도의 보표에 선율, 화성, 주요 악기 지시를 적은 악보입니다.","피아노 한 대로 쳐서 성립하는 곡은 편곡해도 무너지지 않습니다. 악기를 불러오기 전에 스케치를 먼저 완성하세요.","lead-sheet orchestrator score");
T("notation","사보와 악보 프로그램","Music Notation / Engraving","ar","악보를 읽기 좋게 정리해 적는 일을 사보라고 합니다. 시벨리우스, 도리코, 뮤즈스코어 같은 프로그램을 씁니다. 오래 쓰이던 피날레는 2024년에 개발 종료가 발표되었습니다.","DAW의 MIDI를 악보 프로그램으로 옮길 때는 MusicXML 형식을 주로 씁니다. 옮긴 뒤에 박자 표기와 주법 기호를 다시 정리해야 합니다.","score part orchestrator");
T("chamber","체임버 편성","Chamber Ensemble","ar","연주자가 몇 명에서 열몇 명 정도인 작은 편성입니다. 현악 4중주가 대표적입니다.","풀 오케스트라보다 악기 하나하나의 숨결이 들려 친밀한 장면에 맞습니다. 샘플도 인원수가 적은 라이브러리를 따로 써야 그 느낌이 납니다.","instrumentation sections divisi");

/* ───── 추가: 영상음악 ───── */
T("ost","OST와 스코어","Original Soundtrack / Score","fi","OST는 작품에 쓰인 음악을 모은 음반, 또는 그 음악 전체를 가리킵니다. 스코어는 그중 작품을 위해 새로 작곡한 연주 음악을 말하고, 기존 가요나 삽입곡과 구분할 때 씁니다.","우리나라에서는 드라마 삽입 가요를 OST라고 부르는 경우가 많습니다. 의뢰를 받을 때 어떤 종류의 음악을 뜻하는지 확인하세요.","score underscore insert-song");
T("insert-song","삽입곡·주제가","Insert Song / Theme Song","fi","가사가 있는 노래 형태로 작품에 들어가는 음악입니다. 작품을 대표하는 노래를 주제가라고 합니다.","노래의 선율을 연주곡 스코어에 변주해 넣으면 작품 전체가 하나로 묶입니다.","ost theme leitmotif");
T("demo","데모","Demo","fi","작곡 방향을 확인받기 위해 미리 만들어 보내는 시안 음원입니다.","데모는 완성곡으로 평가받습니다. 방향이 다른 시안을 두세 개 준비하면 대화가 빨라집니다.","mockup revision spotting");
T("revision","수정(리비전)","Revision","fi","피드백을 받아 큐를 고치는 과정, 또는 고친 버전입니다.","파일 이름에 버전 번호를 붙이고, 무엇을 고쳤는지 한 줄로 적어 함께 보내세요. 수정 횟수는 계약 단계에서 정해 두는 것이 좋습니다.","demo cue naming delivery");
T("delivery","납품","Delivery","fi","완성된 음악을 정해진 규격에 맞춰 넘기는 일입니다. 파일 형식, 샘플레이트, 스템 구성, 파일 이름 규칙, 라우드니스 등이 규격에 포함됩니다.","작업을 시작하기 전에 납품 규격서를 받으세요. 마지막에 규격을 맞추려 하면 다시 작업해야 하는 일이 생깁니다.","stem naming lufs bounce");
T("dme","DME 스템과 M&E","Dialogue, Music, Effects / M&E","fi","영상의 최종 음향을 대사, 음악, 효과 세 묶음으로 나눈 것을 DME 스템이라고 합니다. M&E는 대사를 뺀 음악과 효과만 담은 트랙으로, 다른 언어로 더빙할 때 씁니다.","음악에 사람 목소리나 가사가 있다면 M&E에 어떻게 포함되는지 확인이 필요합니다.","stem final-mix surround");
T("final-mix","파이널 믹스(더빙)","Final Mix / Re-recording Mix","fi","대사, 음악, 효과를 모두 합쳐 영상의 최종 음향을 완성하는 단계입니다.","이 단계에서 음악은 대사와 효과에 맞춰 줄거나 잘릴 수 있습니다. 스템을 잘 나눠 납품하면 음악이 통째로 줄어드는 일을 피할 수 있습니다.","dme stem ducking");
T("two-pop","투 팝","2-Pop","fi","영상 본편이 시작되기 정확히 2초 전에 넣는 한 프레임 길이의 1kHz 신호음입니다. 영상과 음향의 싱크를 확인하는 데 씁니다.","납품 규격에서 요구하면 음악 파일에도 같은 위치에 넣습니다. 요구하지 않는 프로젝트도 많으니 규격서를 따르세요.","timecode frame-rate delivery");
T("overdub","오버더빙","Overdubbing","fi","이미 녹음한 음원 위에 다른 연주를 덧입혀 녹음하는 것입니다.","가상악기 목업 위에 솔로 악기 한두 개만 실제로 녹음해 얹어도 전체가 훨씬 생생해집니다. 예산이 적을 때 효과가 큰 방법입니다.","scoring-session mockup click-track");
T("sonic-logo","사운드 로고","Sonic Logo / Audio Branding","fi","브랜드를 떠올리게 하는 몇 초 길이의 짧은 음악이나 소리입니다.","게임 회사 로고 화면의 소리도 여기에 해당합니다. 음 서너 개로 기억에 남게 만들어야 하므로 음색 설계가 선율만큼 중요합니다.","jingle riff");
T("sound-alike","사운드얼라이크","Sound-Alike","fi","기존의 특정 곡과 비슷하게 들리도록 만든 곡입니다.","선율과 구성이 지나치게 닮으면 저작권 분쟁으로 이어질 수 있습니다. 템프 트랙과 비슷하게 해 달라는 요청을 받으면 어디까지 닮아도 되는지 제작사와 문서로 확인하세요.","temp-track sync-license copyright");
T("copyright","저작권과 저작인접권","Copyright / Neighboring Rights","fi","저작권은 곡을 만든 사람이 갖는 권리이고, 저작인접권은 그 곡을 연주하고 녹음한 실연자와 음반 제작자가 갖는 권리입니다.","우리나라에서 저작인격권은 다른 사람에게 넘길 수 없습니다. 구체적인 계약 내용은 사례마다 다르니 계약 전에 전문가의 검토를 받으세요.","work-for-hire royalty sync-license");
T("work-for-hire","저작권 귀속 계약","Work for Hire / Buyout","fi","의뢰받아 만든 음악의 권리가 의뢰한 회사에 속하도록 정하는 계약입니다. 워크 포 하이어는 미국 저작권법의 개념이고, 국내에서는 저작재산권을 양도하는 계약 형태가 많이 쓰입니다.","게임음악 외주에서 흔한 계약 방식입니다. 포트폴리오로 공개할 수 있는지, 크레딧이 표기되는지를 계약서에서 확인하세요.","copyright royalty outsourcing");
T("royalty","저작권 사용료","Royalty","fi","음악이 방송, 공연, 전송, 복제될 때마다 권리자에게 지급되는 돈입니다. 신탁관리단체가 사용료를 걷어 권리자에게 분배합니다.","분배 규정과 요율은 단체와 시기에 따라 달라집니다. 정확한 내용은 가입할 단체의 규정을 직접 확인하세요.","cue-sheet copyright work-for-hire");

/* ───── 추가: 게임음악 ───── */
T("linear","선형 음악·비선형 음악","Linear / Non-linear Music","ga","처음부터 끝까지 정해진 순서로 흐르는 음악이 선형 음악입니다. 상황에 따라 순서와 구성이 달라지는 음악을 비선형 음악이라고 합니다.","게임 안에서도 컷신은 선형, 플레이 구간은 비선형입니다. 둘을 이어 붙이는 지점을 미리 설계해야 합니다.","cutscene adaptive-music horizontal");
T("cutscene","컷신 음악","Cutscene / Cinematic Music","ga","플레이가 멈추고 재생되는 영상 구간의 음악입니다. 영상음악처럼 화면에 맞춰 작곡합니다.","실시간으로 연출되는 컷신은 기기 성능이나 플레이어 입력에 따라 길이가 달라질 수 있습니다. 길이가 고정인지 먼저 확인하세요.","linear hit-point transition");
T("event","이벤트","Event","ga","게임이 미들웨어에 보내는 신호입니다. '전투 음악 재생', '음악 정지' 같은 동작이 이벤트에 연결됩니다.","이벤트 이름은 프로그래머와 공유하는 약속입니다. 이름 규칙을 정하고 목록 문서를 최신으로 유지하세요.","state switch-container soundbank naming");
T("soundbank","사운드뱅크","SoundBank","ga","미들웨어가 게임에 넘기는 데이터 묶음입니다. 이벤트 정보와 오디오 데이터가 들어 있습니다.","어떤 음악을 어느 뱅크에 넣느냐에 따라 메모리 사용량과 로딩 시간이 달라집니다.","event memory-budget streaming");
T("switch-container","뮤직 스위치 컨테이너","Music Switch Container","ga","Wwise에서 스테이트나 스위치 값에 따라 재생할 음악을 고르는 구조입니다. 음악 사이의 전환 규칙도 여기서 설정합니다.","탐험과 전투 음악을 하나의 스위치 컨테이너에 넣고 전환 규칙을 직접 만들어 보세요. 어댑티브 음악 구현의 기본 실습입니다.","playlist-container state transition wwise");
T("playlist-container","뮤직 플레이리스트 컨테이너","Music Playlist Container","ga","Wwise에서 여러 뮤직 세그먼트를 순서대로, 또는 무작위로 이어 재생하는 구조입니다.","루프 한 개를 그대로 돌리지 말고 몇 개의 세그먼트로 나눠 순서를 섞으면 반복이 덜 느껴집니다.","music-segment switch-container listening-fatigue");
T("transition-segment","트랜지션 세그먼트","Transition Segment","ga","두 음악 사이를 이어 주기 위해 전환 때만 한 번 재생되는 짧은 음악입니다.","드럼 필인이나 짧은 상승 음형 정도로도 충분합니다. 조성과 템포가 다른 두 곡을 이을 때 유용합니다.","transition fill coda sync-point");
T("sync-point","전환 시점(싱크 포인트)","Transition Sync Point","ga","전환 요청이 들어왔을 때 실제로 음악을 바꾸는 지점입니다. Wwise에서는 즉시, 다음 박, 다음 마디, 다음 큐, 엑시트 큐 등에서 고릅니다.","다음 마디까지 기다리면 음악적으로는 좋지만 게임 상황에 늦게 반응합니다. 전투 시작처럼 급한 전환은 다음 박이나 즉시 전환에 스팅어를 겹쳐 처리합니다.","transition entry-exit-cue stinger");
T("fmod-markers","트랜지션 마커와 루프 리전","Transition Marker / Loop Region","ga","FMOD 타임라인에 놓는 표시입니다. 루프 리전은 반복할 구간을 정하고, 트랜지션 마커와 트랜지션 리전은 조건이 맞을 때 다른 위치로 건너뛰게 합니다.","타임라인 위에서 수평 구조를 직접 그리는 방식이라 구조가 눈에 보입니다. 마커 위치는 마디 선에 정확히 맞추세요.","fmod horizontal loop transition");
T("snapshot","스냅샷(믹서 스테이트)","Snapshot / Mixer State","ga","미리 저장해 둔 믹서 설정을 상황에 따라 불러오는 기능입니다. FMOD에서는 스냅샷이라 부르고 Wwise에서는 스테이트로 처리합니다.","일시정지 화면에서 음악에 로우패스를 걸거나, 대화 중에 음악을 낮추는 연출을 이 기능으로 만듭니다.","state ducking filter dynamic-mix");
T("dynamic-mix","다이내믹 믹싱","Dynamic Mixing","ga","게임 상황에 따라 음악, 효과음, 대사의 균형이 실시간으로 바뀌도록 하는 믹싱입니다.","음악의 음량은 작곡가가 아니라 게임의 믹스가 최종 결정합니다. 음악이 작게 재생되어도 핵심 요소가 들리는지 확인하세요.","snapshot ducking implementation");
T("memory-budget","메모리 예산","Memory Budget","ga","오디오가 사용할 수 있도록 배정된 메모리의 양입니다. 플랫폼과 프로젝트에 따라 다릅니다.","음악의 길이, 레이어 수, 압축 품질이 모두 이 예산의 영향을 받습니다. 음악 설계 초기에 한도를 물어보세요.","streaming codec soundbank voice-limit");
T("voice-limit","보이스 제한","Voice Limit","ga","동시에 재생할 수 있는 소리의 수에 대한 제한입니다.","음악 레이어 하나하나가 보이스를 차지합니다. 효과음이 몰리는 전투 중에 음악 레이어가 끊기지 않도록 우선순위를 설정합니다.","memory-budget vertical streaming");
T("callback","뮤직 콜백(박자 동기화)","Music Callback / Beat Sync","ga","미들웨어가 음악의 박, 마디, 마커 위치를 게임에 알려 주는 기능입니다.","리듬 게임이나, 음악의 박에 맞춰 조명과 적이 움직이는 연출에 씁니다. 마커를 정확히 찍으려면 템포 정보가 담긴 파일을 넘겨야 합니다.","tempo-map event sync-point");
T("intensity","전투 강도","Intensity","ga","전투의 격렬함을 나타내도록 게임이 계산한 수치입니다. 적의 수, 플레이어 체력 등으로 정하고 음악의 레이어나 구간에 연결합니다.","강도를 세 단계 정도로 나눠 작곡하는 것이 다루기 쉽습니다. 단계 사이를 오갈 때 음악이 어색하지 않은지 확인하세요.","rtpc vertical battle-music stealth");
T("stealth","잠입 음악의 경계 단계","Stealth Music States","ga","잠입 게임에서 적의 상태를 미발견, 의심, 발각, 수색처럼 단계로 나누고 단계마다 음악을 다르게 하는 설계입니다.","음악이 플레이어에게 현재 상태를 알려 주는 정보 역할을 합니다. 단계마다 귀로 바로 구분되는 차이를 두세요.","state intensity vertical");
T("fanfare","승리 팡파르","Victory Fanfare","ga","전투 승리나 목표 달성 직후에 나오는 짧고 화려한 음악입니다.","전투 음악의 조성과 이어지게 만들거나, 타악기로 시작해 조성 충돌을 피합니다. 뒤에 결과 화면용 루프가 이어지는 구성이 많습니다.","jingle stinger ending-tag");
T("menu-music","메뉴·로딩 음악","Menu / Loading Music","ga","타이틀 화면, 설정 화면, 로딩 화면에서 재생되는 음악입니다.","플레이어가 얼마나 머물지 알 수 없는 화면입니다. 로딩 음악은 언제 끊겨도 어색하지 않게 만들고, 메뉴 음악은 오래 들어도 부담 없는 밀도로 쓰세요.","main-title loop sus");
T("silence","무음 설계","Silence Design","ga","음악이 나오지 않는 시간을 의도적으로 배치하는 것입니다.","음악이 계속 나오면 중요한 순간의 음악이 힘을 잃습니다. 음악이 없는 구간과 다시 시작되는 조건을 설계서에 적어 두세요.","listening-fatigue ambient-music music-design-doc");
T("music-design-doc","음악 설계서","Music Design Document","ga","게임 음악의 방향, 곡 목록, 각 곡의 구조, 전환 규칙, 기술 사양을 정리한 문서입니다.","작곡 전에 이 문서로 팀과 합의하세요. 포트폴리오에 설계서를 함께 넣으면 곡만 넣었을 때보다 실무 이해도를 잘 보여 줄 수 있습니다.","asset-list adaptive-music state");
T("asset-list","에셋 리스트","Asset List","ga","제작할 음악 파일의 목록입니다. 파일 이름, 길이, 루프 여부, 사용 위치, 진행 상태를 적습니다.","표로 만들어 진행 상태를 관리하세요. 외주 작업에서는 이 목록이 견적과 일정의 기준이 됩니다.","music-design-doc naming delivery");
T("naming","파일 이름 규칙","Naming Convention","ga","파일 이름을 짓는 규칙입니다. 종류, 지역, 곡 이름, 레이어, 버전 등을 정해진 순서로 적습니다.","예를 들어 MUS_Forest_Explore_L2_v03처럼 씁니다. 팀의 규칙이 있으면 그것을 따르고, 없으면 먼저 제안하세요.","asset-list delivery event");
T("fm-synth","FM 음원","FM Synthesis","ga","한 오실레이터의 신호로 다른 오실레이터의 주파수를 변조해 소리를 만드는 방식입니다. 1980~90년대 아케이드 기판과 메가드라이브 같은 게임기에서 널리 쓰였습니다.","금속성 벨, 일렉트릭 피아노, 단단한 베이스가 특징입니다. 레트로풍 게임음악에서 칩튠과 구분되는 색을 줍니다.","chiptune synthesizer oscillator");
T("tracker","트래커 음악","Tracker / MOD Music","ga","짧은 샘플을 세로로 흐르는 패턴 표에 숫자로 입력해 만드는 음악과 그 프로그램입니다. 아미가 컴퓨터 시절부터 쓰였습니다.","적은 용량으로 곡을 만들던 방식이라 샘플을 아껴 쓰는 편곡법을 배울 수 있습니다.","chiptune sequenced sampling");
T("sequenced","시퀀스 음악과 스트림 음악","Sequenced / Streamed Music","ga","연주 정보만 저장해 두고 게임기 안의 음원으로 재생하는 것이 시퀀스 음악입니다. 녹음된 오디오 파일을 그대로 재생하는 것은 스트림 음악입니다.","옛 게임기는 용량 때문에 시퀀스 방식을 썼고 지금은 대부분 스트림 방식입니다. 시퀀스 방식은 템포와 악기를 실시간으로 바꾸기 쉽다는 장점이 있습니다.","general-midi tracker streaming chiptune");
T("general-midi","GM과 사운드폰트","General MIDI / SoundFont","ga","GM은 악기 번호 128개의 배열을 통일한 MIDI 표준입니다. 사운드폰트는 샘플 악기 묶음을 담는 파일 형식입니다.","90년대 PC 게임 음악의 소리를 재현하고 싶을 때 찾게 됩니다.","midi sequenced sample-library");
T("audio-director","오디오 디렉터","Audio Director","ga","게임 음향 전체의 방향, 품질, 일정, 예산을 책임지는 사람입니다.","외주 작곡가는 대부분 오디오 디렉터나 음악 담당자와 소통합니다. 피드백을 받으면 고칠 내용을 정리해서 다시 확인받으세요.","technical-sd outsourcing music-design-doc");
T("technical-sd","테크니컬 사운드 디자이너","Technical Sound Designer","ga","미들웨어와 게임 엔진에서 사운드와 음악이 의도대로 동작하도록 구현하는 사람입니다.","작곡가가 구현 구조를 이해하고 있으면 이 직군과의 협업이 빨라집니다.","implementation middleware audio-director");
T("outsourcing","인하우스와 외주","In-house / Outsourcing","ga","회사에 소속되어 일하는 것이 인하우스, 프로젝트 단위로 계약해서 일하는 것이 외주입니다.","게임음악 작곡은 외주 비중이 큰 분야입니다. 외주로 일하려면 견적, 일정 관리, 계약서 검토까지 스스로 해야 합니다.","work-for-hire audio-director asset-list");

/* ───── 추가: 작곡 도구·MIDI ───── */
T("plugin","플러그인","Plugin (VST, AU, AAX)","pr","DAW 안에 불러와 쓰는 추가 프로그램입니다. 악기와 이펙트가 있으며 VST, AU, AAX 같은 형식이 있습니다.","DAW마다 지원하는 형식이 다릅니다. 구매하기 전에 내 DAW와 운영체제에서 동작하는지 확인하세요.","virtual-instrument daw insert");
T("insert","인서트 이펙트","Insert Effect","pr","트랙의 신호 전체가 통과하도록 트랙에 직접 거는 이펙트입니다.","EQ와 컴프레서는 인서트로, 리버브와 딜레이는 센드로 쓰는 것이 일반적입니다.","bus plugin eq");
T("sampler","샘플러","Sampler","pr","녹음된 소리를 건반에 배치해 연주할 수 있게 하는 악기입니다. 네이티브 인스트루먼츠의 콘탁트가 널리 쓰입니다.","직접 녹음한 소리를 샘플러에 올려 악기로 만들어 보세요. 한 음만 녹음해도 음높이를 바꿔 연주할 수 있습니다.","sampling sample-library virtual-instrument");
T("subtractive","감산 합성","Subtractive Synthesis","pr","배음이 많은 파형에서 필터로 일부를 깎아 내어 소리를 만드는 합성 방식입니다. 가장 기본적인 신시사이저 구조입니다.","오실레이터, 필터, 엔벨로프 순서로 신호가 흐른다는 것만 이해하면 대부분의 신시사이저를 다룰 수 있습니다.","synthesizer oscillator filter adsr");
T("wavetable","웨이브테이블 합성","Wavetable Synthesis","pr","여러 파형을 순서대로 담은 표를 준비해 두고, 그 사이를 이동하면서 음색을 변화시키는 합성 방식입니다.","음색이 시간에 따라 움직이는 패드와 베이스를 만들기 좋습니다. 현대적인 하이브리드 스코어에서 자주 들립니다.","synthesizer lfo subtractive");
T("granular","그래뉼러 합성","Granular Synthesis","pr","소리를 아주 짧은 조각으로 잘라 다시 배열하고 겹쳐서 새로운 소리를 만드는 방식입니다.","악기 샘플 하나를 늘여 독특한 앰비언트 텍스처로 바꿀 수 있습니다. 나만의 음색을 만들 때 유용합니다.","sampling ambient-music time-stretch");
T("arpeggiator","아르페지에이터","Arpeggiator","pr","누르고 있는 화음의 구성음을 정해진 패턴과 속도로 자동 연주해 주는 기능입니다.","템포에 동기화된 신스 아르페지오는 SF 장르와 추격 장면의 추진력을 만듭니다.","arpeggio synthesizer ostinato");
T("pitch-bend","피치 벤드","Pitch Bend","pr","음높이를 연속적으로 올리거나 내리는 MIDI 메시지입니다. 컨트롤 체인지와는 별개의 메시지이며 더 세밀한 값을 씁니다.","벤드 범위는 악기 설정에 따라 다릅니다. 같은 데이터가 다른 악기에서 다른 폭으로 재생될 수 있으니 범위를 확인하세요.","midi portamento cc mpe");
T("aftertouch","애프터터치","Aftertouch","pr","건반을 누른 뒤 더 깊이 누르는 힘을 전달하는 MIDI 메시지입니다.","비브라토나 필터 변화에 연결해 두면 한 손으로 연주하면서 표현을 더할 수 있습니다.","midi cc mpe");
T("mpe","MPE","MIDI Polyphonic Expression","pr","음 하나하나에 채널을 따로 배정해서, 음마다 독립적으로 음높이와 음색 변화를 줄 수 있게 한 MIDI 확장 규격입니다.","화음 중 한 음만 벤드하는 표현이 가능합니다. 전용 컨트롤러와 MPE를 지원하는 악기가 필요합니다.","pitch-bend aftertouch midi");
T("expression-map","익스프레션 맵","Expression Map / Articulation Set","pr","주법 이름과 키스위치를 연결해 두고, DAW에서 주법을 이름으로 지정할 수 있게 하는 기능입니다. 큐베이스에서는 익스프레션 맵, 로직에서는 아티큘레이션 세트라고 부릅니다.","키스위치 음표를 직접 입력하는 것보다 수정하기 쉽습니다. 템플릿을 만들 때 함께 설정해 두세요.","keyswitch template articulation");
T("mic-position","마이크 포지션","Microphone Positions","pr","샘플 라이브러리가 제공하는 녹음 위치별 신호입니다. 악기 가까이의 클로즈, 지휘자 위쪽의 트리, 홀 뒤쪽의 앰비언트 등이 있습니다.","클로즈 비중을 높이면 또렷하고 가까워지고, 앰비언트 비중을 높이면 멀고 웅장해집니다. 켜는 마이크가 많을수록 메모리를 더 씁니다.","sample-library decca-tree reverb");
T("decca-tree","데카 트리","Decca Tree","pr","무지향성 마이크 세 개를 T자 모양으로 배치하는 오케스트라 녹음 방식입니다. 지휘자 위쪽에 설치합니다.","오케스트라 라이브러리의 트리(Tree) 마이크가 이 방식으로 녹음된 신호입니다.","mic-position scoring-session stereo-image");
T("freeze","프리즈","Freeze","pr","트랙을 임시로 오디오로 바꿔 CPU와 메모리 부담을 줄이는 기능입니다. 해제하면 다시 편집할 수 있습니다.","대형 오케스트라 템플릿에서 컴퓨터가 버거울 때 씁니다. 편집이 끝난 섹션부터 프리즈하세요.","daw latency template");
T("time-stretch","타임 스트레치·피치 시프트","Time Stretch / Pitch Shift","pr","타임 스트레치는 음높이를 유지한 채 길이를 바꾸는 처리이고, 피치 시프트는 길이를 유지한 채 음높이를 바꾸는 처리입니다.","변화 폭이 크면 소리가 부자연스러워집니다. 영상 편집이 바뀌어 큐 길이를 조금 맞춰야 할 때 쓸 수 있습니다.","granular picture-lock sampling");
T("comping","컴핑","Comping","pr","같은 구간을 여러 번 녹음한 뒤 잘된 부분만 골라 하나의 연주로 합치는 편집입니다.","이어 붙인 자리마다 짧은 크로스페이드를 넣어야 잡음이 나지 않습니다.","overdub daw crossfade");
T("file-format","오디오 파일 형식","Audio File Formats","pr","WAV와 AIFF는 압축하지 않은 형식이고, FLAC은 음질 손실 없이 압축한 형식입니다. MP3, AAC, Ogg Vorbis는 음질을 일부 버리고 용량을 줄인 형식입니다.","납품은 보통 WAV로 합니다. MP3는 파일 앞뒤에 짧은 무음이 생길 수 있어서 루프 음악 확인용으로도 적합하지 않습니다.","codec bit-depth sample-rate delivery");
T("monitoring","모니터 스피커와 헤드폰","Studio Monitors / Headphones","pr","음을 꾸미지 않고 최대한 있는 그대로 들려주도록 만든 작업용 스피커와 헤드폰입니다.","방의 울림이 스피커 성능보다 큰 영향을 줍니다. 한 가지 장비에만 의존하지 말고 이어폰, 휴대폰, TV 스피커로도 확인하세요.","reference-track mono-compat audio-interface");
T("ai-music","생성형 AI 음악 도구","Generative AI Music Tools","pr","글로 쓴 설명이나 조건을 입력하면 음악을 만들어 주는 도구입니다.","레퍼런스를 찾거나 아이디어를 스케치하는 데 쓸 수 있습니다. 상업적 사용 범위와 권리 관계는 서비스 약관과 시기에 따라 다르고 법적으로 정리되지 않은 부분도 있으니, 납품물에 쓰기 전에 약관과 의뢰처의 방침을 확인하세요.","reference-track demo copyright");

/* ───── 추가: 믹싱·마스터링 ───── */
T("decibel","데시벨(dB·dBFS)","Decibel","mx","소리의 크기를 비율로 나타내는 단위입니다. dBFS는 디지털에서 표현할 수 있는 최대 크기를 0으로 두고 그 아래를 음수로 나타냅니다.","6dB를 올리면 신호의 진폭이 약 두 배가 됩니다. 피드백에서 '2dB만 내려 주세요' 같은 말을 들었을 때 어느 정도인지 감이 오도록 익히세요.","headroom clipping peak-rms");
T("peak-rms","피크와 RMS","Peak / RMS","mx","피크는 순간적으로 가장 큰 값이고, RMS는 일정 시간 동안의 평균적인 크기입니다.","사람이 느끼는 음량은 피크보다 평균에 가깝습니다. 피크가 같아도 RMS가 높으면 더 크게 들립니다.","decibel lufs true-peak metering");
T("metering","미터링","Metering","mx","미터로 신호의 크기, 라우드니스, 주파수 분포, 위상 등을 눈으로 확인하는 것입니다.","최종 판단은 귀로 하되, 납품 규격은 미터로 확인해야 합니다. 라우드니스 미터와 스펙트럼 분석기 사용법은 익혀 두세요.","lufs true-peak peak-rms phase");
T("frequency","주파수 대역","Frequency Range","mx","소리의 높낮이를 나타내는 진동수를 구간으로 나눈 것입니다. 사람은 대략 20Hz에서 20kHz까지 들을 수 있고, 저역, 중역, 고역으로 나눠 부릅니다.","사람의 말소리 명료도는 대체로 중고역에 달려 있습니다. 대사가 있는 장면의 음악은 그 대역을 양보하세요.","eq masking overtone lfe");
T("masking","마스킹","Masking","mx","비슷한 주파수 대역의 큰 소리 때문에 작은 소리가 들리지 않게 되는 현상입니다.","선율이 안 들릴 때 음량을 올리기 전에 같은 대역을 차지한 다른 악기를 찾으세요. 음역을 옮기거나 EQ로 자리를 내주면 해결됩니다.","frequency eq ducking texture");
T("lfe","LFE와 서브우퍼","Low-Frequency Effects","mx","서라운드 포맷에서 저음 효과 전용으로 쓰는 채널이 LFE입니다. 5.1의 '.1'에 해당하고 서브우퍼로 재생됩니다.","LFE 채널이 없는 재생 환경에서는 그 채널의 소리가 빠질 수 있습니다. 음악의 저음을 LFE에만 넣지 마세요.","surround frequency downmix");
T("downmix","다운믹스","Downmix","mx","채널이 많은 포맷의 음향을 더 적은 채널로 합치는 것입니다. 5.1을 스테레오로 바꾸는 경우가 대표적입니다.","서라운드로 작업했다면 스테레오로 다운믹스한 소리도 반드시 들어 보세요. 대부분의 사용자는 스테레오로 듣습니다.","surround mono-compat lfe");
T("mid-side","미드·사이드","Mid/Side","mx","스테레오 신호를 좌우가 아니라 가운데 성분(미드)과 양옆 성분(사이드)으로 나눠 다루는 방식입니다.","사이드의 저역을 줄이면 저음이 가운데로 모여 단단해집니다. 과하게 쓰면 위상 문제가 생길 수 있습니다.","stereo-image phase mono-compat");
T("saturation","새츄레이션·디스토션","Saturation / Distortion","mx","신호를 일부러 찌그러뜨려 배음을 더하는 처리입니다. 약하게 걸면 새츄레이션, 강하게 걸면 디스토션이라고 부릅니다.","가상악기 소리가 너무 깨끗해서 얇게 들릴 때 새츄레이션을 조금 걸면 밀도가 생깁니다.","overtone power-chord clipping");
T("modulation-fx","코러스·플랜저·페이저","Chorus / Flanger / Phaser","mx","원음에 시간이나 위상이 조금 다른 복사본을 섞고 그 차이를 주기적으로 흔들어 소리에 움직임과 두께를 주는 이펙트입니다.","신스 패드와 일렉트릭 기타에 주로 씁니다. 레트로 신스 음악의 색을 낼 때 코러스가 큰 역할을 합니다.","lfo delay stereo-image");
T("gate","게이트·익스팬더","Gate / Expander","mx","정해 둔 크기보다 작은 소리를 줄이거나 차단하는 장치입니다.","녹음된 트랙에서 연주 사이의 잡음을 줄일 때 씁니다. 잔향의 끝을 일부러 끊는 효과로도 쓸 수 있습니다.","compressor noise-floor sidechain");
T("transient","트랜지언트","Transient","mx","소리가 시작되는 순간의 짧고 강한 부분입니다. 타악기의 타격음이 대표적입니다.","타격감이 약하면 음량을 올리지 말고 트랜지언트를 살리세요. 컴프레서의 어택을 느리게 하거나 트랜지언트 전용 플러그인을 씁니다.","compressor adsr limiter");
T("parallel-comp","병렬 컴프레션","Parallel Compression","mx","원래 신호와, 강하게 압축한 복사본을 섞는 기법입니다.","트랜지언트는 유지하면서 작은 소리를 끌어올릴 수 있습니다. 대형 타악기에 무게를 더할 때 자주 씁니다.","compressor bus transient multiband");
T("multiband","멀티밴드 컴프레서","Multiband Compressor","mx","주파수 대역을 여러 개로 나눠 대역마다 따로 압축하는 장치입니다.","특정 대역만 가끔 튀는 문제를 다룰 때 씁니다. 설정이 복잡하니 EQ와 일반 컴프레서로 해결되지 않을 때 꺼내세요.","compressor eq parallel-comp");
T("convolution","컨볼루션 리버브","Convolution Reverb","mx","실제 공간의 울림을 녹음한 데이터(임펄스 응답)를 이용해 그 공간의 잔향을 재현하는 리버브입니다.","성당, 콘서트홀, 동굴처럼 특정 공간을 그대로 재현하고 싶을 때 씁니다. 게임 안의 공간 잔향에도 같은 원리가 쓰입니다.","reverb predelay diegetic");
T("predelay","프리딜레이와 초기 반사음","Pre-delay / Early Reflections","mx","프리딜레이는 원음이 난 뒤 잔향이 시작되기까지의 시간입니다. 초기 반사음은 벽에 한두 번 부딪혀 가장 먼저 돌아오는 소리로, 공간의 크기와 거리감을 알려 줍니다.","프리딜레이를 늘리면 원음이 잔향에 묻히지 않고 앞에 남습니다. 선율 악기에 리버브를 많이 걸고 싶을 때 조절하세요.","reverb convolution delay");
T("dry-wet","드라이·웻","Dry / Wet","mx","이펙트가 걸리지 않은 원래 소리를 드라이, 이펙트가 걸린 소리를 웻이라고 합니다.","잔향이 이미 녹음된 라이브러리에 리버브를 더하면 웻 성분이 두 번 쌓입니다. 라이브러리가 어떤 상태로 녹음됐는지 먼저 확인하세요.","reverb mic-position bus");
T("noise-floor","노이즈 플로어","Noise Floor","mx","아무 소리도 내지 않을 때 장비와 환경에서 나오는 바닥 잡음의 크기입니다.","조용한 곡일수록 잡음이 드러납니다. 녹음 음원을 여러 겹 쌓으면 잡음도 함께 쌓이니 필요 없는 구간은 잘라 내세요.","gate dynamic-range bit-depth");
T("normalize","노멀라이즈","Normalize","mx","파일 전체의 음량을 정해 둔 기준에 맞게 일괄적으로 올리거나 내리는 처리입니다. 피크 기준과 라우드니스 기준이 있습니다.","게임에 들어갈 여러 곡의 음량을 맞출 때는 라우드니스 기준으로 측정하세요. 피크만 맞추면 곡마다 체감 음량이 다릅니다.","lufs peak-rms delivery");
T("fade","페이드 인·아웃","Fade In / Out","mx","소리를 서서히 키우며 시작하거나 서서히 줄이며 끝내는 처리입니다.","파일의 시작과 끝에 아주 짧은 페이드를 넣으면 '틱' 하는 잡음을 막을 수 있습니다. 루프 파일은 이음매가 달라지므로 페이드를 넣지 않습니다.","crossfade loop-point bounce");
T("binaural","바이노럴·앰비소닉","Binaural / Ambisonics","mx","바이노럴은 헤드폰 두 채널만으로 입체적인 방향감을 재현하는 방식입니다. 앰비소닉은 청취자를 둘러싼 구 전체의 소리를 기록하는 포맷으로 VR에서 주로 쓰입니다.","VR 게임에서는 음악을 머리에 고정할지, 공간에 고정할지를 정해야 합니다. 이 결정이 편곡과 믹싱 방식을 바꿉니다.","atmos surround diegetic");

/* ───── 추가: 국내 현장 용어 ───── */
T("money-chord","머니 코드","I–V–vi–IV Progression","th","I–V–vi–IV 순서의 코드 진행을 국내에서 부르는 말입니다. 다장조라면 C–G–Am–F입니다. 수많은 히트곡에 쓰여서 이런 이름이 붙었습니다.","익숙한 만큼 안정적이지만 그대로 쓰면 어디서 들어 본 곡이 됩니다. 한 화음을 차용화음으로 바꾸거나 베이스 음을 바꿔서 변화를 주세요.","progression canon-chord royal-road modal-interchange");
T("canon-chord","캐논 코드","Pachelbel's Canon Progression","th","파헬벨의 캐논에 나오는 I–V–vi–iii–IV–I–IV–V 진행을 부르는 말입니다. 다장조라면 C–G–Am–Em–F–C–F–G입니다.","베이스가 순차적으로 내려가도록 자리바꿈을 쓰면 더 매끄럽습니다. 발라드와 감동적인 엔딩곡에서 자주 들립니다.","progression money-chord inversion ballad");
T("royal-road","왕도 진행","Royal Road Progression (IV–V–iii–vi)","th","IV–V–iii–vi 순서의 코드 진행입니다. 다장조라면 F–G–Em–Am입니다. 일본 대중음악과 애니메이션 음악에서 매우 많이 쓰여 일본에서 붙은 이름이 국내에도 그대로 쓰입니다.","으뜸화음으로 해결하지 않고 계속 이어지기 때문에 밝으면서도 아련한 느낌이 납니다. 서브컬처 게임 음악을 쓸 때 꼭 알아야 하는 진행입니다.","progression money-chord jpop function");
T("mr-ar","MR·AR·Inst","Music Recorded / All Recorded / Instrumental","pr","국내에서 MR은 보컬을 뺀 반주 음원을, AR은 보컬까지 모두 들어간 음원을 말합니다. Inst는 반주만 있는 버전을 뜻하는 인스트루멘털의 줄임말입니다. MR과 AR은 영어권에서는 거의 쓰지 않는 표현입니다.","해외 업체와 일할 때는 instrumental, full mix라고 써야 통합니다. 납품 목록에 어떤 버전이 필요한지 미리 확인하세요.","delivery stem bounce insert-song");
T("topline","탑라인","Topline","pr","반주 위에 얹는 보컬 멜로디와 가사를 말합니다. 트랙을 먼저 만들고 그 위에 탑라인을 쓰는 작업 방식에서 나온 말입니다.","게임 주제가나 캐릭터 송을 만들 때 트랙 담당과 탑라인 담당이 나뉘기도 합니다. 보컬 음역을 먼저 확인하고 쓰세요.","insert-song guide theme kpop");
T("guide","가이드","Guide Track","pr","본 녹음 전에 멜로디와 분위기를 전달하려고 임시로 녹음한 음원입니다. 가이드 보컬, 가이드 멜로디처럼 씁니다.","가수나 연주자는 가이드를 듣고 연습합니다. 음정과 박자가 정확해야 본 녹음 시간이 줄어듭니다.","demo topline session overdub");
T("session","세션(리얼 녹음)","Session Musician / Live Recording","pr","국내에서 세션은 녹음에 참여하는 전문 연주자, 또는 그 녹음 작업을 가리킵니다. 가상악기가 아닌 실제 연주를 녹음한 것을 흔히 리얼이라고 부릅니다.","기타, 스트링, 국악기는 리얼로 바꿨을 때 차이가 큰 악기입니다. 세션에게 줄 악보와 가이드 음원, 클릭이 들어간 반주를 미리 준비하세요.","overdub scoring-session part guide click-track");
T("midi-programming","미디 찍기(시퀀싱)","MIDI Programming / Sequencing","pr","MIDI 음표를 입력하고 다듬어 연주를 만드는 작업을 국내 현장에서는 흔히 '미디를 찍는다'고 말합니다. 시퀀싱, 프로그래밍과 같은 뜻입니다.","마우스로만 찍으면 벨로시티와 타이밍이 평평해집니다. 건반으로 직접 쳐서 녹음한 뒤 다듬는 순서를 권합니다.","midi piano-roll velocity humanize quantize");
T("spatial-fx","공간계·다이내믹계","Time-based / Dynamics Effects","mx","국내에서 이펙트를 나눠 부르는 말입니다. 리버브와 딜레이처럼 공간감을 만드는 것을 공간계, 컴프레서와 리미터처럼 음량 변화를 다루는 것을 다이내믹계라고 합니다. 코러스나 플랜저는 모듈레이션계라고 부릅니다.","공간계는 센드로, 다이내믹계는 인서트로 거는 것이 기본입니다.","reverb delay compressor insert bus modulation-fx");

/* ───── 장르·스타일 ───── */
T("edm","EDM","Electronic Dance Music","ge","클럽과 페스티벌에서 춤추기 위해 만든 전자음악을 통틀어 부르는 말입니다. 하우스, 테크노, 트랜스, 덥스텝 등이 여기에 속합니다.","의뢰서에 EDM이라고만 적혀 있으면 범위가 너무 넓습니다. 어떤 하위 장르를 뜻하는지 레퍼런스 곡을 받아서 확인하세요.","house techno trance dubstep drop");
T("drop","빌드업과 드롭","Build-up / Drop","ge","빌드업은 리듬과 음높이를 점점 끌어올려 긴장을 쌓는 구간입니다. 드롭은 그 직후 베이스와 킥이 한꺼번에 들어오면서 에너지가 터지는 구간입니다.","전자음악만의 문법이 아닙니다. 보스전 진입, 트레일러의 클라이맥스에도 같은 구조를 씁니다. 드롭 직전에 짧은 무음을 두면 효과가 커집니다.","edm riser trailer-music dubstep");
T("house","하우스","House","ge","매 박마다 킥 드럼이 나오는 4분의 4박자 리듬을 바탕으로 한 댄스 음악입니다. 템포는 보통 120~130BPM입니다. 1980년대 시카고에서 시작됐습니다.","엇박에 들어가는 오픈 하이햇과 사이드체인이 걸린 베이스가 특징입니다. 로비 음악이나 캐주얼 게임에 밝은 하우스가 자주 쓰입니다.","edm techno disco sidechain");
T("techno","테크노","Techno","ge","기계적이고 반복적인 리듬과 음색 변화를 중심으로 한 전자음악입니다. 1980년대 디트로이트에서 시작됐습니다.","선율보다 음색과 필터의 변화로 곡을 끌고 갑니다. 긴 시간 동안 조금씩 변하는 구조라 반복 플레이 구간의 음악과 잘 맞습니다.","house industrial filter minimalism");
T("trance","트랜스","Trance","ge","반복되는 신스 아르페지오와 긴 빌드업, 감정적인 코드 진행이 특징인 전자음악입니다. 템포는 보통 130~140BPM대입니다.","빠른 템포 위에 넓고 서정적인 선율이 얹히기 때문에 레이싱, 슈팅, 리듬 게임 음악에 자주 쓰입니다.","edm arpeggiator drop pad");
T("dnb","드럼 앤 베이스","Drum and Bass","ge","160~180BPM 정도의 빠르고 잘게 쪼개진 드럼 리듬에 깊은 서브 베이스를 얹은 전자음악입니다. 줄여서 디앤비라고 부릅니다.","드럼은 빠르지만 베이스와 코드는 절반 속도로 움직여서 속도감과 여유가 함께 납니다. 액션, 레이싱 게임에서 자주 들립니다.","edm dubstep tr808");
T("dubstep","덥스텝","Dubstep","ge","140BPM 안팎에서 절반 속도로 느껴지는 무거운 리듬과, 거칠게 일그러지며 움직이는 베이스가 특징인 전자음악입니다.","베이스 음색을 만드는 일이 작곡의 절반입니다. 웨이브테이블 신스와 LFO, 디스토션을 다룰 줄 알아야 합니다.","edm drop wavetable lfo saturation");
T("trap","트랩","Trap","ge","808 베이스, 잘게 쪼개지는 하이햇, 절반 속도로 느껴지는 스네어가 특징인 힙합의 하위 장르입니다. 미국 남부에서 시작됐습니다.","오케스트라나 국악기와 섞은 하이브리드 트랩은 최근 게임 트레일러와 캐릭터 테마에서 자주 쓰입니다.","hiphop tr808 kpop hybrid-orchestra");
T("future-bass","퓨처 베이스","Future Bass","ge","두껍게 쌓은 신스 코드가 사이드체인과 필터로 출렁이는 소리가 특징인 전자음악입니다. 밝고 감성적인 분위기가 많습니다.","보컬 샘플을 잘라 음높이를 바꿔 선율처럼 쓰는 기법도 자주 씁니다. 캐주얼 게임과 서브컬처 게임에 어울립니다.","edm sidechain kpop jpop");
T("synthwave","신스웨이브","Synthwave","ge","1980년대 영화음악, 게임음악, 신스팝의 소리를 다시 불러온 전자음악입니다. 아날로그 신스 베이스와 아르페지오, 잔향을 짧게 끊은 스네어가 특징입니다.","네온, 야간 도로, 복고풍 SF 같은 이미지와 함께 쓰입니다. 음색을 고를 때 80년대 신시사이저 계열 프리셋에서 출발하세요.","city-pop cyberpunk arpeggiator modulation-fx subtractive");
