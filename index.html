T("lofi","로파이","Lo-fi (Lo-fi Hip Hop)","ge","일부러 음질을 낮춘 듯한 따뜻하고 거친 질감의 음악입니다. 느린 힙합 드럼, 재즈 화음, 테이프와 LP 잡음을 섞은 로파이 힙합이 대표적입니다.","공부나 휴식 때 틀어 두는 음악으로 익숙합니다. 힐링 게임, 카페 운영 게임의 BGM에 맞습니다. 7화음과 스윙이 살짝 들어간 드럼이 기본입니다.","hiphop jazz seventh swing saturation");
T("city-pop","시티팝","City Pop","ge","1970년대 말부터 80년대에 일본에서 유행한 도회적인 팝입니다. 펑크, 디스코, 재즈의 화성과 리듬이 섞여 있습니다.","메이저7, 마이너7 중심의 세련된 코드와 슬랩 베이스, 브라스 섹션이 특징입니다. 국내에서도 복고풍 콘셉트에 자주 요청됩니다.","funk disco seventh synthwave");
T("hiphop","힙합(붐뱁)","Hip Hop / Boom Bap","ge","샘플링과 드럼 비트 위에 랩을 얹는 음악입니다. 붐뱁은 묵직한 킥과 또렷한 스네어가 번갈아 나오는 1990년대식 비트를 말합니다.","드럼의 타이밍과 음색이 장르의 인상을 결정합니다. 그리드에서 살짝 밀고 당기는 그루브를 연구하세요.","trap lofi sampling groove");
T("funk","펑크(Funk)","Funk","ge","16분음표 단위의 당김음과 베이스, 리듬 기타의 짧게 끊는 연주가 중심인 음악입니다. 마디의 첫 박을 강하게 짚는 것이 특징입니다.","한글로는 펑크 록의 펑크(Punk)와 표기가 같아서 혼동이 잦습니다. 의뢰를 받으면 어느 쪽인지 반드시 확인하세요. 구분하려고 '훵크'라고 쓰기도 합니다.","disco groove syncopation city-pop rock");
T("disco","디스코","Disco","ge","매 박 킥 드럼, 옥타브로 오르내리는 베이스, 스트링과 브라스가 특징인 1970년대 댄스 음악입니다.","하우스의 뿌리가 되는 장르입니다. 복고풍 리듬 게임이나 파티 장면에 잘 맞습니다.","funk house city-pop");
T("rnb","R&B·소울","R&B / Soul","ge","가스펠과 블루스에 뿌리를 둔 보컬 중심의 음악입니다. 텐션이 들어간 화음과 느긋한 그루브가 특징입니다.","9, 11, 13 텐션 화음과 일렉트릭 피아노 음색이 장르의 색을 만듭니다.","tension groove jazz lofi");
T("rock","록","Rock","ge","일렉트릭 기타, 베이스, 드럼을 중심으로 한 밴드 음악입니다. 2박과 4박에 스네어가 들어가는 리듬이 기본입니다.","기타는 가상악기로 표현하기 가장 어려운 악기에 속합니다. 록 기반 전투곡이라면 기타만이라도 리얼 녹음을 검토하세요.","metal power-chord electric-guitar rhythm-section session");
T("metal","메탈","Metal","ge","강하게 일그러뜨린 기타, 빠른 더블 베이스 드럼, 낮게 조율한 리프가 특징인 록의 하위 장르입니다.","기타와 베이스, 킥이 모두 저음역에 몰립니다. 대역을 나눠 정리하지 않으면 믹스가 뭉칩니다.","rock symphonic-metal power-chord riff masking");
T("symphonic-metal","심포닉 메탈·오케스트랄 록","Symphonic Metal / Orchestral Rock","ge","록이나 메탈 밴드 편성에 오케스트라와 합창을 더한 음악입니다.","JRPG와 액션 게임의 보스전 음악에서 익숙한 편성입니다. 기타와 금관이 같은 대역에서 부딪히니 한쪽이 선율을 맡으면 다른 쪽은 리듬으로 물러나게 하세요.","metal hybrid-orchestra battle-music jrpg choir");
T("post-rock","포스트 록","Post-rock","ge","딜레이와 리버브를 깊게 건 기타로 긴 시간에 걸쳐 서서히 고조시키는 연주 음악입니다.","인디 게임의 엔딩이나 넓은 풍경을 보여 주는 장면에 어울립니다. 한 곡 전체가 하나의 긴 크레셴도라고 생각하고 구성하세요.","rock crescendo delay ambient-music");
T("industrial","인더스트리얼","Industrial","ge","금속을 두드리는 소리, 기계 소음, 강한 디스토션을 음악 재료로 쓰는 장르입니다.","공장, 디스토피아, 기계 보스에 맞습니다. 직접 녹음한 금속 소리를 타악기로 쓰면 효과음과 음악의 경계가 흐려지는 효과도 낼 수 있습니다.","cyberpunk techno saturation sampling");
T("jazz","재즈","Jazz","ge","스윙 리듬, 즉흥 연주, 7화음과 텐션을 쓰는 화성이 특징인 음악입니다. ii–V–I 진행이 기본 어법입니다.","술집, 카지노, 도시의 밤 장면에 자주 쓰입니다. 미디로 찍으면 가장 티가 나는 장르이니 연주자의 프레이징을 많이 듣고 따라 치세요.","swing seventh tension big-band noir bossa");
T("big-band","빅밴드","Big Band","ge","색소폰, 트럼펫, 트롬본 섹션과 리듬 섹션으로 이루어진 대편성 재즈 악단, 또는 그 음악입니다.","관악기가 짧고 강하게 함께 찌르는 연주가 특징입니다. 첩보물, 복고풍 액션, 카툰풍 음악에 씁니다.","jazz swing saxophone cartoon");
T("bossa","보사노바","Bossa Nova","ge","삼바 리듬에 재즈 화성을 얹은 브라질 음악입니다. 나일론 줄 기타의 당김음 반주와 조용한 분위기가 특징입니다.","카페, 휴양지, 상점 음악으로 자주 요청됩니다. 기타 반주 패턴과 림숏 리듬을 정확히 익히세요.","jazz latin acoustic-guitar syncopation");
T("latin","라틴 음악","Latin Music","ge","중남미에서 발전한 음악을 묶어 부르는 말입니다. 살사, 맘보, 삼바 등이 있으며 클라베라는 기준 리듬 위에 여러 타악기가 겹칩니다.","콩가, 봉고, 팀발레스 같은 타악기의 패턴이 장르마다 정해져 있습니다. 임의로 찍지 말고 패턴을 찾아서 쓰세요.","bossa tango hand-percussion polyrhythm");
T("tango","탱고","Tango","ge","아르헨티나에서 시작된 춤곡입니다. 반도네온의 날카로운 악센트와 단조의 격정적인 선율이 특징입니다.","긴장감 있는 대결, 유혹, 블랙 코미디 장면에 씁니다.","latin accordion accent");
T("reggae","레게","Reggae","ge","자메이카에서 시작된 음악입니다. 기타와 건반이 약박을 짧게 끊어 치고, 베이스가 선율처럼 움직입니다.","섬, 해변, 느긋한 마을 음악에 맞습니다. 박의 강세 위치가 다른 장르와 반대라는 점을 기억하세요.","world syncopation bass-guitar");
T("blues-genre","블루스","Blues","ge","12마디 형식과 블루스 스케일을 바탕으로 한 음악입니다. I, IV, V 화음을 모두 도미넌트7로 씁니다.","록, 재즈, R&B의 뿌리입니다. 12마디 진행을 외워 두면 여러 장르의 곡을 분석하기 쉬워집니다.","blues-scale jazz rock seventh");
T("folk","포크·어쿠스틱","Folk / Acoustic","ge","통기타 같은 어쿠스틱 악기와 소박한 선율을 중심으로 한 음악입니다.","마을, 고향, 일상 장면에 씁니다. 악기 수가 적어서 연주의 질감이 그대로 드러나므로 리얼 녹음의 효과가 큽니다.","acoustic-guitar celtic session");
T("ballad","발라드","Ballad","ge","국내에서 발라드는 느린 템포의 서정적인 가요를 말합니다. 피아노와 스트링이 중심이고, 후반부에 전조와 함께 크게 고조되는 구성이 많습니다.","드라마 OST와 게임 주제가에서 자주 요청됩니다. 보컬의 최고음이 어디에 오는지부터 정하고 조를 고르세요.","insert-song modulation canon-chord topline");
T("trot","트로트","Trot","ge","국내 성인가요의 대표 장르입니다. 2박 계열의 반복 리듬과 음을 꺾어 부르는 창법이 특징입니다.","코믹한 연출이나 향수를 자극하는 장면, 광고 음악에 쓰입니다. 브라스와 전자 오르간, 일렉트릭 기타의 간주가 장르의 색을 냅니다.","ballad sigimsae insert-song");
T("kpop","K팝","K-pop","ge","힙합, EDM, R&B 등 여러 장르를 한 곡 안에 섞고, 구간마다 분위기를 과감하게 바꾸는 한국 대중음악입니다.","게임 캐릭터 송이나 컬래버레이션 곡에서 요청됩니다. 구간 전환, 훅의 반복, 댄스 브레이크 같은 구성을 분석해 두세요.","topline trap future-bass riff");
T("jpop","J팝·애니송풍","J-pop / Anime Song Style","ge","일본 대중음악과 애니메이션 주제가의 어법을 따른 음악입니다. 빠른 템포, 잦은 코드 변화와 전조, 선율이 뚜렷한 후렴이 특징입니다.","서브컬처 게임의 주제가와 전투곡에서 기본으로 요구됩니다. 왕도 진행과 후렴 직전의 전조를 익히세요.","royal-road modulation jrpg symphonic-metal");
T("jrpg","JRPG풍","JRPG Style","ge","일본식 롤플레잉 게임 음악의 어법입니다. 선율이 뚜렷한 지역별 테마, 록과 오케스트라를 섞은 전투곡, 서정적인 마을 음악이 특징입니다.","선율이 주인공인 음악이라 반복 재생에서 피로가 생기기 쉽습니다. 선율을 맡는 악기를 구간마다 바꿔 주세요.","jpop theme battle-music symphonic-metal exploration-music");
T("newage","뉴에이지","New Age","ge","국내에서는 피아노를 중심으로 한 잔잔하고 서정적인 연주곡을 주로 뉴에이지라고 부릅니다.","힐링 게임, 감성적인 스토리 게임, 영상의 회상 장면에 요청됩니다. 왼손 아르페지오와 단순한 선율이 기본입니다.","neoclassical piano arpeggio ballad");
T("neoclassical","네오 클래식","Neoclassical / Modern Classical","ge","피아노와 현악 중심의 클래식 편성에 미니멀한 반복과 전자음을 더한 현대 연주 음악입니다.","소리를 작고 가깝게 녹음한 피아노, 약음기를 낀 현악이 자주 쓰입니다. 조용한 드라마와 다큐멘터리의 표준 어법에 가깝습니다.","minimalism newage chamber con-sordino");
T("epic","에픽 음악","Epic Music","ge","대편성 오케스트라, 합창, 대형 타악기로 웅장함을 강조한 음악입니다. 트레일러 음악에서 발전했습니다.","단순한 화음과 강한 리듬, 큰 음량 변화가 기본입니다. 모든 악기가 계속 크게 연주하면 오히려 작게 들리니 대비를 만드세요.","trailer-music hybrid-orchestra choir ostinato tutti");
T("baroque","바로크풍","Baroque Style","ge","1600년부터 1750년 무렵 유럽 음악의 어법입니다. 하프시코드, 통주저음, 대위법적인 선율, 장식음이 특징입니다.","궁정, 귀족, 고딕풍 성을 표현할 때 씁니다. 하프시코드와 현악 합주만으로도 시대감이 납니다.","counterpoint harpsichord trill sequence");
T("waltz","왈츠","Waltz","ge","3박자의 춤곡입니다. 첫 박에 베이스, 둘째와 셋째 박에 화음이 오는 반주가 기본입니다.","무도회뿐 아니라 기묘하고 불길한 분위기에도 씁니다. 단조 왈츠에 첼레스타나 오르골 음색을 얹으면 동화 속 공포 느낌이 납니다.","meter march celesta");
T("march","행진곡","March","ge","걷는 박에 맞춘 2박자 또는 4박자의 음악입니다. 스네어 드럼의 리듬과 금관의 선율이 중심입니다.","군대, 제국, 승리 장면에 씁니다. 단조와 낮은 금관으로 쓰면 위압적인 적 세력의 테마가 됩니다.","snare fanfare waltz trumpet");
T("celtic","켈틱","Celtic","ge","아일랜드와 스코틀랜드의 전통 음악에 바탕을 둔 양식입니다. 틴 휘슬, 피들, 일리언 파이프, 보란 같은 악기와 도리안, 믹솔리디안 선법을 씁니다.","판타지 게임의 마을과 초원 음악에서 표준처럼 쓰입니다. 6/8박자의 지그와 4/4박자의 릴 리듬, 선율의 장식음을 익히세요.","dorian mixolydian tin-whistle bagpipe medieval");
T("medieval","중세풍","Medieval Style","ge","유럽 중세와 르네상스 음악의 분위기를 따른 양식입니다. 류트, 리코더, 허디거디 같은 옛 악기와 선법, 지속 저음을 씁니다.","주점, 성, 시장 음악에 씁니다. 3화음을 꽉 채우기보다 5도와 옥타브 위주로 비워 두면 더 옛 음악처럼 들립니다.","celtic mode lute drone power-chord");
T("oriental","동양풍","East Asian Style","ge","동아시아 전통 음악의 음계, 악기, 표현을 빌린 음악을 국내 게임 업계에서 묶어 부르는 말입니다. 한국풍, 중국풍, 일본풍으로 다시 나뉩니다.","세 나라는 악기와 꾸밈음이 서로 다릅니다. 얼후와 해금, 고쟁과 가야금을 섞어 쓰면 배경 설정과 맞지 않는 음악이 됩니다. 어느 문화권인지부터 확인하세요.","fusion-gugak wuxia wafu pentatonic sigimsae");
T("wuxia","중국풍·무협풍","Chinese / Wuxia Style","ge","중국 전통 악기와 5음 음계를 쓴 음악입니다. 얼후, 고쟁, 비파, 디즈(대나무 피리)가 대표 악기입니다.","무협, 선협 게임에서 요구됩니다. 음을 미끄러뜨리는 꾸밈과 빠른 트레몰로가 악기마다 고유한 연주법이니 전용 라이브러리의 주법을 확인하세요.","oriental erhu guzheng pentatonic");
T("wafu","일본풍(와풍)","Japanese Style","ge","일본 전통 악기와 음계를 쓴 음악입니다. 국내 현장에서는 일본어를 그대로 읽어 와풍이라고도 부릅니다. 샤쿠하치, 고토, 샤미센, 타이코가 대표 악기입니다.","반음이 들어간 5음 음계가 특징이라 한국이나 중국의 음계와는 색이 다릅니다. 록 밴드와 섞은 와풍 록은 서브컬처 게임에서 자주 쓰입니다.","oriental shakuhachi koto shamisen taiko");
T("middle-east","중동풍","Middle Eastern Style","ge","아랍, 튀르키예, 페르시아 음악의 음계와 악기를 빌린 양식입니다. 우드, 다르부카 같은 악기와 반음보다 좁은 음정이 쓰입니다.","서양 음계로는 프리지안 도미넌트 음계가 가장 가깝게 들립니다. 선율 악기 하나가 장식음을 많이 넣어 연주하고 아래에 지속음을 까는 구성이 기본입니다.","phrygian oud drone world");
T("world","월드뮤직·에스닉","World Music / Ethnic","ge","서양 대중음악과 클래식 바깥의 여러 지역 전통 음악을 묶어 부르는 말입니다. 현장에서는 민속 악기 소리를 에스닉 악기라고 부릅니다.","악기 소리만 가져오고 연주법을 무시하면 어색합니다. 그 악기가 원래 연주하는 음계와 꾸밈음을 먼저 들어 보세요.","oriental middle-east celtic latin duduk");
T("western","웨스턴","Western","ge","서부극 음악의 양식입니다. 휘파람, 하모니카, 트레몰로를 건 일렉트릭 기타, 트럼펫, 말발굽 같은 리듬이 특징입니다.","엔니오 모리코네의 영화음악이 기준이 됩니다. 황야, 결투, 현상금 사냥꾼 캐릭터에 씁니다.","electric-guitar trumpet acoustic-guitar");
T("noir","누아르 재즈","Noir Jazz","ge","느린 템포의 어둡고 나른한 재즈입니다. 색소폰이나 약음기를 낀 트럼펫 독주, 브러시로 연주하는 드럼, 콘트라베이스가 중심입니다.","탐정, 비 오는 밤거리, 범죄물에 씁니다. 잔향을 넉넉히 주고 음 사이에 여백을 두세요.","jazz saxophone trumpet blues-scale");
T("horror","호러 스코어","Horror Score","ge","공포를 만들기 위한 음악 어법입니다. 톤 클러스터, 특수 주법, 극단적인 음역, 갑작스러운 큰 소리와 긴 정적을 씁니다.","소리가 없는 시간이 가장 무섭습니다. 음악이 언제 빠지고 언제 들어오는지를 먼저 설계하세요.","cluster sul-pont waterphone atonal silence stinger");
T("cyberpunk","사이버펑크 음악","Cyberpunk Music","ge","어두운 신시사이저, 일그러진 베이스, 기계적인 리듬으로 미래 도시를 표현하는 음악입니다.","신스웨이브가 복고적이고 밝은 쪽이라면 이쪽은 더 거칠고 무겁습니다. 인더스트리얼과 테크노의 요소를 섞어 씁니다.","synthwave industrial techno saturation");
T("cartoon","카툰풍·코믹 음악","Cartoon / Comedy Music","ge","익살스러운 동작과 상황을 강조하는 음악입니다. 피치카토, 바순, 실로폰, 약음기를 낀 금관이 자주 쓰입니다.","동작에 음악을 맞추는 미키마우징이 기본 어법입니다. 캐주얼 게임과 유아용 콘텐츠에서 요청됩니다.","mickey-mousing pizzicato bassoon mallets big-band");
T("drone","드론","Drone","ge","음높이가 변하지 않고 길게 이어지는 지속음, 또는 그런 소리를 중심으로 한 음악입니다.","불안, 신비, 광활함을 표현하는 가장 간단한 방법입니다. 지속음의 음색이 천천히 변하도록 필터나 레이어를 움직여 주세요.","pedal-point ambient-music medieval middle-east horror");

/* ───── 장르 추가 ───── */
T("synth-pop","신스팝","Synth-pop","ge","신시사이저와 드럼 머신을 중심으로 한 팝 음악입니다. 1970년대 말부터 80년대에 유행했습니다.","단순한 신스 베이스와 뚜렷한 선율, 기계적인 드럼이 기본입니다. 신스웨이브가 참고하는 원래의 소리입니다.","synthwave new-jack-swing subtractive arpeggiator");
T("vaporwave","베이퍼웨이브·퓨처 펑크","Vaporwave / Future Funk","ge","베이퍼웨이브는 1980~90년대 팝, 광고 음악, 라운지 음악을 느리게 늘리고 잔향을 입혀 재가공한 인터넷 음악입니다. 퓨처 펑크는 시티팝과 디스코 샘플을 빠르게 올리고 하우스 비트를 얹은 밝은 계열입니다.","샘플을 쓰는 장르라 그대로 따라 하면 권리 문제가 생깁니다. 납품용 곡에서는 샘플을 직접 연주해서 만들고 질감만 가져오세요.","city-pop french-house lofi sampling time-stretch");
T("french-house","프렌치 하우스","French House (Filter House)","ge","디스코와 펑크 샘플을 반복하면서 필터를 여닫고 사이드체인을 강하게 건 하우스 음악입니다. 필터 하우스라고도 부릅니다.","로우패스 필터를 천천히 여는 것만으로 구간을 전개합니다. 필터와 사이드체인의 쓰임을 익히기 좋은 장르입니다.","house disco filter sidechain vaporwave");
T("deep-house","딥 하우스·트로피컬 하우스","Deep House / Tropical House","ge","딥 하우스는 재즈와 소울의 화음을 쓴 느긋하고 부드러운 하우스입니다. 트로피컬 하우스는 템포가 더 느리고 마림바, 스틸 드럼 같은 밝은 음색을 쓰는 휴양지 분위기의 하우스입니다.","로비, 상점, 꾸미기 화면처럼 오래 머무는 화면에 무난합니다. 선율을 줄이고 코드와 그루브 위주로 구성하세요.","house seventh menu-music mallets");
T("prog-house","프로그레시브 하우스·빅 룸","Progressive House / Big Room","ge","프로그레시브 하우스는 레이어를 조금씩 더하며 길게 전개하는 하우스입니다. 빅 룸은 대형 페스티벌을 겨냥해 빌드업과 드롭을 크고 단순하게 만든 계열입니다.","레이어를 하나씩 쌓는 전개 방식은 수직 구조의 게임음악과 그대로 통합니다.","house drop vertical trance");
T("electro-swing","일렉트로 스윙","Electro Swing","ge","1920~40년대 스윙 재즈의 소리에 하우스나 힙합 비트를 얹은 음악입니다.","브라스 리프와 클라리넷, 옛 음반 같은 질감이 특징입니다. 복고풍이면서 경쾌한 캐릭터, 카지노, 카툰풍 게임에 씁니다.","big-band swing house cartoon");
T("breakbeat","브레이크비트","Breakbeat","ge","매 박에 킥을 넣는 대신, 당김음이 있는 드럼 연주 샘플을 잘라 붙여 리듬을 만드는 전자음악입니다.","드럼 앤 베이스, 정글, 빅 비트의 바탕입니다. 드럼 루프를 조각내 순서를 바꾸는 편집 기법을 익혀 두세요.","dnb hiphop sampling artcore");
T("uk-garage","UK 개러지(투스텝)","UK Garage / 2-Step","ge","130BPM 안팎에서 킥이 매 박에 오지 않고 건너뛰는 리듬과, 튀는 듯한 하이햇이 특징인 영국의 댄스 음악입니다.","가볍게 통통 튀는 리듬이라 세련된 도시 분위기에 맞습니다. 최근 K팝에서도 자주 들립니다.","house kpop swing jersey-club");
T("jersey-club","저지 클럽","Jersey Club","ge","미국 뉴저지에서 시작된 댄스 음악입니다. 한 마디 안에서 킥이 뒤쪽으로 몰려 튀는 독특한 패턴이 특징입니다.","K팝과 힙합에서 구간 전환용 리듬으로 많이 쓰입니다. 킥 패턴 하나로 장르가 구분되니 정확히 찍으세요.","kpop uk-garage trap");
T("hardcore","하드코어·하드스타일","Hardcore Techno / Hardstyle","ge","매우 빠른 템포와 강하게 일그러뜨린 킥이 특징인 전자음악입니다. 하드스타일은 150BPM 안팎이고 하드코어는 그보다 훨씬 빠릅니다.","리듬 게임에서 고난도 곡의 장르로 자주 쓰입니다. 킥의 음색과 음높이를 만드는 일이 작곡의 핵심입니다.","techno artcore saturation edm");
T("eurobeat","유로비트","Eurobeat","ge","빠른 템포에 화려한 신스 리프와 밝은 선율을 얹은 댄스 음악입니다. 유럽의 디스코에서 발전해 일본에서 크게 유행했습니다.","레이싱과 질주의 이미지로 굳어진 장르입니다. 신스 브라스 리프와 옥타브로 뛰는 베이스가 기본입니다.","disco trance synth-pop riff");
T("psytrance","사이키델릭 트랜스","Psychedelic Trance","ge","빠른 템포에서 16분음표로 구르는 베이스와 몽환적인 효과음이 반복되는 트랜스의 하위 장르입니다. 줄여서 사이트랜스라고 부릅니다.","킥 사이를 베이스가 채우는 리듬 구조가 특징입니다. 환각, 이세계, 외계 생명체 같은 소재에 어울립니다.","trance techno lfo");
T("artcore","아트코어·컴플렉스트로","Artcore / Complextro","ge","리듬 게임에서 자주 쓰는 장르 이름입니다. 아트코어는 빠른 브레이크비트 위에 피아노와 스트링의 서정적인 선율을 얹은 음악입니다. 컴플렉스트로는 여러 베이스 음색을 잘게 잘라 빠르게 바꿔 끼우는 일렉트로 하우스입니다.","리듬 게임 수록곡 공모에 지원한다면 이런 장르명과 대표곡을 알아야 합니다. 음표가 많아 보이도록 리듬을 촘촘하게 쓰는 것이 관례입니다.","breakbeat dnb hardcore dubstep callback");
T("glitch","글리치·IDM","Glitch / IDM","ge","글리치는 디지털 오류음, 끊기는 소리, 잘게 조각난 샘플을 재료로 쓰는 음악입니다. IDM은 춤보다 감상을 위해 만든 실험적인 전자음악을 가리킵니다.","해킹, 인공지능, 오작동하는 시스템을 표현할 때 씁니다. 음을 잘게 끊어 반복하는 스터터 효과가 기본 재료입니다.","cyberpunk granular sampling industrial");
T("trip-hop","트립합","Trip Hop","ge","느린 힙합 비트에 어두운 분위기, 재즈와 영화음악 샘플, 나른한 보컬을 얹은 음악입니다. 1990년대 영국 브리스톨에서 시작됐습니다.","음울한 도시, 심리극, 느린 추리 장면에 맞습니다. 드럼을 낮고 둔탁하게 만드는 것이 요령입니다.","hiphop noir lofi downtempo");
T("downtempo","다운템포·칠아웃","Downtempo / Chillout","ge","느린 템포의 편안한 전자음악을 묶어 부르는 말입니다.","휴식 공간, 설정 화면, 대기 화면에 씁니다. 강한 타격음과 높은 음역의 선율을 피하면 오래 들어도 부담이 없습니다.","ambient-music trip-hop lofi healing");
T("hyperpop","하이퍼팝","Hyperpop","ge","음높이를 올린 보컬, 과하게 일그러뜨린 베이스, 급격한 전개를 일부러 과장한 팝 음악입니다.","과잉과 인공적인 느낌이 장르의 핵심입니다. 가상 아이돌, 인터넷 문화 소재의 콘텐츠에 쓰입니다.","kpop glitch saturation future-bass");
T("phonk","폰크","Phonk","ge","옛 멤피스 랩 샘플과 808 카우벨, 일그러진 베이스가 특징인 힙합 계열 음악입니다. 빠른 템포의 드리프트 폰크는 자동차 영상과 함께 유행했습니다.","짧은 영상과 레이싱 콘텐츠에서 자주 요청됩니다. 카우벨 선율과 강하게 눌린 킥이 장르의 표시입니다.","trap tr808 hiphop saturation");
T("drill","드릴","Drill","ge","음높이가 미끄러지는 808 베이스와 어두운 선율, 불규칙하게 쪼개지는 하이햇이 특징인 힙합의 하위 장르입니다.","베이스가 음에서 음으로 미끄러지는 표현이 핵심입니다. 808에 글라이드를 설정해서 만듭니다.","trap tr808 portamento hiphop");
T("afrobeats","아프로비츠","Afrobeats","ge","서아프리카에서 발전한 현대 팝 음악입니다. 당김음이 많은 타악 리듬과 느긋한 그루브가 특징입니다.","킥과 스네어보다 셰이커, 림숏, 콩가 같은 타악기의 엇갈림이 리듬을 만듭니다.","african reggaeton hand-percussion groove");
T("reggaeton","레게톤","Reggaeton","ge","푸에르토리코에서 발전한 라틴 댄스 음악입니다. 뎀보라고 부르는 '쿵-치-쿵-칙' 형태의 반복 리듬이 특징입니다.","뎀보 리듬 하나만 들어가도 라틴 팝의 느낌이 납니다. 여름, 해변, 파티 분위기에 씁니다.","latin afrobeats kpop salsa");
T("new-jack-swing","뉴 잭 스윙","New Jack Swing","ge","1980년대 말부터 90년대 초에 유행한 음악입니다. 스윙감이 들어간 드럼 머신 리듬에 R&B 보컬과 신스 브라스를 얹었습니다.","90년대 복고 콘셉트에서 요청됩니다. 16분음표에 스윙 값을 주고 스네어를 크고 짧게 만드세요.","rnb swing kpop synth-pop");
T("punk-rock","펑크 록(Punk)","Punk Rock","ge","빠른 템포, 단순한 코드 서너 개, 거친 연주가 특징인 록 음악입니다. 밝은 선율을 더한 것을 팝 펑크라고 합니다.","한글 표기가 같은 펑크(Funk)와 전혀 다른 장르입니다. 반항적인 캐릭터, 스케이트보드, 학원물에 씁니다.","rock funk power-chord ska");
T("hard-rock","하드 록","Hard Rock","ge","강하게 일그러뜨린 기타 리프와 힘 있는 드럼, 높은 음역의 보컬이 특징인 록 음악입니다.","블루스에 바탕을 둔 기타 리프가 곡을 끌고 갑니다. 격투, 레이싱, 스포츠 게임 음악의 기본 어법입니다.","rock metal riff blues-genre electric-guitar");
T("indie-rock","얼터너티브·인디 록","Alternative / Indie Rock","ge","주류 록의 문법에서 벗어난 록 음악을 넓게 묶어 부르는 말입니다.","다듬지 않은 듯한 질감과 개성 있는 음색이 중요합니다. 인디 게임의 주제가와 청춘물 영상에 자주 쓰입니다.","rock shoegaze post-rock folk");
T("shoegaze","슈게이징·드림 팝","Shoegaze / Dream Pop","ge","리버브와 디스토션을 두껍게 겹친 기타 소리 속에 보컬이 묻히듯 섞이는 음악입니다. 드림 팝은 더 맑고 몽환적인 계열입니다.","선율보다 소리의 질감 전체가 분위기를 만듭니다. 꿈, 기억, 여름날의 아련함을 표현할 때 씁니다.","post-rock indie-rock reverb pad");
T("prog-rock","프로그레시브 록","Progressive Rock","ge","변박, 긴 구성, 복잡한 화성, 건반 악기의 화려한 연주가 특징인 록 음악입니다.","일본 롤플레잉 게임의 전투 음악에 큰 영향을 준 장르입니다. 오르간과 신스 리드, 홀수 박자 리프를 분석해 보세요.","odd-meter rock jrpg fusion-jazz organ");
T("djent","젠트","Djent","ge","낮게 조율한 7현, 8현 기타를 짧게 끊어 치면서 복잡하게 엇갈리는 리듬을 만드는 현대 메탈 계열입니다.","기타가 타악기처럼 리듬을 담당합니다. SF 액션과 기계 보스 음악에서 신시사이저와 섞어 씁니다.","metal polyrhythm electric-guitar cyberpunk");
T("power-metal","파워 메탈","Power Metal","ge","빠른 템포, 밝고 웅장한 선율, 높은 음역의 보컬, 화려한 기타 솔로가 특징인 메탈입니다.","판타지와 영웅 서사에 어울립니다. 기타 두 대가 3도로 겹쳐 선율을 연주하는 트윈 리드가 자주 쓰입니다.","metal symphonic-metal jrpg epic");
T("extreme-metal","익스트림 메탈","Extreme Metal (Death / Black)","ge","매우 빠른 드럼 연타, 낮게 으르렁거리거나 비명에 가까운 보컬, 불협화가 많은 리프를 쓰는 메탈 계열입니다. 데스 메탈, 블랙 메탈 등이 있습니다.","지옥, 악마, 극단적인 폭력성을 표현할 때 씁니다. 킥과 기타가 빠르게 겹치므로 믹스에서 저음 정리가 특히 중요합니다.","metal dissonance tremolo horror");
T("ska","스카","Ska","ge","기타와 건반이 엇박을 짧게 끊어 치고 브라스가 선율을 맡는 빠르고 경쾌한 음악입니다. 자메이카에서 시작됐고 레게보다 먼저 나왔습니다.","밝고 익살스러운 분위기에 맞습니다. 펑크 록과 섞은 스카 펑크는 학원물과 코미디에 자주 쓰입니다.","reggae punk-rock big-band");
T("rockabilly","로큰롤·로커빌리","Rock and Roll / Rockabilly","ge","1950년대에 블루스와 컨트리가 섞여 나온 음악입니다. 12마디 블루스 진행, 콘트라베이스를 때리듯 뜯는 주법, 짧은 잔향이 걸린 보컬과 기타가 특징입니다.","1950년대 미국 배경, 다이너, 복고풍 자동차에 씁니다.","blues-genre doo-wop surf-rock country");
T("doo-wop","두왑·올디스","Doo-wop / Oldies","ge","두왑은 여러 명이 화음으로 노래하는 1950년대 보컬 음악입니다. I–vi–IV–V 진행을 많이 씁니다. 국내에서는 1950~60년대 팝을 묶어 올디스라고 부릅니다.","밝은 옛 노래를 황폐한 장면에 붙여 대비를 만드는 연출에 자주 쓰입니다.","rockabilly progression diegetic acappella");
T("surf-rock","서프 록","Surf Rock","ge","스프링 리버브를 깊게 건 일렉트릭 기타가 빠르게 연타하며 선율을 연주하는 1960년대 기타 음악입니다.","해변뿐 아니라 첩보물, 범죄 코미디에도 씁니다. 기타의 잔향 음색이 장르를 결정합니다.","spy-music western electric-guitar rockabilly");
T("spy-music","스파이 음악","Spy Music","ge","첩보 영화에서 굳어진 음악 어법입니다. 반음씩 움직이는 리프, 짧게 찌르는 브라스, 서프 기타, 봉고가 특징입니다.","단조 화음 위에서 한 음이 반음씩 오르내리는 진행이 대표적입니다. 잠입, 작전 회의, 추격 장면에 씁니다.","surf-rock big-band chromatic stealth");
T("country","컨트리","Country","ge","미국 남부와 서부의 민속 음악에서 나온 대중음악입니다. 통기타, 스틸 기타, 피들, 밴조를 씁니다.","농장, 시골 마을, 미국식 도로 여행에 씁니다. 스틸 기타의 미끄러지는 음이 장르의 색을 냅니다.","bluegrass folk western acoustic-guitar");
T("bluegrass","블루그래스","Bluegrass","ge","밴조, 만돌린, 피들, 통기타, 콘트라베이스로 연주하는 빠른 어쿠스틱 음악입니다. 미국 애팔래치아 지방에서 나왔습니다.","드럼 없이 현악기만으로 속도감을 냅니다. 익살스러운 추격 장면에 자주 쓰입니다.","country folk celtic");
T("gospel","가스펠","Gospel","ge","미국 흑인 교회 음악에서 나온 양식입니다. 합창, 오르간, 손뼉, 선창과 응답을 주고받는 구성이 특징입니다.","후반부에 합창이 들어오며 고조되는 구성은 팝과 광고 음악에서도 널리 씁니다.","rnb choir organ requiem");
T("bebop","비밥","Bebop","ge","빠른 템포, 복잡한 화성 진행, 화려한 즉흥 연주가 특징인 1940년대의 재즈입니다.","소편성으로 연주합니다. 바쁜 도시, 정신없는 추격, 재치 있는 캐릭터에 어울립니다.","jazz big-band fusion-jazz");
T("fusion-jazz","퓨전 재즈","Jazz Fusion","ge","재즈의 화성과 즉흥 연주에 록, 펑크의 리듬과 전기 악기를 합친 음악입니다.","일본 게임음악, 특히 레이싱과 격투, 슈팅 게임에 큰 영향을 준 장르입니다. 슬랩 베이스, 신스 리드, 복잡한 코드와 유니즌 리프를 분석해 보세요.","jazz funk prog-rock city-pop bass-guitar");
T("smooth-jazz","스무스 재즈·라운지","Smooth Jazz / Lounge","ge","부드럽고 편안하게 다듬은 재즈 계열의 배경 음악입니다. 국내에서는 흔히 엘리베이터 음악, 카페 음악이라고 부릅니다.","일부러 무난하고 밋밋하게 만들어 대기 화면이나 상점에 씁니다. 웃음을 위한 연출로도 쓰입니다.","jazz bossa menu-music downtempo");
T("gypsy-jazz","집시 재즈","Gypsy Jazz","ge","기타가 박마다 짧게 끊어 치는 반주 위에서 기타와 바이올린이 빠른 선율을 연주하는 유럽의 재즈입니다.","드럼 없이 기타의 반주만으로 스윙을 만듭니다. 파리의 거리, 유랑 극단 분위기에 맞습니다.","jazz swing klezmer acoustic-guitar");
T("ragtime","래그타임","Ragtime","ge","왼손은 베이스와 화음을 번갈아 치고 오른손은 당김음이 많은 선율을 치는 피아노 음악입니다. 1900년 전후에 유행했습니다.","서부 시대의 술집, 무성 영화, 옛 놀이공원 분위기를 냅니다. 조율이 살짝 틀어진 피아노 음색을 쓰면 더 그럴듯합니다.","syncopation jazz western piano");
T("samba","삼바","Samba","ge","브라질의 2박자 춤곡입니다. 여러 타악기가 겹쳐 만드는 촘촘한 리듬이 특징입니다.","카니발, 축제, 스포츠 응원 분위기에 씁니다. 낮은 북과 높은 타악기, 셰이커의 역할을 나눠 겹치세요.","bossa latin hand-percussion salsa");
T("salsa","살사","Salsa","ge","쿠바 음악에 뿌리를 둔 라틴 댄스 음악입니다. 클라베 리듬을 기준으로 피아노의 반복 음형, 브라스, 여러 타악기가 맞물립니다.","피아노가 당김음으로 반복하는 몬투노 패턴이 특징입니다. 모든 악기가 클라베에 맞아야 하니 기준 리듬을 먼저 깔고 작업하세요.","latin samba hand-percussion syncopation");
T("flamenco","플라멩코","Flamenco","ge","스페인 남부의 음악과 춤입니다. 기타를 손가락으로 훑어 치는 주법, 손뼉, 발 구르기, 프리지안 계열의 음계가 특징입니다.","정열, 결투, 스페인풍 캐릭터에 씁니다. iv–III–II–I로 내려가는 진행이 장르의 표시입니다.","phrygian acoustic-guitar tango middle-east");
T("mariachi","마리아치","Mariachi","ge","트럼펫, 바이올린, 여러 종류의 기타로 연주하는 멕시코의 악단 음악입니다.","트럼펫 두 대가 3도로 겹쳐 연주하는 선율이 특징입니다. 멕시코 배경과 축제 장면에 씁니다.","latin trumpet western");
T("classical-era","고전주의풍","Classical Era Style","ge","18세기 후반 하이든, 모차르트 시대의 양식입니다. 균형 잡힌 악구, 명료한 화성, 가벼운 반주 위의 선율이 특징입니다.","우아하고 단정한 분위기에 씁니다. 귀족의 저택, 격식 있는 연회 장면에 어울립니다.","baroque romantic-era phrase chamber");
T("romantic-era","낭만주의풍","Romantic Era Style","ge","19세기 음악의 양식입니다. 큰 편성, 풍부한 반음계 화성, 강한 감정 표현이 특징입니다.","오케스트라 영화음악의 어법은 대부분 여기서 나왔습니다. 후기 낭만 관현악 스코어를 분석하면 영상음악 편곡에 바로 도움이 됩니다.","leitmotif orchestration chromatic classical-era impressionism");
T("impressionism","인상주의풍","Impressionist Style","ge","드뷔시, 라벨로 대표되는 양식입니다. 온음음계와 선법, 같은 모양의 화음을 나란히 옮기는 진행, 음색의 섬세한 변화가 특징입니다.","물, 빛, 꿈, 신비로운 숲을 표현할 때 씁니다. 하프, 플루트, 첼레스타와 약음기를 낀 현악이 잘 어울립니다.","whole-tone mode harp romantic-era pentatonic");
T("gregorian","그레고리오 성가","Gregorian Chant","ge","반주 없이 하나의 선율을 여럿이 함께 부르는 중세 교회의 라틴어 성가입니다. 박자가 자유롭습니다.","수도원, 성당, 고대의 의식을 표현합니다. 긴 잔향과 남성 합창만으로도 분위기가 만들어집니다.","medieval choir mode requiem");
T("requiem","레퀴엠풍·종교 합창","Requiem / Sacred Choral","ge","레퀴엠은 죽은 이를 위한 미사 음악입니다. 라틴어 가사를 쓰는 대편성 합창과 오케스트라의 양식을 가리키는 말로도 씁니다.","최종 보스전, 종말, 신적인 존재의 등장에 씁니다. 옛 성가 '디에스 이레'의 선율은 죽음의 상징으로 여러 작품에서 인용됩니다.","choir epic organ gregorian");
T("opera","오페라·아리아","Opera / Aria","ge","오페라는 노래로 진행하는 극음악이고, 아리아는 그 안에서 인물이 감정을 노래하는 독창곡입니다.","우아함과 광기의 대비를 만드는 연출에 자주 쓰입니다. 성악 발성의 독창은 장면을 단번에 극적으로 만듭니다.","solo-vocal musical romantic-era insert-song");
T("musical","뮤지컬풍","Musical Theatre Style","ge","노래로 이야기를 진행하는 뮤지컬의 어법입니다. 인물의 감정에 따라 곡 안에서 템포와 조가 자주 바뀌고, 대사 같은 선율과 큰 합창이 이어집니다.","애니메이션 주제가와 캐릭터 송에서 요청됩니다. 가사가 이야기를 전달해야 하므로 선율이 말의 억양을 따라야 합니다.","insert-song opera topline modulation");
T("fugue","푸가","Fugue","ge","하나의 주제를 여러 성부가 차례로 모방하며 들어오는 대위법 양식입니다.","지적이고 치밀한 인상을 줍니다. 퍼즐, 시계 장치, 음모가 얽히는 장면에 짧게 써 볼 수 있습니다.","counterpoint baroque organ theme");
T("nocturne","녹턴(야상곡)","Nocturne","ge","밤의 정취를 담은 서정적인 곡입니다. 왼손의 넓은 아르페지오 위에 오른손이 노래하듯 선율을 연주하는 피아노곡이 대표적입니다.","달밤, 고백, 조용한 회상 장면에 씁니다. 루바토를 넣어 연주해야 살아납니다.","piano rubato newage arpeggio");
T("lullaby","자장가·오르골풍","Lullaby / Music Box","ge","단순한 선율과 느린 3박자 또는 6박자의 흔들리는 리듬을 가진 곡입니다. 오르골이나 첼레스타 음색으로 자주 연주합니다.","어린 시절, 안식처, 세이브 지점에 씁니다. 조율을 살짝 틀거나 느려지게 하면 공포 연출로 바뀝니다.","celesta waltz horror kalimba");
T("carol","캐럴·시즌 음악","Carol / Seasonal Music","ge","크리스마스 같은 특정 계절이나 명절을 떠올리게 하는 음악입니다. 썰매 방울, 튜블러 벨, 합창이 대표적인 소리입니다.","라이브 서비스 게임은 시즌 이벤트마다 기존 테마를 편곡한 음악을 요청합니다. 악기 몇 개만 바꿔도 계절감이 납니다.","chimes variation choir arrangement");
T("circus","서커스 음악","Circus Music","ge","빠른 행진곡이나 왈츠를 금관과 증기 오르간으로 연주하는 익살스럽고 소란한 음악입니다.","광대, 놀이공원, 속임수 캐릭터에 씁니다. 반음계로 오르내리는 선율과 '쿵짝' 반주가 특징입니다.","march waltz polka cartoon chromatic");
T("polka","폴카","Polka","ge","빠른 2박자의 춤곡입니다. 베이스와 화음이 번갈아 나오는 '쿵짝' 반주에 아코디언, 클라리넷, 금관이 선율을 맡습니다.","시골 축제, 맥주 축제, 익살스러운 장면에 씁니다.","accordion circus march klezmer");
T("bolero","볼레로","Bolero","ge","스페인의 3박자 춤곡입니다. 라벨의 작품처럼 같은 리듬과 선율을 반복하면서 악기를 더해 길게 고조시키는 구성을 가리키는 말로도 씁니다.","리듬을 고정하고 편성만 키워 가는 방식은 레이어 구조의 게임음악에 그대로 응용할 수 있습니다.","ostinato crescendo vertical snare");
T("tarantella","타란텔라","Tarantella","ge","이탈리아 남부의 빠른 6/8박자 춤곡입니다.","숨 가쁘게 몰아치는 리듬이라 소동, 추격, 이탈리아풍 배경에 씁니다. 만돌린과 탬버린이 잘 어울립니다.","meter polka flamenco");
T("klezmer","클레즈머·발칸풍","Klezmer / Balkan Style","ge","클레즈머는 동유럽 유대인의 전통 음악으로, 흐느끼듯 꺾이는 클라리넷과 바이올린 선율이 특징입니다. 발칸 지역의 음악은 빠른 금관 합주와 홀수 박자를 많이 씁니다.","프리지안 도미넌트 계열의 음계를 씁니다. 유랑 악단, 떠들썩한 결혼식, 동유럽 마을에 어울립니다.","phrygian odd-meter clarinet gypsy-jazz polka");
T("nordic","북유럽풍(바이킹풍)","Nordic Folk Style","ge","북유럽의 옛 음악을 바탕으로 한 양식입니다. 활로 긋는 옛 현악기, 큰 틀북, 낮게 울리는 창법, 지속 저음이 특징입니다.","화음을 거의 바꾸지 않고 지속음과 타악기, 목소리로 끌고 갑니다. 설원, 항해, 신화를 다루는 게임에서 많이 쓰입니다.","drone lute medieval solo-vocal");
T("african","아프리카풍","African Style","ge","사하라 이남 아프리카의 전통 음악을 바탕으로 한 양식입니다. 여러 리듬이 겹치는 타악 합주, 선창과 합창이 주고받는 노래가 특징입니다.","지역마다 음악이 크게 다릅니다. 젬베 같은 북, 나무 건반 악기, 뜯는 현악기 가운데 어느 지역의 악기인지 확인하고 쓰세요.","polyrhythm hand-percussion afrobeats world");
T("indian","인도풍","Indian Classical Style","ge","인도 전통 음악을 바탕으로 한 양식입니다. 라가라는 선율 체계와 탈라라는 리듬 주기를 따르고, 지속음 위에서 선율을 길게 풀어 갑니다.","화음을 바꾸지 않는 음악입니다. 지속음을 깔고 시타르나 목소리의 선율, 타블라의 리듬으로 구성하세요.","sitar-tabla drone world middle-east");
T("hawaiian","하와이안","Hawaiian Style","ge","우쿨렐레와 스틸 기타를 중심으로 한 하와이의 음악입니다.","스틸 기타가 음 사이를 미끄러지는 소리만으로 휴양지 분위기가 납니다. 섬 마을, 여름 이벤트에 씁니다.","portamento reggae deep-house folk");
T("andean","안데스풍","Andean Style","ge","남미 안데스 지역의 전통 음악을 바탕으로 한 양식입니다. 팬플루트, 세로 피리, 작은 현악기 차랑고를 씁니다.","숨소리가 섞인 팬플루트 선율과 5음 음계가 특징입니다. 고산 지대, 고대 문명 유적에 어울립니다.","pentatonic world latin flute");
T("enka","엔카","Enka","ge","일본의 전통적인 정서를 담은 성인 가요입니다. 4음과 7음을 뺀 5음 음계와 음을 꺾어 떠는 창법이 특징입니다.","일본 배경의 술집, 옛 시대의 향수를 표현할 때 씁니다. 국내의 트로트와 어법이 닮은 부분이 있습니다.","trot wafu pentatonic sigimsae");
T("vocaloid","보컬로이드 음악","Vocaloid Music","ge","음성 합성 소프트웨어가 부르는 노래를 중심으로 한 음악입니다. 사람이 부르기 어려운 빠른 선율과 넓은 음역을 자주 씁니다.","서브컬처 게임과 리듬 게임 수록곡에서 익숙한 어법입니다. 빠른 템포와 잦은 전조, 촘촘한 가사가 특징입니다.","jpop artcore royal-road topline");
T("healing","힐링 음악·명상 음악","Healing / Meditation Music","ge","긴장을 풀기 위한 느리고 조용한 음악을 국내에서 부르는 말입니다. 긴 지속음, 자연의 소리, 피아노나 핸드팬 같은 부드러운 음색을 씁니다.","힐링 게임과 수면, 명상 앱에서 요청됩니다. 갑작스러운 변화와 뚜렷한 리듬을 피하세요.","newage ambient-music downtempo kalimba drone");
T("acappella","아카펠라","A Cappella","ge","악기 반주 없이 목소리만으로 연주하는 음악입니다.","입으로 타악기 소리를 내는 비트박스와 함께 쓰기도 합니다. 목소리만 쓴 테마곡은 개성이 뚜렷해 기억에 남습니다.","choir doo-wop gospel voice-leading");

/* ───── 국악 ───── */
T("jangdan","장단","Jangdan (Rhythmic Cycle)","ko","국악에서 일정한 길이의 리듬 틀이 되풀이되는 것을 말합니다. 빠르기, 박의 묶음, 강세의 위치가 장단마다 정해져 있습니다. 장구로 연주하며 덩, 쿵, 덕 같은 입소리(구음)로 외웁니다.","서양 음악의 박자표와 달리 장단에는 빠르기와 분위기까지 포함됩니다. 국악풍 곡을 쓸 때는 장단부터 정하고 선율을 얹으세요.","janggu gutgeori jajinmori semachi jungmori");
T("jinyangjo","진양조","Jinyangjo","ko","가장 느린 장단입니다. 여섯 박이 한 묶음을 이루고, 이 묶음 넷이 모여 한 장단이 됩니다.","산조와 판소리의 느리고 슬픈 대목에 씁니다. 아주 느리기 때문에 음을 끌면서 떨고 꺾는 시김새가 음악의 중심이 됩니다.","jangdan sanjo pansori sigimsae jungmori");
T("jungmori","중모리","Jungmori","ko","보통 빠르기의 12박 장단입니다.","차분하게 이야기를 풀어 가는 대목에 쓰입니다. 9번째 박에 강세가 오는 것이 특징입니다.","jangdan jinyangjo jungjungmori pansori");
T("jungjungmori","중중모리","Jungjungmori","ko","중모리보다 빠른 장단입니다. 세 개로 나뉘는 박 네 개로 이루어져 8분의 12박자로 적습니다.","흥겹고 춤추는 듯한 느낌이 납니다. 굿거리와 박자 구조가 같아서 헷갈리기 쉬운데, 쓰이는 음악과 강세가 다릅니다.","jangdan jungmori gutgeori jajinmori");
T("jajinmori","자진모리","Jajinmori","ko","빠른 장단입니다. 세 개로 나뉘는 박 네 개로 이루어지며 구음은 '덩 덩 덩덕 쿵덕'입니다.","긴박한 장면과 신나는 장면에 모두 쓰입니다. 국악풍 전투 음악의 바탕 리듬으로 가장 먼저 떠올릴 수 있는 장단입니다.","jangdan hwimori jungjungmori samulnori battle-music");
T("hwimori","휘모리","Hwimori","ko","매우 빠른 장단입니다. 둘로 나뉘는 박 네 개로 이루어져 4분의 4박자로 적습니다.","몰아치는 절정 대목에 씁니다. 4/4박자라서 록이나 전자음악의 드럼과 섞기가 쉽습니다.","jangdan jajinmori samulnori");
T("gutgeori","굿거리","Gutgeori","ko","8분의 12박자로 적는 흥겨운 장단입니다. 구음은 '덩 기덕 쿵 더러러러 쿵 기덕 쿵 더러러러'입니다. 민요와 춤 반주에 많이 쓰입니다.","어깨가 들썩이는 여유 있는 흥이 특징입니다. 장터, 잔치, 평화로운 마을 음악에 어울립니다.","jangdan jungjungmori semachi minyo");
T("semachi","세마치","Semachi","ko","세 개로 나뉘는 박 세 개로 이루어진 장단입니다. 8분의 9박자로 적으며 구음은 '덩 덩 덕쿵덕'입니다. 아리랑, 도라지타령이 이 장단입니다.","서양의 3박자와 비슷하게 들리지만 한 박이 셋으로 나뉘는 점이 다릅니다. 민요풍 선율을 쓸 때 기본이 됩니다.","jangdan gutgeori minyo");
T("eotmori","엇모리","Eotmori","ko","3박과 2박이 섞인 10박 장단입니다. 3+2+3+2로 묶입니다.","절뚝이는 듯한 독특한 리듬이라 신비롭거나 범상치 않은 인물이 등장하는 대목에 쓰입니다. 변박을 쓰는 게임음악에 응용하기 좋습니다.","jangdan odd-meter");
T("sigimsae","시김새","Sigimsae (Ornamentation)","ko","국악에서 음을 꾸미는 표현을 통틀어 부르는 말입니다. 음을 떠는 것, 꺾어 내리는 것, 밀어 올리는 것, 흘러내리는 것 등이 있습니다.","국악다운 느낌은 음계보다 시김새에서 나옵니다. 가상악기로 만들 때는 피치 벤드와 전용 주법 샘플로 음과 음 사이의 움직임을 만들어 주세요.","nonghyeon pitch-bend vibrato portamento pyeongjo");
T("nonghyeon","농현","Nonghyeon","ko","현악기에서 줄을 누른 손을 흔들거나 밀고 당겨서 음을 떨고 꾸미는 주법입니다. 가야금, 거문고, 해금, 아쟁에서 씁니다.","서양 악기의 비브라토보다 폭이 넓고 느리며, 음마다 떠는 정도가 다릅니다. 모든 음에 똑같이 넣으면 국악처럼 들리지 않습니다.","sigimsae gayageum geomungo vibrato");
T("pyeongjo","평조와 계면조","Pyeongjo / Gyemyeonjo","ko","국악의 대표적인 두 가지 음계와 분위기입니다. 평조는 밝고 화평한 느낌을, 계면조는 슬프고 애절한 느낌을 줍니다.","서양의 장조와 단조에 견주어 설명하기도 하지만 구성음과 시김새가 다릅니다. 계면조는 떠는 음, 꺾는 음의 위치가 정해져 있습니다.","sigimsae major-minor pentatonic minyo");
T("yulmyeong","율명","Yulmyeong (Pitch Names)","ko","국악에서 쓰는 12개 음의 이름입니다. 황종, 대려, 태주, 협종, 고선, 중려, 유빈, 임종, 이칙, 남려, 무역, 응종이며 첫 글자만 따서 부릅니다.","5음 음계로는 황·태·중·임·남을 주로 씁니다. 황종의 실제 음높이는 음악의 종류에 따라 다르니 국악 연주자와 작업할 때 기준음을 확인하세요.","jeongganbo pentatonic pyeongjo");
T("jeongganbo","정간보","Jeongganbo","ko","네모 칸에 율명을 적어 음의 높이와 길이를 함께 나타내는 악보입니다. 조선 세종 때 만들어졌습니다.","국악 연주자에게 곡을 의뢰할 때 오선보로 줘도 대부분 연주할 수 있습니다. 다만 시김새는 악보에 다 적기 어려우니 가이드 음원을 함께 전달하세요.","yulmyeong score session");
T("jeongak","정악과 민속악","Jeongak / Minsogak","ko","정악은 궁중과 선비 계층이 즐기던 음악이고, 민속악은 민간에서 전해 온 음악입니다. 정악은 느리고 절제되어 있으며, 민속악은 감정 표현이 짙습니다.","궁궐과 제례 장면에는 정악, 장터와 서민의 삶에는 민속악의 어법이 맞습니다. 사극 음악에서 배경에 맞게 구분해서 쓰세요.","sanjo pansori minyo daegeum");
T("sanjo","산조","Sanjo","ko","장구 반주에 맞춰 한 악기가 연주하는 민속 기악 독주곡입니다. 진양조처럼 느린 장단에서 시작해 점점 빠른 장단으로 넘어갑니다.","가야금 산조, 대금 산조처럼 악기 이름을 붙여 부릅니다. 악기마다 가능한 표현을 모두 담고 있어서 그 악기를 공부할 때 가장 좋은 자료입니다.","jinyangjo jajinmori gayageum janggu sinawi");
T("pansori","판소리","Pansori","ko","소리꾼 한 사람이 고수의 북 반주에 맞춰 긴 이야기를 노래와 말, 몸짓으로 풀어내는 음악입니다. 노래를 소리, 말을 아니리, 몸짓을 발림이라고 합니다.","거칠고 힘 있는 발성이 특징입니다. 판소리풍 보컬은 최근 게임과 광고 음악에서 자주 쓰입니다.","chuimsae buk jungmori jinyangjo solo-vocal");
T("chuimsae","추임새","Chuimsae","ko","연주 중에 고수나 청중이 '얼쑤', '좋다', '잘한다' 하고 넣는 소리입니다.","녹음한 추임새를 전투곡이나 축제 음악에 넣으면 현장감이 생깁니다. 박의 어느 위치에 넣느냐에 따라 흥이 달라집니다.","pansori samulnori");
T("minyo","민요와 토리","Minyo / Tori","ko","민요는 민간에서 불려 온 노래입니다. 토리는 지역마다 다른 음계와 시김새의 특징을 말하며 경토리, 메나리토리, 육자배기토리, 수심가토리 등이 있습니다.","같은 한국풍이라도 지역 설정에 따라 선율의 색이 달라질 수 있습니다. 경기 민요는 맑고 경쾌하고, 남도 민요는 굵게 떨고 꺾는 소리가 짙습니다.","semachi gutgeori pyeongjo sigimsae");
T("samulnori","사물놀이","Samulnori","ko","꽹과리, 징, 장구, 북 네 가지 타악기로 연주하는 음악입니다. 풍물놀이를 무대 연주용으로 다듬어 1978년에 처음 선보였습니다.","네 악기가 고음과 저음, 금속과 가죽으로 나뉘어 역할이 분명합니다. 국악풍 전투 음악의 타악기 구성으로 그대로 가져다 쓸 수 있습니다.","kkwaenggwari jing janggu buk jajinmori hwimori");
T("sinawi","시나위","Sinawi","ko","굿 음악에 뿌리를 둔 즉흥 합주입니다. 여러 악기가 같은 장단 위에서 서로 다른 선율을 자유롭게 연주합니다.","악기들이 어긋나면서도 어울리는 소리가 특징입니다. 무속, 저승, 요괴 같은 소재에 어울립니다.","sanjo jangdan haegeum piri");
T("fusion-gugak","퓨전 국악","Fusion Gugak","ko","국악기와 국악의 어법을 서양 악기, 대중음악, 전자음악과 섞은 음악입니다.","게임과 영상에서 요구하는 한국풍 음악은 대부분 퓨전 국악입니다. 화음은 서양 악기가 맡고, 선율과 장식은 국악기가 맡는 구성이 기본입니다. 국악기의 조율이 서양 악기와 미세하게 다를 수 있으니 리얼 녹음 때 기준음을 맞추세요.","oriental gayageum haegeum daegeum session hybrid-orchestra");
T("gayageum","가야금","Gayageum","ko","명주실을 꼰 줄을 손가락으로 뜯고 튕겨 연주하는 현악기입니다. 전통 가야금은 12줄이고, 개량한 25현 가야금은 7음 음계로 조율해 화음과 서양식 선율을 연주할 수 있습니다.","퓨전 국악에서는 25현 가야금을 많이 씁니다. 12현의 농현이 짙은 소리와 25현의 하프 같은 소리는 전혀 다르니 어느 쪽인지 정하고 쓰세요.","nonghyeon sanjo geomungo guzheng koto fusion-gugak");
T("geomungo","거문고","Geomungo","ko","줄 여섯 개를 술대라는 막대로 내리치거나 뜯어 연주하는 현악기입니다. 낮고 묵직한 소리가 납니다.","술대가 줄과 판을 함께 때리는 타격음이 특징입니다. 저음역에서 리듬을 맡기면 베이스와 타악기 역할을 함께 합니다.","gayageum nonghyeon jeongak");
T("haegeum","해금","Haegeum","ko","줄 두 개 사이에 활을 끼워 문질러 소리 내는 현악기입니다. 코가 막힌 듯한 독특하고 애절한 음색입니다.","사극과 한국풍 게임에서 선율을 가장 자주 맡는 악기입니다. 음과 음 사이를 미끄러지듯 잇기 때문에 미디로 표현하기 어려워 리얼 녹음을 많이 합니다.","erhu sigimsae nonghyeon fusion-gugak session");
T("ajaeng","아쟁","Ajaeng","ko","줄을 활로 문질러 소리 내는 저음 현악기입니다. 거칠고 굵은 음색입니다.","낮게 흐느끼는 듯한 소리라 비극적인 장면에 어울립니다. 첼로와 같은 음역에서 겹치면 서로 묻히니 한쪽만 쓰세요.","haegeum nonghyeon sinawi cello");
T("daegeum","대금","Daegeum","ko","대나무로 만든 가로로 부는 관악기입니다. 갈대 속의 얇은 막을 붙인 구멍(청공)이 있어서 세게 불면 막이 떨리는 독특한 소리가 납니다.","낮은 음역은 부드럽고 높은 음역은 날카롭게 갈라집니다. 달밤, 산, 고요한 장면의 독주에 자주 쓰입니다.","sogeum flute shakuhachi sanjo jeongak");
T("sogeum","소금·단소","Sogeum / Danso","ko","소금은 가로로 부는 작은 관악기로 맑고 높은 소리가 납니다. 단소는 세로로 부는 작은 관악기로 음색이 곱고 부드럽습니다.","소금은 합주의 가장 높은 음역에서 선율을 장식합니다. 밝고 경쾌한 한국풍 곡에 쓰기 좋습니다.","daegeum piccolo tin-whistle");
T("piri","피리","Piri","ko","대나무 관에 겹서(겹리드)를 꽂아 부는 세로 관악기입니다. 크기는 작지만 음량이 크고 음색이 진합니다.","합주에서 주선율을 맡는 악기입니다. 향피리, 세피리, 당피리 세 종류가 있습니다.","taepyeongso oboe duduk sinawi");
T("taepyeongso","태평소","Taepyeongso","ko","겹서를 꽂아 부는 관악기로, 끝에 나팔 모양의 금속 관이 달려 있습니다. 음량이 매우 크고 음색이 날카롭습니다. 호적, 날라리라고도 부릅니다.","풍물과 행진 음악에서 선율을 맡습니다. 록 밴드나 대편성 타악기 위에서도 묻히지 않아서 한국풍 전투곡에 자주 씁니다.","piri samulnori battle-music");
T("saenghwang","생황","Saenghwang","ko","여러 개의 대나무 관을 통에 꽂아 만든 관악기입니다. 국악기 가운데 드물게 여러 음을 동시에 낼 수 있습니다.","하모니카나 작은 오르간과 비슷한 맑은 화음이 납니다. 신비로운 분위기의 패드 대신 써 볼 수 있습니다.","pad accordion fusion-gugak");
T("janggu","장구","Janggu","ko","허리가 잘록한 통의 양쪽에 가죽을 댄 타악기입니다. 왼쪽 북편은 낮은 소리, 오른쪽 채편은 높은 소리가 납니다. 장고라고도 합니다.","거의 모든 국악에서 장단을 연주하는 악기입니다. 구음의 덩은 양쪽을 함께, 쿵은 북편, 덕은 채편을 치는 소리입니다.","jangdan samulnori buk sanjo");
T("buk","북","Buk","ko","나무 통에 가죽을 댄 타악기입니다. 판소리 반주에 쓰는 소리북과 풍물에 쓰는 풍물북이 있습니다.","낮고 묵직한 한 방을 맡습니다. 대형 북을 여럿 겹친 소리는 한국풍 에픽 타악기의 기본 재료입니다.","janggu samulnori pansori taiko bass-drum");
T("kkwaenggwari","꽹과리","Kkwaenggwari","ko","놋쇠로 만든 작은 타악기입니다. 높고 날카로운 소리가 납니다. 풍물과 사물놀이에서 꽹과리를 치는 상쇠가 합주를 이끕니다.","음량과 고음이 매우 강해서 믹스에서 다른 악기를 가리기 쉽습니다. 리듬의 핵심 부분에만 쓰거나 음량을 충분히 낮추세요.","samulnori jing jajinmori masking");
T("jing","징","Jing","ko","놋쇠로 만든 큰 타악기입니다. 채로 치면 낮고 긴 울림이 납니다.","장단의 첫 박을 짚어 주는 역할을 합니다. 장면의 시작이나 전환을 알리는 한 번의 타격으로도 효과가 큽니다.","samulnori kkwaenggwari cymbals");

/* ───── 악기 ───── */
T("violin","바이올린","Violin","in","현악기군에서 가장 높은 음역을 맡는 악기입니다. 줄 네 개를 솔-레-라-미로 조율하며 가장 낮은 음은 가온 도 아래의 솔입니다. 오케스트라에서는 제1바이올린과 제2바이올린으로 나뉩니다.","제1바이올린은 주로 선율을, 제2바이올린은 화성과 리듬을 맡습니다. 민속 음악에서 쓰일 때는 피들이라고 부릅니다.","viola cello sections legato celtic");
T("viola","비올라","Viola","in","바이올린보다 완전5도 낮게 조율하는 현악기입니다. 악보는 가온음자리표로 적습니다. 바이올린보다 어둡고 따뜻한 음색입니다.","화음의 가운데 음을 채우는 역할을 주로 합니다. 비올라 독주는 쓸쓸하고 내성적인 선율에 잘 맞습니다.","violin cello voicing sections");
T("cello","첼로","Cello","in","비올라보다 한 옥타브 낮게 조율하는 현악기입니다. 가장 낮은 음은 가온 도에서 두 옥타브 아래의 도입니다. 사람 목소리와 가까운 음역이라 선율 악기로도 많이 씁니다.","높은 음역의 첼로 선율은 감정이 짙게 실립니다. 저음에서는 콘트라베이스와 옥타브로 겹쳐 베이스를 맡습니다.","viola contrabass doubling sections");
T("contrabass","콘트라베이스","Contrabass / Double Bass","in","현악기군의 최저음을 맡는 악기입니다. 악보에 적힌 음보다 한 옥타브 낮게 소리 납니다. 더블베이스라고도 하고, 재즈에서는 손가락으로 뜯어 연주합니다.","첼로와 같은 음을 적으면 자동으로 옥타브 겹침이 됩니다. 아주 낮은 음역에서 빠른 음형은 뭉개지니 단순하게 쓰세요.","cello transposing jazz bass-guitar");
T("flute","플루트","Flute","in","리드 없이 관 옆의 구멍에 입김을 불어 소리 내는 목관악기입니다. 가장 낮은 음은 가온 도이고 세 옥타브 정도를 냅니다.","낮은 음역은 음량이 작아서 다른 악기에 쉽게 묻힙니다. 선율을 맡길 때는 반주를 얇게 하거나 높은 음역에 두세요.","piccolo oboe daegeum sections");
T("piccolo","피콜로","Piccolo","in","플루트의 절반 크기인 목관악기입니다. 악보에 적힌 음보다 한 옥타브 높게 소리 납니다. 오케스트라에서 가장 높은 음을 냅니다.","투티의 맨 위에서 선율을 한 옥타브 위로 겹치면 전체 소리가 밝아집니다. 음량이 날카로우니 오래 쓰지 마세요.","flute doubling tutti sogeum");
T("oboe","오보에","Oboe","in","리드 두 장을 맞댄 겹리드를 쓰는 목관악기입니다. 콧소리가 섞인 또렷한 음색이라 작은 음량으로도 잘 들립니다.","전원적이고 애수 어린 독주 선율에 자주 씁니다. 오케스트라가 조율할 때 기준이 되는 라 음을 오보에가 붑니다.","english-horn bassoon piri duduk");
T("english-horn","잉글리시 호른","English Horn (Cor Anglais)","in","오보에보다 완전5도 낮은 겹리드 목관악기입니다. 오보에보다 어둡고 깊은 음색입니다.","고독, 회상, 이국적인 풍경을 표현하는 독주에 씁니다. 이조 악기라 파트보는 실제 음보다 완전5도 높게 적습니다.","oboe transposing duduk");
T("clarinet","클라리넷","Clarinet","in","리드 한 장을 쓰는 목관악기입니다. 음역이 넓고 아주 작은 소리부터 큰 소리까지 고르게 냅니다. B♭ 클라리넷은 적힌 음보다 장2도 낮게 소리 납니다.","낮은 음역은 어둡고 부드러우며 높은 음역은 밝고 날카롭습니다. 여린 음으로 시작하는 선율을 맡기기에 좋습니다.","bass-clarinet transposing saxophone sections");
T("bass-clarinet","베이스 클라리넷","Bass Clarinet","in","클라리넷보다 한 옥타브 낮은 목관악기입니다. 어둡고 속이 빈 듯한 음색입니다.","수상한 인물, 잠입, 어두운 숲 같은 장면에서 독주로 자주 쓰입니다.","clarinet bassoon stealth");
T("bassoon","바순","Bassoon","in","목관악기군의 저음을 맡는 겹리드 악기입니다. 파곳이라고도 부릅니다.","짧게 끊어 연주하면 익살스럽고, 길게 이으면 쓸쓸합니다. 카툰풍 음악에서 뚱뚱하거나 엉뚱한 캐릭터에 자주 씁니다.","oboe bass-clarinet cartoon sections");
T("horn","호른","French Horn","in","둥글게 감긴 관을 가진 금관악기입니다. 부드러운 소리부터 웅장한 소리까지 폭이 넓어서 금관과 목관, 현악을 잘 이어 줍니다. F조 악기이며 오케스트라에서 보통 넷이 함께 연주합니다.","영웅 테마의 선율을 가장 자주 맡는 악기입니다. 여럿이 유니즌으로 연주하는 패치와 독주 패치의 소리가 크게 다르니 구분해서 쓰세요.","trumpet trombone transposing unison epic");
T("trumpet","트럼펫","Trumpet","in","금관악기군에서 가장 높은 음역을 맡는 악기입니다. 밝고 곧게 뻗는 소리가 납니다.","팡파르, 군대, 승리 장면에 씁니다. 약음기를 끼우면 재즈나 누아르풍의 가늘고 매캐한 소리로 바뀝니다.","horn trombone fanfare con-sordino noir march");
T("trombone","트롬본","Trombone","in","슬라이드를 밀고 당겨 음높이를 바꾸는 금관악기입니다. 테너 트롬본과 베이스 트롬본이 있습니다.","낮은 음역에서 세게 연주하면 위협적인 소리가 납니다. 슬라이드로 음을 미끄러뜨리는 글리산도는 이 악기의 특기입니다.","horn tuba glissando braam");
T("tuba","튜바","Tuba","in","금관악기군의 최저음을 맡는 악기입니다. 둥글고 넓은 저음이 납니다.","베이스 트롬본이나 콘트라베이스와 옥타브로 겹쳐 저음을 받칩니다. 숨이 많이 드는 악기라 긴 음을 끝없이 이어 쓰지 마세요.","trombone contrabass phrase");
T("timpani","팀파니","Timpani","in","음높이를 조율할 수 있는 큰 북입니다. 보통 넷을 한 사람이 연주하고 페달로 음을 바꿉니다.","화음의 근음이나 5음에 맞춰 쓰는 것이 기본입니다. 롤(빠르게 연타하는 주법)로 크레셴도를 만들면 고조되는 구간을 쉽게 끌어올릴 수 있습니다.","percussion bass-drum crescendo");
T("snare","스네어 드럼","Snare Drum","in","아랫면에 쇠줄을 댄 작은 북입니다. 짧고 바삭한 소리가 납니다. 작은북이라고도 합니다.","오케스트라에서는 행진 리듬과 긴장감 있는 롤을 맡고, 드럼 세트에서는 2박과 4박을 짚습니다.","march drum-set percussion");
T("bass-drum","베이스 드럼","Bass Drum (Gran Cassa)","in","오케스트라에서 가장 낮고 큰 북입니다. 큰북, 그란 카사라고도 부릅니다. 드럼 세트의 베이스 드럼은 킥이라고 부릅니다.","한 번의 타격으로 장면에 무게를 싣습니다. 잔향이 길어서 빠른 연타는 뭉개집니다.","timpani taiko buk drum-set");
T("cymbals","심벌즈·탐탐","Cymbals / Tam-tam","in","심벌즈는 금속 원판 두 장을 마주 쳐서 소리 내는 타악기입니다. 한 장을 매달아 채로 치는 것은 서스펜디드 심벌이라고 합니다. 탐탐은 음높이가 정해지지 않은 큰 징입니다.","서스펜디드 심벌을 롤로 키우는 소리는 오케스트라에서 가장 흔한 고조 장치입니다. 클라이맥스 직전에 쓰세요.","jing riser crescendo percussion");
T("mallets","건반 타악기","Mallet Percussion","in","음높이 순으로 놓인 판을 채로 쳐서 연주하는 타악기입니다. 나무판의 실로폰과 마림바, 금속판의 글로켄슈필과 비브라폰이 있습니다.","실로폰은 짧고 딱딱해서 익살스러운 음형에, 마림바는 따뜻해서 반복 음형에, 글로켄슈필은 맑게 반짝이는 장식에, 비브라폰은 재즈와 몽환적인 장면에 씁니다.","celesta percussion cartoon minimalism");
T("celesta","첼레스타","Celesta","in","건반을 누르면 해머가 금속판을 쳐서 종소리 같은 음을 내는 악기입니다. 악보에 적힌 음보다 한 옥타브 높게 소리 납니다.","마법, 동화, 눈 내리는 장면에 표준처럼 쓰입니다. 오르골과 비슷한 느낌을 낼 때도 씁니다.","mallets waltz harp");
T("piano","피아노","Piano","in","건반을 누르면 해머가 줄을 쳐서 소리 내는 악기입니다. 건반은 88개이고 오케스트라 전체에 가까운 음역을 냅니다.","혼자서 선율과 화음, 베이스를 모두 맡을 수 있습니다. 해머에 펠트를 덧대어 부드럽게 만든 펠트 피아노 소리는 조용한 드라마 음악에서 많이 씁니다.","newage neoclassical prepared-piano sketch");
T("organ","파이프 오르간","Pipe Organ","in","건반을 누르면 여러 길이의 관에 바람이 들어가 소리 나는 악기입니다. 음이 줄어들지 않고 계속 이어지며 관의 조합으로 음색을 바꿉니다.","성당, 신, 죽음, 흡혈귀 같은 소재에 씁니다. 고딕풍 보스전 음악의 대표 악기입니다.","harpsichord baroque choir");
T("harpsichord","하프시코드","Harpsichord","in","건반을 누르면 작은 채가 줄을 뜯어 소리 내는 옛 건반악기입니다. 쳄발로라고도 부릅니다. 건반을 누르는 세기로 음량을 바꿀 수 없습니다.","이 악기 소리만으로도 바로크와 귀족 사회의 분위기가 납니다. 벨로시티를 바꿔도 음량이 달라지지 않는 것이 실제 악기에 맞는 표현입니다.","baroque organ trill");
T("acoustic-guitar","어쿠스틱 기타","Acoustic Guitar","in","울림통으로 소리를 키우는 기타입니다. 쇠줄을 쓰는 통기타와 나일론 줄을 쓰는 클래식 기타가 있습니다. 악보에 적힌 음보다 한 옥타브 낮게 소리 납니다.","코드를 긁는 스트럼과 줄을 하나씩 뜯는 아르페지오가 기본 주법입니다. 미디로 찍으면 어색해지기 쉬운 악기라 리얼 녹음을 많이 합니다.","folk bossa electric-guitar session arpeggio");
T("electric-guitar","일렉트릭 기타","Electric Guitar","in","줄의 진동을 픽업으로 전기 신호로 바꿔 앰프로 소리 내는 기타입니다. 앰프와 이펙터에 따라 맑은 소리부터 강하게 일그러진 소리까지 냅니다.","손바닥으로 줄을 살짝 눌러 짧게 끊는 팜 뮤트 리프는 액션 음악에서 현악 오스티나토와 같은 역할을 합니다.","rock metal power-chord saturation session");
T("bass-guitar","베이스 기타","Bass Guitar","in","밴드에서 저음을 맡는 줄 네 개짜리 전기 악기입니다. 기타의 낮은 네 줄보다 한 옥타브 낮게 조율합니다.","킥 드럼과 타이밍이 맞아야 리듬이 단단해집니다. 엄지로 줄을 때리는 슬랩 주법은 펑크와 시티팝의 특징입니다.","contrabass rhythm-section funk groove");
T("drum-set","드럼 세트","Drum Set","in","킥, 스네어, 하이햇, 탐, 심벌을 한 사람이 연주하도록 묶은 악기입니다.","실제 드러머는 손이 둘, 발이 둘입니다. 하이햇과 크래시와 탐을 동시에 치는 식의 불가능한 패턴을 찍지 않도록 주의하세요.","snare bass-drum rhythm-section groove fill");
T("tr808","808","Roland TR-808","in","1980년에 나온 롤랜드의 드럼 머신입니다. 지금은 주로 이 기계의 킥에서 나온 길고 낮은 베이스 소리를 808이라고 부릅니다.","음높이를 가진 베이스로 쓰기 때문에 곡의 조에 맞춰 조율해야 합니다. 작은 스피커에서는 거의 들리지 않으니 새츄레이션으로 배음을 더해 주세요.","trap hiphop saturation dnb");
T("saxophone","색소폰","Saxophone","in","금속으로 만들었지만 리드 한 장으로 소리 내는 목관악기입니다. 소프라노, 알토, 테너, 바리톤이 주로 쓰입니다.","재즈, 누아르, 시티팝에서 독주를 맡습니다. 가상악기로 표현하기 어려운 악기 가운데 하나입니다.","jazz noir big-band clarinet session");
T("accordion","아코디언·반도네온","Accordion / Bandoneon","in","주름상자를 밀고 당겨 리드를 울리는 악기입니다. 반도네온은 양쪽에 단추가 달린 악기로 탱고의 대표 악기입니다.","아코디언은 유럽의 거리, 항구, 시장 분위기를 냅니다. 주름상자를 여닫는 세기가 음량이 되므로 CC로 숨결을 그려 주세요.","tango saenghwang expression-cc");
T("tin-whistle","틴 휘슬","Tin Whistle","in","금속 관에 구멍 여섯 개를 뚫은 작은 세로 피리입니다. 아일랜드 전통 음악에서 씁니다. 더 낮은 음역의 로 휘슬도 있습니다.","켈틱풍 선율을 맡는 대표 악기입니다. 손가락으로 음을 튕기듯 넣는 장식음이 들어가야 제맛이 납니다.","celtic bagpipe sogeum flute");
T("bagpipe","백파이프·일리언 파이프","Bagpipes / Uilleann Pipes","in","공기 주머니에 모은 바람으로 리드를 울리는 관악기입니다. 선율과 함께 지속 저음이 계속 울립니다. 스코틀랜드의 하이랜드 백파이프는 크고 날카로우며, 아일랜드의 일리언 파이프는 더 부드럽습니다.","음량 조절과 쉼이 어려운 악기입니다. 지속 저음의 음높이가 정해져 있어서 곡의 조를 악기에 맞춰야 합니다.","celtic drone tin-whistle");
T("lute","류트·허디거디","Lute / Hurdy-gurdy","in","류트는 배 모양의 울림통을 가진 옛 뜯는 현악기입니다. 허디거디는 손잡이를 돌려 바퀴로 줄을 문지르는 악기로 지속 저음이 함께 울립니다.","중세풍 주점과 음유시인 음악의 기본 악기입니다. 허디거디의 거친 지속음은 북유럽풍 음악에도 자주 쓰입니다.","medieval drone acoustic-guitar");
T("duduk","두둑","Duduk","in","아르메니아의 겹리드 목관악기입니다. 사람이 흐느끼는 듯한 어둡고 부드러운 음색입니다.","영화음악에서 고대, 사막, 상실을 표현하는 독주 악기로 널리 쓰입니다. 음과 음 사이를 미끄러지듯 잇는 연주가 특징입니다.","world middle-east piri english-horn");
T("oud","우드·다르부카","Oud / Darbuka","in","우드는 중동의 뜯는 현악기로 지판에 프렛이 없습니다. 다르부카는 잔 모양의 손북입니다.","중동풍 음악의 선율과 리듬을 맡는 기본 조합입니다. 다르부카는 가운데의 낮은 소리와 가장자리의 높은 소리로 리듬을 만듭니다.","middle-east lute hand-percussion");
T("erhu","얼후","Erhu","in","줄 두 개 사이에 활을 끼워 연주하는 중국의 현악기입니다. 이호라고도 부릅니다.","해금과 구조가 비슷하지만 음색이 더 매끄럽고 연주 어법이 다릅니다. 한국풍 음악에 얼후를 쓰지 않도록 구분하세요.","wuxia haegeum guzheng oriental");
T("guzheng","고쟁·비파","Guzheng / Pipa","in","고쟁은 줄 21개 안팎을 뜯어 연주하는 중국의 현악기입니다. 비파는 세워 안고 연주하는 배 모양의 뜯는 현악기입니다.","고쟁은 줄을 훑는 글리산도와 음을 누르며 떠는 표현이, 비파는 빠른 트레몰로가 특징입니다.","wuxia gayageum koto erhu");
T("shakuhachi","샤쿠하치","Shakuhachi","in","대나무로 만든 일본의 세로 피리입니다. 숨소리가 많이 섞인 거친 음색이 특징입니다.","음을 세게 불어 터뜨리는 주법과 긴 여백이 어법의 중심입니다. 사무라이, 닌자 소재에 자주 쓰입니다.","wafu daegeum koto");
T("koto","고토","Koto","in","줄 13개를 손가락에 낀 깍지로 뜯어 연주하는 일본의 현악기입니다.","가야금, 고쟁과 생김새는 비슷하지만 조율하는 음계와 음색이 다릅니다. 맑고 딱딱한 소리가 납니다.","wafu gayageum guzheng shamisen");
T("shamisen","샤미센","Shamisen","in","줄 세 개를 큰 채로 내리쳐 연주하는 일본의 현악기입니다. 채가 가죽을 때리는 타격음이 함께 납니다.","빠르고 격렬하게 연주하는 쓰가루 샤미센은 록과 섞은 전투 음악에 자주 쓰입니다.","wafu koto taiko geomungo");
T("taiko","타이코","Taiko","in","일본의 북을 통틀어 부르는 말입니다. 여러 크기의 북을 여럿이 함께 치는 합주가 유명합니다.","에픽 음악과 트레일러 음악의 대형 타악기 라이브러리는 타이코를 바탕으로 한 것이 많습니다. 한국풍 음악이라면 국악의 북으로 바꿔 쓰는 것을 검토하세요.","wafu epic buk bass-drum percussion");
T("sitar-tabla","시타르·타블라","Sitar / Tabla","in","시타르는 인도의 뜯는 현악기로, 연주하는 줄 아래에 함께 울리는 공명 줄이 있어 독특한 떨림이 납니다. 타블라는 크기가 다른 북 두 개를 손으로 치는 인도의 타악기입니다.","인도풍 음악의 기본 조합입니다. 타블라는 손가락 위치에 따라 음색이 다양하므로 주법이 충분히 녹음된 라이브러리를 쓰세요.","world drone hand-percussion");
T("hand-percussion","핸드 퍼커션","Hand Percussion","in","손으로 치는 타악기를 묶어 부르는 말입니다. 쿠바의 콩가와 봉고, 서아프리카의 젬베, 페루의 카혼, 셰이커와 탬버린 등이 있습니다.","드럼 세트만으로 리듬이 밋밋할 때 셰이커나 콩가를 한 겹 더하면 움직임이 생깁니다. 어쿠스틱 편성에서는 카혼이 드럼 세트를 대신합니다.","latin percussion groove oud");
T("kalimba","칼림바·핸드팬","Kalimba / Handpan","in","칼림바는 금속 조각을 엄지로 튕기는 작은 악기입니다. 핸드팬은 둥근 금속 통을 손으로 두드려 맑은 음을 내는 악기입니다.","둘 다 부드럽고 몽환적인 음색이라 힐링 게임, 퍼즐 게임 음악에 자주 쓰입니다.","mallets ambient-music lofi");
T("chimes","튜블러 벨·윈드 차임","Tubular Bells / Wind Chimes","in","튜블러 벨은 긴 금속 관을 매달아 망치로 치는 악기로 교회 종 같은 소리가 납니다. 윈드 차임은 작은 금속 막대 여러 개를 훑어 반짝이는 소리를 내는 악기입니다.","튜블러 벨은 운명, 경고, 장엄함을 표현합니다. 윈드 차임은 발라드와 장면 전환에서 흔히 씁니다. 너무 자주 쓰면 상투적으로 들립니다.","mallets celesta glissando");
T("solo-vocal","솔로 보컬(에스닉 보컬)","Solo / Ethnic Vocal","in","가사 없이 목소리를 악기처럼 쓰는 독창입니다. 특정 지역의 전통 창법을 쓴 것을 현장에서는 에스닉 보컬이라고 부릅니다.","영화와 게임에서 슬픔, 신성함, 광활한 풍경을 표현할 때 자주 씁니다. 가상악기는 프레이즈가 정해져 있는 경우가 많아 리얼 녹음의 효과가 큽니다.","choir world pansori session");
T("theremin","테레민","Theremin","in","악기에 손을 대지 않고 안테나 주변에서 손을 움직여 음높이와 음량을 조절하는 전자 악기입니다. 1920년 무렵 발명됐습니다.","음이 끊기지 않고 흐느끼듯 이어집니다. 옛 SF 영화와 유령 장면의 소리로 익숙합니다.","portamento synthesizer horror");
T("waterphone","워터폰","Waterphone","in","물을 담은 금속 통 둘레에 금속 막대를 여러 개 세운 악기입니다. 막대를 활로 긋거나 두드리면 기괴하게 휘는 소리가 납니다.","공포 영화와 호러 게임에서 매우 자주 쓰입니다. 음악과 효과음의 경계에 있는 소리라 사운드 디자이너와 역할을 나눠야 합니다.","horror sul-pont cluster");
T("prepared-piano","프리페어드 피아노","Prepared Piano","in","피아노 줄 사이에 나사, 고무, 종이 같은 물건을 끼워 음색을 바꾼 피아노입니다.","타악기 같은 둔탁한 소리나 금속성 소리가 납니다. 불안한 심리, 기계 장치, 실험적인 분위기에 씁니다.","piano horror sampling");
T("vocoder","보코더","Vocoder","in","목소리의 발음 특성을 신시사이저 소리에 입혀 로봇이 말하거나 노래하는 것처럼 들리게 하는 장치입니다.","SF, 로봇 캐릭터, 복고풍 전자음악에 씁니다. 가사가 들리게 하려면 발음을 또박또박 녹음해야 합니다.","synthesizer synthwave cyberpunk");

/* ───── 국악 용어 추가 ───── */
T("sobak","박과 소박","Beat and Subdivision (Sobak)","ko","국악에서 박을 다시 나눈 작은 단위를 소박이라고 합니다. 한 박이 셋으로 나뉘면 3소박, 둘로 나뉘면 2소박입니다. 굿거리와 자진모리는 3소박 네 박이라서 8분의 12박자로 적습니다.","우리 음악은 3소박이 기본입니다. 4분의 4박자로 적고 셋잇단으로 찍기보다 처음부터 8분의 12박자로 프로젝트를 여는 편이 작업하기 쉽습니다.","jangdan gutgeori jajinmori tuplet meter");
T("hanbae","한배","Hanbae (Tempo)","ko","국악에서 음악의 빠르기를 가리키는 말입니다. 같은 장단이라도 한배에 따라 느낌이 달라집니다.","국악은 한 곡 안에서 한배가 점점 빨라지는 구성이 많습니다. 템포 트랙에 완만한 가속을 그려 넣으면 그 느낌을 낼 수 있습니다.","jangdan tempo sanjo tempo-change");
T("gueum","구음","Gueum (Oral Sounds)","ko","악기 소리를 입으로 흉내 내어 부르는 소리입니다. 장구는 덩, 쿵, 덕, 기덕, 더러러러로, 가야금은 당, 동, 징 같은 소리로 가락을 외우고 전합니다.","국악 연주자와 리듬을 상의할 때 구음으로 말하면 가장 빨리 통합니다. 장단을 쓸 때 구음으로 먼저 불러 보세요.","jangdan janggu jeongganbo");
T("dodeuri","도드리","Dodeuri","ko","보통 빠르기의 6박 장단입니다. 정악에서 주로 씁니다. 되돌아 들어간다는 뜻의 이름입니다.","단정하고 여유로운 느낌이라 궁궐, 선비의 사랑방 장면에 맞습니다.","jangdan jeongak taryeong-j yeongsan");
T("taryeong-j","타령 장단","Taryeong","ko","3소박 네 박으로 이루어진 장단입니다. 굿거리와 박자 구조는 같지만 더 꿋꿋하고 씩씩하게 칩니다.","탈춤과 정악의 춤곡에 쓰입니다. 같은 12/8이라도 강세를 어디에 두느냐로 굿거리와 구분됩니다.","jangdan gutgeori dodeuri sobak");
T("danmori","단모리","Danmori","ko","휘모리보다 더 빠른 장단입니다. 산조의 마지막 부분에 쓰입니다.","가장 빠르게 몰아치는 대목입니다. 절정에서 짧게 쓰고 끊어야 효과가 있습니다.","hwimori sanjo jangdan");
T("eotjungmori","엇중모리","Eotjungmori","ko","보통 빠르기의 6박 장단입니다. 판소리에서 이야기를 마무리하는 끝 대목에 주로 씁니다.","이야기를 정리하며 끝내는 느낌이 있습니다. 엔딩이나 에필로그 음악에 응용해 볼 수 있습니다.","jangdan jungmori pansori");
T("chilchae","칠채","Chilchae","ko","한 장단 안에서 징을 일곱 번 치는 풍물 장단입니다. 3소박과 2소박이 섞여 있어서 박의 길이가 고르지 않습니다.","길을 걸으며 치는 가락이라 행진과 진군의 느낌이 납니다. 홀수 박자를 쓰는 전투 음악에 한국적인 색을 줄 때 참고하세요.","jangdan pungmul odd-meter eotmori");
T("yoseong","요성·퇴성·추성·전성","Vibrato / Falling / Rising / Rolling Tones","ko","시김새를 종류별로 나눈 이름입니다. 요성은 떠는 소리, 퇴성은 음을 끌어내리는 소리, 추성은 밀어 올리는 소리, 전성은 짧게 굴리는 소리입니다.","어느 음에 어떤 표현을 넣는지가 음계마다 정해져 있습니다. 모든 음을 떨지 말고, 떠는 음과 꺾는 음을 정해서 쓰세요.","sigimsae nonghyeon pyeongjo pitch-bend");
T("cheong","청(본청)","Cheong (Tonal Center)","ko","국악에서 기준이 되는 음높이, 또는 음계의 중심음을 가리키는 말입니다. 서양 음악의 키와 비슷하게 '청을 맞춘다', '청이 높다'고 말합니다.","소리꾼과 관악기는 편한 청이 정해져 있습니다. 리얼 녹음을 한다면 조를 정하기 전에 연주자에게 맞는 청을 물어보세요.","key yulmyeong session fusion-gugak");
T("heterophony","국악 합주의 짜임새","Heterophony","ko","국악 합주에서는 여러 악기가 화음을 쌓지 않고, 같은 선율을 악기마다 다르게 꾸미면서 함께 연주합니다. 이런 짜임새를 헤테로포니라고 합니다.","국악기 여럿에 화음을 나눠 맡기면 국악처럼 들리지 않습니다. 선율은 국악기들이 함께 연주하게 하고, 화음이 필요하면 서양 악기나 25현 가야금에 맡기세요.","texture sigimsae fusion-gugak sinawi");
T("megigo","메기고 받는 형식","Call and Response","ko","한 사람이 앞소리를 메기면 여럿이 뒷소리를 받아 부르는 형식입니다. 민요와 노동요에서 많이 씁니다.","합창과 독창을 번갈아 배치하면 됩니다. 마을 사람들이 함께 일하는 장면, 축제 장면의 노래에 어울립니다.","minyo pungmul chuimsae");
T("ginjajin","긴자진 형식","Slow–Fast Pairing","ko","느린 곡 뒤에 빠른 곡을 짝지어 이어 부르는 형식입니다. 긴아리랑과 자진아리랑, 긴난봉가와 자진난봉가가 그 예입니다.","같은 선율로 느린 버전과 빠른 버전을 만드는 방식입니다. 탐험 음악과 전투 음악을 한 테마로 묶는 설계에 응용할 수 있습니다.","minyo variation hanbae sanjo");
T("daseureum","다스름","Daseureum (Prelude)","ko","본곡에 들어가기 전에 악기의 음을 고르고 호흡을 맞추려고 연주하는 짧은 곡입니다. 박자가 자유롭습니다.","독주 악기가 장단 없이 자유롭게 시작한 뒤 본 장단으로 들어가는 구성은 한국풍 곡의 인트로로 쓰기 좋습니다.","sanjo intro-loop rubato");
T("samhyeon","삼현육각","Samhyeon Yukgak","ko","피리 둘, 대금, 해금, 장구, 북으로 이루어진 여섯 악기 편성입니다. 춤 반주와 잔치, 행차 음악에 쓰였습니다.","풍속화 속 잔치 장면에 나오는 편성입니다. 한국풍 마을, 연회 음악을 쓸 때 이 여섯 악기로 시작하면 구성이 자연스럽습니다.","piri daegeum haegeum janggu jwago instrumentation");
T("pungnyu","줄풍류와 대풍류","String / Wind Ensemble Music","ko","풍류는 선비들이 사랑방에서 즐기던 합주 음악입니다. 거문고와 가야금 같은 현악기가 중심이면 줄풍류, 피리와 대금 같은 관악기가 중심이면 대풍류라고 합니다.","줄풍류는 조용하고 실내악에 가깝고, 대풍류는 음량이 커서 춤과 야외 행사에 맞습니다. 장면의 크기에 따라 골라 쓰세요.","yeongsan jeongak samhyeon chamber");
T("aak","아악·당악·향악","Aak / Dangak / Hyangak","ko","궁중 음악을 유래에 따라 나눈 이름입니다. 아악은 중국에서 들어온 제례 음악이고, 당악은 중국에서 들어와 우리 식으로 바뀐 음악, 향악은 우리나라에서 만들어진 음악입니다.","편종과 편경이 울리는 느리고 장중한 소리는 아악의 색입니다. 제례, 신전, 왕실 의식 장면에 씁니다.","jeongak jongmyo pyeonjong yeominrak");
T("jongmyo","종묘제례악","Jongmyo Jeryeak","ko","조선 왕실의 사당인 종묘에서 제사를 지낼 때 연주하는 음악입니다. 기악과 노래, 춤이 함께합니다. 유네스코 인류무형문화유산으로 올라 있습니다.","편종, 편경, 축, 박 같은 의식용 악기가 모두 쓰입니다. 왕실 의식의 소리를 참고할 때 가장 먼저 들어 볼 음악입니다.","aak pyeonjong bak chuk jeongak");
T("sujecheon","수제천","Sujecheon","ko","궁중에서 연주하던 느리고 장중한 관악 합주곡입니다. 피리가 선율을 쉬는 동안 대금과 다른 악기가 가락을 이어 주는 것이 특징입니다.","박이 느리고 길이가 고르지 않아서 시간이 멈춘 듯한 느낌을 줍니다. 왕의 등장, 장엄한 의식 장면의 참고 자료가 됩니다.","jeongak piri daegeum aak");
T("yeongsan","영산회상","Yeongsan Hoesang","ko","풍류방에서 연주하던 기악 모음곡입니다. 아주 느린 곡으로 시작해 뒤로 갈수록 빨라지는 여러 곡으로 이루어져 있습니다.","느리게 시작해 점점 빨라지는 구성은 국악의 기본 틀입니다. 긴 시간에 걸쳐 고조되는 곡의 설계에 참고하세요.","pungnyu dodeuri jeongak hanbae");
T("yeominrak","여민락","Yeominrak","ko","조선 세종 때 만든 궁중 음악입니다. 백성과 더불어 즐긴다는 뜻입니다.","넉넉하고 화평한 궁중 음악의 대표곡입니다. 태평성대, 궁궐의 평온한 일상을 표현할 때 참고합니다.","jeongak aak sujecheon");
T("daechwita","대취타","Daechwita","ko","왕의 행차나 군대의 행진 때 연주하던 음악입니다. 태평소, 나발, 나각, 자바라, 징, 용고로 편성합니다.","태평소 혼자 선율을 맡고 나머지는 모두 리듬과 신호를 맡습니다. 한국풍 군대, 개선 행진, 위엄 있는 등장에 그대로 쓸 수 있는 편성입니다.","taepyeongso nabal jabara jwago march");
T("pungmul","풍물놀이(농악)","Pungmul / Nongak","ko","꽹과리, 징, 장구, 북, 소고, 태평소를 치고 불며 행진하고 춤추는 마을 단위의 놀이 음악입니다. 농악이라고도 하며 유네스코 인류무형문화유산으로 올라 있습니다.","사물놀이는 풍물을 앉아서 연주하도록 다듬은 것입니다. 마을 축제, 추수, 장터 장면에는 걷고 춤추는 풍물의 느낌이 더 맞습니다.","samulnori kkwaenggwari sogo taepyeongso chilchae");
T("jeongga","정가(가곡·가사·시조)","Jeongga","ko","선비 계층이 부르던 성악곡입니다. 관현악 반주에 맞춰 시조시를 노래하는 가곡, 긴 가사를 노래하는 가사, 시조시를 간단한 가락에 얹는 시조가 있습니다.","음을 길게 끌며 맑고 곧게 부르는 발성입니다. 판소리의 거친 소리와 대비되므로 고결하거나 신비로운 인물의 목소리에 어울립니다.","jeongak solo-vocal pansori pungnyu");
T("byeongchang","병창","Byeongchang","ko","악기를 연주하면서 노래를 함께 부르는 것입니다. 가야금 병창이 대표적입니다.","노래와 가야금이 같은 가락을 주고받습니다. 음유시인 같은 인물이 직접 연주하며 노래하는 장면에 쓸 수 있습니다.","gayageum pansori minyo diegetic");
T("je","판소리의 제·바디·더늠","Schools and Styles of Pansori","ko","제는 지역에 따라 나뉜 판소리의 유파로 동편제, 서편제, 중고제가 있습니다. 바디는 스승에게서 전해 받은 한 마당 전체의 짜임이고, 더늠은 명창이 자기만의 것으로 다듬어 유명해진 대목입니다.","동편제는 씩씩하고 끝을 짧게 끊으며, 서편제는 애절하고 꾸밈이 많습니다. 소리꾼에게 녹음을 의뢰할 때 원하는 분위기를 이 말로 전할 수 있습니다.","pansori gosu pyeongjo sigimsae");
T("gosu","고수","Gosu (Drummer)","ko","판소리에서 북으로 장단을 짚어 주는 반주자입니다. 추임새로 소리꾼의 흥을 돋우는 역할도 합니다.","'일고수 이명창'이라는 말이 있을 만큼 고수의 역할이 큽니다. 북 하나와 목소리 하나만으로 긴 이야기를 끌고 가는 구성을 들어 보세요.","pansori buk chuimsae je");
T("changgeuk","창극","Changgeuk","ko","판소리를 여러 배우가 배역을 나눠 맡아 연기하고 노래하는 음악극입니다.","국악 관현악 반주가 붙습니다. 한국풍 뮤지컬 형식의 콘텐츠를 만들 때 참고가 됩니다.","pansori musical opera");
T("japga","잡가","Japga","ko","전문 소리꾼들이 부르던 길고 기교가 많은 노래입니다. 경기 잡가, 서도 잡가, 남도 잡가가 있습니다.","민요보다 길고 어려워 전문가의 음악으로 여겨졌습니다. 기방, 저잣거리의 놀이판 장면에 어울립니다.","minyo jeongga pansori");
T("muak","굿 음악(무악)","Shamanic Music","ko","굿을 할 때 연주하는 음악입니다. 지역마다 장단과 악기가 다르며 산조와 시나위, 판소리의 뿌리가 되었습니다.","복잡한 타악 장단과 즉흥 합주가 특징입니다. 무당, 귀신, 저승을 다루는 작품에 필요한 소리입니다.","sinawi jing jabara horror");
T("beompae","범패","Beompae (Buddhist Chant)","ko","절에서 재를 올릴 때 부르는 불교 의식 음악입니다. 가사의 한 음절을 길게 늘여 부릅니다.","사찰, 명상, 장례 의식 장면에 씁니다. 목탁, 요령, 큰 북 같은 의식 도구의 소리와 함께 구성합니다.","jeongga gregorian jabara");
T("gugak-orchestra","국악관현악","Korean Traditional Orchestra","ko","국악기를 서양 오케스트라처럼 악기군으로 나눠 편성한 대규모 합주입니다. 20세기 후반에 자리 잡았고 개량 악기를 함께 씁니다.","작곡가가 악보로 쓴 창작곡을 연주합니다. 한국풍 대편성 음악을 리얼로 녹음할 때 선택할 수 있는 편성입니다.","gaeryang fusion-gugak orchestration heterophony");

/* ───── 국악기 추가 ───── */
T("yanggeum","양금","Yanggeum","ki","사다리꼴 울림통에 얹은 쇠줄을 가는 대나무 채로 쳐서 소리 내는 현악기입니다. 서양의 덜시머 계통 악기가 중국을 거쳐 조선 후기에 들어왔습니다.","국악기 가운데 드물게 쇠줄을 써서 맑고 영롱한 소리가 납니다. 농현을 할 수 없어서 선율을 또렷하게 짚는 역할을 합니다.","yangqin santoor pungnyu psaltery");
T("bipa-k","비파(향비파·당비파)","Korean Bipa","ki","물방울 모양의 울림통을 안고 줄을 뜯어 연주하는 현악기입니다. 목이 곧고 줄이 다섯인 향비파와 목이 굽고 줄이 넷인 당비파가 있습니다.","한동안 연주 전통이 끊겼다가 근래에 복원과 개량이 이루어졌습니다. 삼국 시대, 고려 시대 배경의 음악에 쓰면 시대감이 납니다.","guzheng lute gaeryang");
T("tungso","퉁소","Tungso","ki","굵은 대나무로 만든 세로로 부는 관악기입니다. 단소보다 크고 소리가 굵습니다.","북청사자놀음의 반주 악기로 알려져 있습니다. 북방, 변방의 거친 정서를 표현할 때 어울립니다.","sogeum daegeum xiao");
T("hun","훈","Hun","ki","흙을 빚어 구운 둥근 관악기입니다. 어둡고 낮은 소리가 납니다. 제례 음악에 씁니다.","오카리나와 원리가 같지만 음색이 훨씬 어둡습니다. 고대, 무덤, 땅속 같은 장면에 써 볼 수 있습니다.","xun aak jongmyo");
T("nabal","나발·나각","Nabal / Nagak","ki","나발은 긴 금속 관으로 된 관악기로 낮은 음 하나만 길게 냅니다. 나각은 큰 소라 껍데기로 만든 관악기입니다. 둘 다 대취타에 씁니다.","선율 없이 신호처럼 길게 뻗는 소리입니다. 군대의 출정, 성문이 열리는 장면에 한 번 울리는 것만으로 효과가 있습니다.","daechwita taepyeongso horn");
T("pyeonjong","편종·편경","Pyeonjong / Pyeongyeong","ki","편종은 크기가 같고 두께가 다른 종 열여섯 개를, 편경은 ㄱ자 모양의 돌 열여섯 개를 틀에 매달아 치는 타악기입니다. 궁중 제례 음악에 씁니다.","편경은 돌로 만들어 온도와 습도가 변해도 음이 달라지지 않습니다. 그래서 다른 악기를 조율하는 기준이 되었습니다. 신전, 왕실 의식의 소리로 씁니다.","aak jongmyo chimes mallets");
T("bak","박","Bak (Clapper)","ki","나무 판 여섯 조각을 한쪽 끝에서 묶은 악기입니다. 부채처럼 폈다가 한 번에 접어 '딱' 소리를 냅니다. 궁중 음악의 시작과 끝을 알립니다.","박을 치는 사람이 합주를 이끄는 지휘자 역할을 했습니다. 의식의 시작을 알리는 한 번의 소리로 쓰세요.","jongmyo chuk aak");
T("chuk","축·어","Chuk / Eo","ki","축은 네모난 나무 상자를 방망이로 내리쳐 음악의 시작을 알리는 악기입니다. 어는 엎드린 호랑이 모양의 나무 악기로, 등에 난 톱니를 대나무 채로 긁어 음악의 끝을 알립니다.","제례 음악에서만 쓰는 의식용 악기입니다. 소리 자체가 낯설어서 고대 의식의 분위기를 내기에 좋습니다.","bak jongmyo aak");
T("jwago","좌고·용고","Jwago / Yonggo","ki","좌고는 틀에 매달아 놓고 앉아서 치는 북으로 삼현육각 편성에 씁니다. 용고는 북통에 용을 그린 북으로, 허리에 매고 두 손의 채로 칩니다. 대취타에 씁니다.","좌고는 장구와 함께 장단의 첫 박을 짚어 주는 역할을 합니다.","buk samhyeon daechwita janggu");
T("sogo","소고","Sogo","ki","손잡이가 달린 작은 북입니다. 풍물놀이에서 한 손에 들고 채로 치면서 춤을 춥니다.","음량이 작아서 리듬의 중심보다는 춤과 움직임을 더하는 역할입니다. 가볍고 통통 튀는 소리로 밝은 장면에 씁니다.","pungmul buk hand-percussion");
T("ulla","운라","Ulla","ki","작은 놋쇠 접시 여러 개를 틀에 매달아 작은 채로 치는 타악기입니다. 맑고 높은 소리가 납니다. 행차 음악에 씁니다.","음높이가 있어서 선율을 연주할 수 있습니다. 밝고 화려한 행차, 궁중 연회 음악에 반짝이는 색을 더합니다.","daechwita mallets pyeonjong");
T("jabara","자바라","Jabara","ki","놋쇠로 만든 둥근 판 두 장을 마주 쳐서 소리 내는 타악기입니다. 서양의 심벌즈와 비슷합니다. 대취타, 불교 의식, 굿에 씁니다.","바라라고도 부릅니다. 크기에 따라 소리가 달라지며, 의식과 행진의 강한 박을 짚습니다.","daechwita cymbals muak beompae");
T("gaeryang","개량 국악기","Modernized Korean Instruments","ki","음역을 넓히고 음량을 키우거나 서양 음계에 맞게 고친 국악기입니다. 25현 가야금, 저음 해금, 대피리, 개량 대금 등이 있습니다.","서양 악기와 합주하거나 화음을 연주하려면 개량 악기가 편합니다. 다만 전통 악기의 농현과 음색은 줄어들 수 있으니 곡의 성격에 따라 고르세요.","gayageum gugak-orchestra fusion-gugak cheong");

/* ───── 중국·몽골 악기 ───── */
T("dizi","디즈","Dizi","in","대나무로 만든 중국의 가로 피리입니다. 구멍 하나에 얇은 막을 붙여서 밝고 살짝 떨리는 소리가 납니다. 한자음으로 적자라고도 합니다.","짧고 높은 방디는 북방의 경쾌한 음악에, 길고 부드러운 취디는 남방의 서정적인 음악에 씁니다. 무협풍 선율 악기로 가장 흔합니다.","wuxia daegeum xiao bansuri");
T("xiao","샤오","Xiao","in","대나무로 만든 중국의 세로 피리입니다. 한자음으로 소 또는 퉁소라고 부릅니다. 부드럽고 낮은 소리가 납니다.","조용하고 사색적인 음색입니다. 달밤, 은둔한 고수, 이별 장면의 독주에 어울립니다.","dizi guqin tungso shakuhachi");
T("sheng","성(중국 생황)","Sheng","in","여러 개의 대나무 관을 바람통에 꽂은 중국의 관악기입니다. 숨을 내쉴 때와 들이쉴 때 모두 소리가 나고 화음을 연주할 수 있습니다.","우리 생황의 원류가 되는 악기입니다. 중국풍 합주에서 화음을 채우는 역할을 합니다.","saenghwang wuxia accordion");
T("suona","쒀나","Suona","in","겹리드를 꽂아 부는 중국의 나팔 모양 관악기입니다. 음량이 매우 크고 날카롭습니다. 우리 태평소와 같은 계통입니다.","결혼식과 장례식, 축제에 쓰이는 악기라 떠들썩한 장면과 비통한 장면에 모두 씁니다.","taepyeongso zurna shawm wuxia");
T("yangqin","양친","Yangqin","in","사다리꼴 울림통의 쇠줄을 대나무 채로 쳐서 연주하는 중국의 현악기입니다. 우리 양금과 같은 계통이지만 더 크고 음역이 넓습니다.","빠른 아르페지오와 트레몰로로 합주의 반주를 채웁니다.","yanggeum santoor wuxia psaltery");
T("guqin","구친","Guqin","in","줄 일곱 개를 손가락으로 뜯는 중국의 현악기입니다. 한자음으로 고금이라고 합니다. 음량이 작고 낮으며, 줄을 문질러 미끄러지는 소리와 하모닉스를 많이 씁니다.","학자와 은자의 악기로 여겨졌습니다. 고쟁보다 훨씬 조용하고 여백이 많으니 화려한 장면에는 고쟁을, 사색적인 장면에는 구친을 쓰세요.","guzheng xiao geomungo harmonics");
T("ruan","롼·류친","Ruan / Liuqin","in","롼은 둥근 울림통에 줄 네 개를 건 중국의 뜯는 현악기입니다. 크기에 따라 중음과 저음을 맡습니다. 류친은 버들잎 모양의 작은 악기로 높은 음을 맡습니다.","중국풍 합주에서 롼은 기타처럼 리듬과 화음을, 류친은 만돌린처럼 높은 선율을 맡습니다.","guzheng wuxia lute");
T("hulusi","후루쓰","Hulusi","in","조롱박에 대나무 관 세 개를 꽂은 중국 남서부의 관악기입니다. 가운데 관으로 선율을 불고 옆의 관이 지속음을 냅니다.","부드럽고 달콤한 음색입니다. 열대 숲, 소수민족 마을, 평화로운 풍경에 어울립니다.","drone wuxia world");
T("xun","쉰","Xun","in","흙을 구워 만든 달걀 모양의 중국 관악기입니다. 어둡고 구슬픈 소리가 납니다. 우리 훈과 같은 계통입니다.","아주 오래된 악기라 고대, 폐허, 전쟁 뒤의 적막을 표현할 때 씁니다.","hun xiao wuxia");
T("jinghu","징후와 경극 타악기","Jinghu / Peking Opera Percussion","in","징후는 경극에서 노래를 반주하는 작고 음이 높은 2현 악기입니다. 경극의 타악기는 작은 북, 큰 징과 작은 징, 작은 심벌로 이루어집니다.","음높이가 미끄러지는 징 소리와 딱딱한 북 소리는 경극의 표시입니다. 인물의 등장과 무술 동작에 맞춰 칩니다.","erhu wuxia mickey-mousing");
T("morin-khuur","마두금과 흐미","Morin Khuur / Throat Singing","in","마두금은 머리에 말 조각을 새긴 몽골의 2현 악기로 활로 연주합니다. 흐미는 한 사람이 낮은 지속음과 높은 휘파람 같은 소리를 동시에 내는 창법입니다.","초원, 유목민, 기마 민족을 표현하는 소리입니다. 말이 달리는 듯한 리듬의 활 주법이 특징입니다.","erhu nordic drone world");

/* ───── 중세·르네상스 유럽 악기 ───── */
T("recorder","리코더","Recorder","in","세로로 부는 나무 관악기입니다. 중세부터 바로크 시대까지 널리 쓰였습니다. 소프라노부터 베이스까지 여러 크기가 있습니다.","학교에서 쓰는 플라스틱 악기와 달리 나무 리코더는 부드럽고 따뜻한 소리가 납니다. 중세풍 마을과 궁정 음악의 기본 선율 악기입니다.","medieval baroque tin-whistle flute");
T("shawm","숌","Shawm","in","겹리드를 쓰는 중세와 르네상스의 관악기입니다. 오보에의 조상입니다. 소리가 크고 날카로워 야외에서 쓰였습니다.","행진, 축제, 마상 시합처럼 시끄러운 야외 장면에 맞습니다.","oboe medieval suona zurna");
T("sackbut","색버트","Sackbut","in","르네상스 시대의 트롬본입니다. 지금의 트롬본보다 관이 가늘고 나팔이 작아 소리가 부드럽습니다.","합창과 잘 섞이는 음색이라 교회와 궁정 음악에 쓰였습니다.","trombone cornett medieval");
T("crumhorn","크룸호른","Crumhorn","in","끝이 갈고리처럼 굽은 르네상스의 관악기입니다. 리드가 덮개 안에 들어 있어 코맹맹이 같은 붕붕거리는 소리가 납니다.","익살스러운 음색이라 광대, 주점, 떠들썩한 장터에 어울립니다.","medieval shawm cartoon");
T("vielle","비엘·레벡","Vielle / Rebec","in","비엘은 중세의 활로 긋는 현악기로 바이올린보다 크고 줄이 다섯 개쯤 됩니다. 레벡은 배 모양의 작은 3현 악기입니다.","비브라토 없이 곧게 긋는 거친 소리가 중세의 느낌을 냅니다. 바이올린 샘플을 쓴다면 비브라토를 빼 보세요.","violin medieval rebab gamba");
T("psaltery","프살테리움·덜시머","Psaltery / Hammered Dulcimer","in","프살테리움은 판 위에 건 줄을 손가락으로 뜯는 악기입니다. 덜시머는 같은 구조의 줄을 작은 채로 쳐서 연주합니다.","맑게 반짝이는 소리가 납니다. 덜시머의 빠른 채 놀림은 켈틱풍과 중세풍 음악에 반짝이는 반주를 더합니다.","medieval celtic yanggeum santoor");
T("medieval-harp","중세 하프(켈틱 하프)","Medieval / Celtic Harp","in","페달이 없는 작은 하프입니다. 무릎에 올려놓고 연주합니다.","오케스트라 하프보다 음역이 좁고 소리가 맑고 가볍습니다. 음유시인, 요정, 옛이야기를 들려주는 장면에 씁니다.","harp celtic medieval lute");
T("portative","포르타티프 오르간","Portative Organ","in","무릎에 올려놓고 한 손으로 풀무질을 하며 다른 손으로 건반을 치는 작은 오르간입니다.","피리 여러 개가 함께 우는 듯한 맑은 소리입니다. 중세 수도원과 순례 장면에 어울립니다.","organ medieval gregorian");
T("pipe-tabor","파이프와 테이버","Pipe and Tabor","in","한 사람이 한 손으로 구멍 세 개짜리 피리를 불고 다른 손으로 작은 북을 치는 연주 방식입니다.","혼자서 선율과 리듬을 모두 맡습니다. 중세의 춤, 거리 악사에 맞는 소박한 소리입니다.","recorder medieval snare");
T("nakers","나커와 틀북","Nakers / Frame Drum","in","나커는 허리에 차거나 바닥에 놓고 채로 치는 작은 쌍북입니다. 중동에서 유럽으로 전해졌습니다. 틀북은 둥근 틀에 가죽을 댄 얕은 북으로 손으로 칩니다.","중세풍 음악의 타악기는 작고 단순합니다. 드럼 세트나 대형 북 대신 틀북과 탬버린으로 리듬을 만들어 보세요.","medieval frame-drum timpani bodhran");
T("gamba","비올라 다 감바","Viola da Gamba","in","다리 사이에 세우고 활로 연주하는 르네상스와 바로크 시대의 현악기입니다. 줄이 여섯 개쯤이고 지판에 프렛이 있습니다.","첼로보다 소리가 가늘고 은은합니다. 궁정과 귀족의 실내 음악에 씁니다.","cello baroque vielle chamber");
T("cornett","코르넷토","Cornett (Cornetto)","in","나무 관에 손가락 구멍을 뚫고 금관악기처럼 입술을 떨어 부는 르네상스의 관악기입니다.","사람 목소리와 닮은 부드러운 소리가 납니다. 색버트와 함께 교회 음악에 쓰였습니다.","sackbut trumpet medieval");
T("cittern","시턴·만돌라","Cittern / Mandola","in","쇠줄을 피크로 뜯는 르네상스의 현악기입니다. 류트보다 소리가 밝고 또렷합니다.","주점과 이발소에 걸어 두고 누구나 치던 서민의 악기였습니다. 류트 대신 쓰면 더 떠들썩한 분위기가 납니다.","lute medieval acoustic-guitar");
T("bodhran","보란","Bodhrán","in","아일랜드의 틀북입니다. 한 손에 든 짧은 채의 양 끝으로 치고, 다른 손으로 가죽 뒤를 눌러 음높이와 음색을 바꿉니다.","켈틱풍 음악의 리듬을 맡습니다. 지그와 릴의 빠른 리듬을 촘촘하게 채웁니다.","celtic nakers frame-drum tin-whistle");
T("nyckelharpa","니켈하르파","Nyckelharpa","in","활로 긋는 스웨덴의 현악기입니다. 손가락으로 줄을 직접 누르지 않고 나무 건반을 눌러 음을 바꿉니다. 함께 울리는 공명 줄이 있습니다.","바이올린보다 울림이 많고 아련합니다. 북유럽풍과 중세풍 음악에 자주 쓰입니다.","nordic vielle medieval drone");
T("talharpa","타겔하르파","Talharpa (Tagelharpa)","in","말총으로 만든 줄을 활로 긋는 북유럽의 옛 현악기입니다. 거칠고 쉰 듯한 소리가 납니다.","바이킹을 다루는 작품에서 널리 쓰이는 소리입니다. 지속음 위에서 단순한 음형을 반복합니다.","nordic drone vielle");

/* ───── 인도 악기 ───── */
T("tanpura","탄푸라","Tanpura","in","줄 네댓 개를 차례로 뜯어 지속음을 내는 인도의 현악기입니다. 선율은 연주하지 않습니다. 웅웅거리며 배음이 풍부하게 울립니다.","인도 음악은 처음부터 끝까지 이 지속음 위에서 진행합니다. 인도풍 곡을 쓸 때 가장 먼저 깔아야 하는 소리입니다.","indian drone sitar-tabla overtone");
T("sarod","사로드","Sarod","in","프렛이 없는 금속 지판 위에서 줄을 눌러 연주하는 북인도의 뜯는 현악기입니다. 시타르보다 낮고 묵직한 소리가 납니다.","음과 음 사이를 길게 미끄러지는 표현이 특징입니다. 깊고 진지한 분위기의 독주에 맞습니다.","indian sitar-tabla oud portamento");
T("bansuri","반수리","Bansuri","in","대나무로 만든 인도의 가로 피리입니다. 부드럽고 따뜻한 소리가 납니다.","손가락으로 구멍을 조금씩 열고 닫아 음을 미끄러지게 합니다. 강가의 아침, 목가적인 풍경에 어울립니다.","indian dizi flute daegeum");
T("sarangi","사랑기","Sarangi","in","활로 긋는 북인도의 현악기입니다. 연주하는 줄 아래에 수십 개의 공명 줄이 있습니다. 줄을 지판에 누르지 않고 손톱 뿌리로 옆에서 밀어 음을 냅니다.","사람이 노래하는 것과 가장 가까운 악기로 꼽힙니다. 흐느끼는 듯한 선율이 필요할 때 씁니다.","indian haegeum kamancheh solo-vocal");
T("shehnai","셰나이","Shehnai","in","겹리드를 쓰는 북인도의 관악기입니다. 결혼식과 사원의 의식에서 연주합니다.","인도에서는 경사스러운 날의 소리입니다. 축제와 행렬 장면에 씁니다.","indian suona zurna oboe");
T("veena","비나","Veena","in","큰 울림통과 긴 목을 가진 남인도의 뜯는 현악기입니다. 프렛이 있습니다.","시타르보다 소리가 둥글고 차분합니다. 남인도 음악과 신화를 다루는 장면에 어울립니다.","indian sitar-tabla mridangam");
T("santoor","산투르","Santoor","in","사다리꼴 울림통에 건 많은 쇠줄을 가벼운 나무 채로 쳐서 연주하는 악기입니다. 인도 카슈미르 지방과 페르시아에서 씁니다.","빗방울이 떨어지는 듯한 맑고 촘촘한 소리가 납니다. 산과 호수, 신비로운 풍경에 맞습니다.","indian middle-east yanggeum psaltery");
T("harmonium","하모니움","Harmonium","in","한 손으로 풀무를 움직이고 다른 손으로 건반을 치는 작은 리드 오르간입니다. 유럽에서 들어와 인도 음악의 노래 반주 악기로 자리 잡았습니다.","노래의 선율을 따라가며 받쳐 줍니다. 종교 집회의 합창, 거리의 노래 장면에 씁니다.","indian accordion organ drone");
T("mridangam","므리당감","Mridangam","in","양쪽에 가죽을 댄 남인도의 북입니다. 무릎에 올려놓고 양손으로 칩니다.","북인도의 타블라에 해당하는 남인도의 대표 타악기입니다. 복잡한 리듬 주기를 연주합니다.","indian sitar-tabla veena janggu");
T("dhol","돌·돌락","Dhol / Dholak","in","돌은 어깨에 메고 채 두 개로 치는 큰 양면 북입니다. 돌락은 그보다 작고 손으로 칩니다.","돌의 힘찬 리듬은 인도 북부의 축제 음악과 춤곡의 중심입니다. 군중이 춤추는 장면에 씁니다.","indian hand-percussion taiko");

/* ───── 중동 악기 ───── */
T("qanun","카눈","Qanun","in","사다리꼴 울림통에 건 많은 줄을 양손 손가락에 낀 픽으로 뜯는 중동의 현악기입니다. 무릎이나 탁자에 올려놓고 연주합니다.","작은 레버로 음을 미세하게 올리고 내려 중동 음계를 맞춥니다. 빠른 트레몰로와 화려한 훑기가 특징입니다.","middle-east oud santoor psaltery");
T("ney","네이","Ney","in","갈대로 만든 중동의 세로 피리입니다. 입술에 비스듬히 대고 붑니다. 숨소리가 많이 섞인 쓸쓸한 소리가 납니다.","사막의 밤, 고독, 영적인 장면에 씁니다. 숨소리까지 음악의 일부이니 깨끗하게 지우지 마세요.","middle-east duduk shakuhachi xiao");
T("saz","사즈(바을라마)","Saz / Bağlama","in","목이 긴 튀르키예의 뜯는 현악기입니다. 쇠줄의 밝고 쨍한 소리가 납니다.","민요와 음유시인의 노래를 반주합니다. 아나톨리아, 유목민 마을, 길 위의 이야기꾼에 어울립니다.","middle-east oud tar lute");
T("kamancheh","케만체","Kamancheh","in","둥근 울림통을 무릎에 세우고 활로 연주하는 페르시아의 현악기입니다.","악기를 돌려 가며 줄을 바꿉니다. 가늘고 애절한 음색으로 선율을 길게 풀어 갑니다.","middle-east rebab sarangi haegeum");
T("tar","타르·세타르","Tar / Setar","in","타르는 8자 모양의 울림통과 긴 목을 가진 페르시아의 뜯는 현악기입니다. 세타르는 그보다 작고 조용하며 검지 손톱으로 뜯습니다.","페르시아 음악의 중심 악기입니다. 궁정, 시 낭송, 사색적인 장면에 씁니다.","middle-east saz oud sitar-tabla");
T("frame-drum","리크·다프·벤디르","Riq / Daf / Bendir","in","중동과 북아프리카의 틀북입니다. 리크는 작은 심벌이 달린 탬버린이고, 다프는 틀 안쪽에 쇠고리가 달린 큰 북입니다. 벤디르는 가죽 안쪽에 줄을 대어 웅웅거리는 소리가 납니다.","다르부카와 함께 리듬을 만듭니다. 다프의 쇠고리 소리는 의식과 황홀경의 분위기를 냅니다.","middle-east oud nakers bodhran hand-percussion");
T("zurna","주르나·다불","Zurna / Davul","in","주르나는 겹리드를 쓰는 중동과 발칸 지역의 야외용 관악기로 소리가 매우 큽니다. 다불은 어깨에 메고 양면을 굵은 채와 가는 채로 치는 큰 북입니다.","둘이 짝을 이뤄 결혼식, 축제, 군악에 쓰입니다. 오스만 군악대의 소리가 필요할 때 씁니다.","middle-east suona shawm taepyeongso klezmer");
T("rebab","레바브","Rebab","in","활로 긋는 중동의 옛 현악기입니다. 유럽 레벡의 조상으로 여겨집니다.","줄 수가 적고 음역이 좁아 거칠고 소박한 소리가 납니다. 유목민, 사막의 이야기꾼에 어울립니다.","middle-east kamancheh vielle erhu");
T("tombak","톰바크","Tombak","in","잔 모양의 페르시아 손북입니다. 손가락 끝을 튕기고 굴려 섬세한 리듬을 만듭니다.","다르부카보다 소리가 낮고 부드럽습니다. 페르시아풍 음악의 리듬을 맡습니다.","middle-east oud tar hand-percussion");

 "morin-khuur":"모린 호르, 후미", gamba:"감바", psaltery:"해머드 덜시머", jabara:"바라", pungmul:"농악, 풍물", gosu:"북재비",
 "frame-drum":"프레임 드럼", saz:"바글라마", "bipa-k":"비파", gaeryang:"개량 악기", "gugak-orchestra":"국악 오케스트라", yoseong:"떠는 음, 꺾는 음"
};
Object.keys(AKA).forEach(function(k){if(!AKA[k])delete AKA[k];});
(function(){
  var RN={implementation:"구현(임플리멘테이션)",vertical:"수직 레이어링(버티컬 리오케스트레이션)",horizontal:"수평 리시퀀싱(호리즌탈)",
    "listening-fatigue":"반복 청취 피로",dynamics:"셈여림(다이내믹)","voice-leading":"성부 진행(보이스 리딩)",sequence:"동형진행(시퀀스)",
    "two-pop":"투 팝(2-pop)",harp:"하프",unison:"유니즌"};
  var KI="gayageum geomungo haegeum ajaeng daegeum sogeum piri taepyeongso saenghwang janggu buk kkwaenggwari jing".split(" ");
  TERMS.forEach(function(t){if(RN[t.id])t.ko=RN[t.id];if(t.id==="harp"||t.id==="timpani")t.cat="in";if(KI.indexOf(t.id)>=0)t.cat="ki";});
})();

/* ───── 화면 ───── */
var BY={};TERMS.forEach(function(t){BY[t.id]=t;});
TERMS.forEach(function(t){t.rel=t.rel.filter(function(r){return BY[r]&&r!==t.id;});});
var BACK={};
TERMS.forEach(function(t){t.rel.forEach(function(r){(BACK[r]=BACK[r]||[]).push(t.id);});});
var SORTED=TERMS.slice().sort(function(a,b){return a.ko.localeCompare(b.ko,"ko");});
var CHO=["ㄱ","ㄱ","ㄴ","ㄷ","ㄷ","ㄹ","ㅁ","ㅂ","ㅂ","ㅅ","ㅅ","ㅇ","ㅈ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function initial(s){var c=s.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)return CHO[Math.floor((c-0xAC00)/588)];return "A–Z·숫자";}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function dot(cat){return '<span class="dot" style="background:var(--c-'+cat+')"></span>';}
function tlink(id){var t=BY[id];return '<a href="#'+t.id+'">'+esc(t.ko)+'</a>';}
function rows(list){
  return '<ul class="list">'+list.map(function(t){
    return '<li><div class="t"><a href="#'+t.id+'">'+esc(t.ko)+'</a><small>'+esc(t.en)+'</small></div><div class="d">'+esc(t.def.split(". ")[0].replace(/\.$/,""))+'.</div></li>';
  }).join("")+'</ul>';
}
var PATHS=[
  {h:"게임음악 작곡을 시작하는 분",p:"아래 순서로 읽으면 '반복되고, 상황에 따라 바뀌는 음악'이라는 게임음악의 전제를 먼저 잡을 수 있습니다.",ids:["bgm","loop","intro-loop","reverb-tail","adaptive-music","vertical","horizontal","transition","middleware","listening-fatigue"]},
  {h:"영상음악 작곡을 시작하는 분",p:"영상 작업은 화면과 감독이 기준입니다. 작업 흐름을 따라 용어를 배치했습니다.",ids:["spotting","temp-track","cue","timecode","hit-point","tempo-map","underscore","leitmotif","stem","lufs"]},
  {h:"오케스트라 목업이 어색하게 들리는 분",p:"대부분 주법 선택과 세기 표현에서 문제가 생깁니다. 이 항목들을 차례로 점검해 보세요.",ids:["mockup","articulation","expression-cc","legato","keyswitch","round-robin","range","divisi","humanize","reverb"]},
  {h:"동양풍·사극풍 음악을 맡게 된 분",p:"국악은 장단과 시김새를 모르면 악기 소리만 빌려 온 음악이 됩니다. 개념을 먼저 읽고 악기로 넘어가세요.",ids:["jangdan","sobak","gutgeori","jajinmori","semachi","sigimsae","pyeongjo","heterophony","gayageum","haegeum","daegeum","janggu","gaeryang","fusion-gugak"]}
];
function viewHome(){
  var h='<p class="notice">엠나인아카데미 수강생 전용 학습자료 <small>수강생의 학습을 위해 만든 자료입니다.</small></p><h1>음악용어 위키</h1><p class="lede">수업과 피드백에서 제가 자주 쓰는 용어를 한곳에 모았습니다. 지금은 '+TERMS.length+'개 항목이 있습니다. 각 항목에는 뜻과 함께, 게임음악과 영상음악 작업에서 그 개념을 어떻게 쓰는지 적어 두었습니다. 모르는 말이 나오면 위 검색창에 한글이나 영문으로 입력하세요.</p>';
  h+='<h2 class="sec">분류별로 보기</h2><div class="cards">';
  Object.keys(CATS).forEach(function(k){
    var n=TERMS.filter(function(t){return t.cat===k;}).length;
    h+='<div class="card" style="border-top-color:var(--c-'+k+')"><h3><a href="#cat-'+k+'">'+esc(CATS[k].name)+'</a></h3><p>'+esc(CATS[k].desc)+'</p><a class="more" href="#cat-'+k+'">항목 '+n+'개 보기</a></div>';
  });
  h+='</div><h2 class="sec">처음이라면 이 순서로 읽으세요</h2>';
  PATHS.forEach(function(p){
    h+='<div class="path"><h3>'+esc(p.h)+'</h3><p>'+esc(p.p)+'</p><ol>'+p.ids.filter(function(i){return BY[i];}).map(function(i){return '<li>'+tlink(i)+'</li>';}).join("")+'</ol></div>';
  });
  return h;
}
function viewCat(k){
  var list=SORTED.filter(function(t){return t.cat===k;});
  var h='<div class="crumb"><a href="#home">대문</a><span>›</span><span>분류</span></div><h1>'+esc(CATS[k].name)+'</h1><p class="lede">'+esc(CATS[k].desc)+' 항목 '+list.length+'개.</p>';
  if(!GROUPS[k])return h+rows(list);
  var used={};
  GROUPS[k].forEach(function(g){
    var ids=g[1].split(" "),sub=list.filter(function(t){return ids.indexOf(t.id)>=0;});
    sub.forEach(function(t){used[t.id]=1;});
    if(sub.length)h+='<h2 class="sec">'+esc(g[0])+' <small class="cnt">'+sub.length+'</small></h2>'+rows(sub);
  });
  var rest=list.filter(function(t){return !used[t.id];});
  if(rest.length)h+='<h2 class="sec">그 밖의 항목 <small class="cnt">'+rest.length+'</small></h2>'+rows(rest);
  return h;
}
function viewAll(){
  var h='<div class="crumb"><a href="#home">대문</a><span>›</span><span>찾아보기</span></div><h1>가나다순 전체 목록</h1><div class="idx">',cur="";
  SORTED.forEach(function(t){
    var i=initial(t.ko);
    if(i!==cur){if(cur)h+='</ul>';h+='<h3>'+i+'</h3><ul class="links">';cur=i;}
    h+='<li>'+tlink(t.id)+'</li>';
  });
  return h+'</ul></div>';
}
function viewTerm(t){
  var sib=SORTED.filter(function(x){return x.cat===t.cat;}),i=sib.indexOf(t);
  var h='<div class="crumb"><a href="#home">대문</a><span>›</span><a href="#cat-'+t.cat+'">'+esc(CATS[t.cat].name)+'</a></div>';
  h+='<h1>'+esc(t.ko)+'</h1><p class="en">'+esc(t.en)+' <span class="chip">'+dot(t.cat)+esc(CATS[t.cat].name)+'</span></p>';
  if(AKA[t.id])h+='<p class="aka"><b>이렇게도 부릅니다</b> · '+esc(AKA[t.id])+'</p>';
  h+='<div class="body"><p>'+esc(t.def)+'</p></div>';
  h+='<div class="tip"><b>작업할 때는</b>'+esc(t.tip)+'</div>';
  if(t.rel.length)h+='<h2 class="sec">함께 볼 항목</h2><ul class="links">'+t.rel.map(function(r){return '<li>'+tlink(r)+'</li>';}).join("")+'</ul>';
  var back=(BACK[t.id]||[]).filter(function(r){return t.rel.indexOf(r)<0;});
  if(back.length)h+='<h2 class="sec">이 항목을 가리키는 문서</h2><ul class="links">'+back.map(function(r){return '<li>'+tlink(r)+'</li>';}).join("")+'</ul>';
  h+='<div class="pn"><span>'+(i>0?'← '+tlink(sib[i-1].id):'')+'</span><span>'+(i<sib.length-1?tlink(sib[i+1].id)+' →':'')+'</span></div>';
  return h;
}
function viewSearch(q){
  var k=q.toLowerCase().replace(/\s+/g,"");
  function n(s){return s.toLowerCase().replace(/\s+/g,"");}
  var a=[],b=[];
  SORTED.forEach(function(t){
    if(n(t.ko).indexOf(k)>=0||n(t.en).indexOf(k)>=0||t.id.indexOf(k)>=0||(AKA[t.id]&&n(AKA[t.id]).indexOf(k)>=0))a.push(t);
    else if(n(t.def).indexOf(k)>=0||n(t.tip).indexOf(k)>=0)b.push(t);
  });
  var h='<h1>‘'+esc(q)+'’ 검색 결과</h1>';
  if(!a.length&&!b.length)return h+'<p class="empty">일치하는 항목이 없습니다. 영문 표기나 더 짧은 말로 다시 검색해 보세요. <a href="#all">전체 목록</a>에서 직접 찾을 수도 있습니다.</p>';
  if(a.length)h+='<h2 class="sec">제목이 일치하는 항목 '+a.length+'개</h2>'+rows(a);
  if(b.length)h+='<h2 class="sec">본문에 나오는 항목 '+b.length+'개</h2>'+rows(b);
  return h;
}
var main=document.getElementById("main"),qEl=document.getElementById("q");
function render(focus){
  var q=qEl.value.trim(),hash=(location.hash||"").replace(/^#/,""),html,cur="home",title="엠나인 음악용어 위키";
  if(q){html=viewSearch(q);cur="";}
  else if(hash.indexOf("cat-")===0&&CATS[hash.slice(4)]){html=viewCat(hash.slice(4));cur=hash;}
  else if(hash==="all"){html=viewAll();cur="all";}
  else if(BY[hash]){html=viewTerm(BY[hash]);cur="cat-"+BY[hash].cat;title=BY[hash].ko+" · 엠나인 음악용어 위키";}
  else html=viewHome();
  main.innerHTML=html;document.title=title;
  var links=document.querySelectorAll("nav.side a");
  for(var i=0;i<links.length;i++){
    var key=links[i].getAttribute("href").slice(1);
    if(key===cur)links[i].setAttribute("aria-current","page");else links[i].removeAttribute("aria-current");
  }
  if(focus){window.scrollTo(0,0);}
}
document.getElementById("catnav").innerHTML=Object.keys(CATS).map(function(k){
  var n=TERMS.filter(function(t){return t.cat===k;}).length;
  return '<li><a href="#cat-'+k+'">'+dot(k)+esc(CATS[k].name)+'<span class="n">'+n+'</span></a></li>';
}).join("");
window.addEventListener("hashchange",function(){qEl.value="";render(true);});
qEl.addEventListener("input",function(){render(false);});
main.addEventListener("click",function(e){
  var a=e.target.closest?e.target.closest("a"):null;
  if(a&&qEl.value&&a.getAttribute("href")===location.hash){qEl.value="";render(true);}
  else if(a&&qEl.value){qEl.value="";}
});
document.getElementById("rand").addEventListener("click",function(){
  var t=TERMS[Math.floor(Math.random()*TERMS.length)];qEl.value="";
  if(location.hash==="#"+t.id)render(true);else location.hash=t.id;
});
render(false);
</script>
</body>
</html>
